<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f7f7f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ましろLINE" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>ましろLINE（仮） Phase 2.6.1</title>
  <style>
:root {
  color-scheme: light;
  --bg: #eef1f5;
  --panel: #f8f8fa;
  --panel-strong: #ffffff;
  --text: #1c1c1e;
  --subtext: #74777d;
  --line: rgba(60, 60, 67, 0.15);
  --incoming: #ffffff;
  --outgoing: #d9f7be;
  --accent: #4d8f5b;
  --danger: #b84242;
  --shadow: 0 1px 3px rgba(0,0,0,.07);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}

body {
  overscroll-behavior: none;
}

button, textarea, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
}

.screen {
  width: 100%;
  height: 100%;
}

.screen[hidden] { display: none !important; }

.list-screen {
  display: grid;
  grid-template-rows: auto 1fr;
}

.list-header {
  padding: calc(12px + env(safe-area-inset-top)) 14px 13px 18px;
  background: rgba(248,248,250,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.list-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.list-header-copy { min-width: 0; }

.list-header h1 {
  margin: 0;
  font-size: 25px;
  line-height: 1.2;
  letter-spacing: -.02em;
}

.list-header p {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--subtext);
}

.settings-entry-button {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(116,119,125,.10);
  color: #5d6168;
  font-size: 21px;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.settings-entry-button:active { background: rgba(116,119,125,.18); }

.talk-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
}

.talk-item {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: #fff;
  display: grid;
  grid-template-columns: 54px 1fr auto;
  gap: 12px;
  align-items: center;
  text-align: left;
  padding: 12px 15px;
  cursor: pointer;
}

.talk-item:active { background: #f2f3f5; }

.talk-avatar,
.avatar {
  position: relative;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}

.talk-avatar {
  width: 54px;
  height: 54px;
  font-size: 17px;
}

.avatar {
  width: 38px;
  height: 38px;
  font-size: 14px;
}

.talk-avatar img,
.avatar img,
.settings-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.avatar-natsuki {
  background: #f3d99c;
  color: #6f5124;
}

.avatar-shiki {
  background: #d9d1ef;
  color: #51456d;
}

.avatar-ichi {
  background: #d9eef5;
  color: #315e6e;
}

.avatar-bunji {
  background: #efd8b7;
  color: #694b25;
}

.avatar-sosuke {
  background: #d7dde5;
  color: #3e4855;
}

.avatar-chiaki {
  background: #d9e8d2;
  color: #405a39;
}

.avatar-saku {
  background: #e3d8cf;
  color: #5c493d;
}

.avatar-yuna {
  background: #f0dfea;
  color: #704d63;
}

.avatar-mashiro {
  background: #d9e3ea;
  color: #475b68;
}

.talk-main { min-width: 0; }

.talk-topline {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.talk-name {
  font-size: 16px;
  font-weight: 700;
  min-width: 0;
}

.talk-preview {
  margin-top: 5px;
  color: #70747b;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.talk-side {
  min-width: 48px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
}

.talk-time {
  color: #8b8e94;
  font-size: 10px;
  white-space: nowrap;
}

.unread-badge {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: #e04b52;
  color: white;
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

.chat-screen {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
}

.topbar {
  min-height: 63px;
  padding: calc(7px + env(safe-area-inset-top)) 10px 7px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  background: rgba(248,248,250,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 5;
}

.icon-button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #62656b;
  font-size: 22px;
  cursor: pointer;
}

.icon-button:active { background: rgba(0,0,0,.06); }

.profile-heading {
  display: flex;
  gap: 9px;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.avatar-button {
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

.profile-text { min-width: 0; }

.profile-text h2 {
  margin: 0;
  font-size: 16px;
  line-height: 1.15;
}

.status-text {
  margin: 2px 0 0;
  font-size: 10px;
  color: var(--subtext);
}

.message-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 18px;
  scroll-behavior: smooth;
}

.day-divider {
  display: flex;
  justify-content: center;
  margin: 8px 0 14px;
}

.day-divider span {
  font-size: 11px;
  color: #74777d;
  background: rgba(255,255,255,.66);
  border-radius: 999px;
  padding: 4px 9px;
}

.message-row {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  margin-bottom: 10px;
}

.message-row.outgoing { justify-content: flex-end; }

.mini-avatar {
  width: 29px;
  height: 29px;
  font-size: 11px;
}

.message-stack {
  display: flex;
  flex-direction: column;
  max-width: min(76%, 540px);
}

.outgoing .message-stack { align-items: flex-end; }
.incoming .message-stack { align-items: flex-start; }

.bubble {
  padding: 9px 12px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: var(--shadow);
}

.incoming .bubble {
  background: var(--incoming);
  border-bottom-left-radius: 5px;
}

.outgoing .bubble {
  background: var(--outgoing);
  border-bottom-right-radius: 5px;
}

.message-meta {
  min-height: 15px;
  margin-top: 3px;
  color: #777b82;
  font-size: 10px;
  display: flex;
  gap: 5px;
}

.typing-row {
  min-height: 46px;
  display: none;
  align-items: center;
  gap: 7px;
  padding: 4px 12px 8px;
}

.typing-row.visible { display: flex; }

.typing-bubble {
  min-width: 54px;
  height: 32px;
  padding: 0 11px;
  background: white;
  border-radius: 16px 16px 16px 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: var(--shadow);
}

.typing-bubble span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #9b9ea4;
  animation: typing 1.05s infinite ease-in-out;
}

.typing-bubble span:nth-child(2) { animation-delay: .12s; }
.typing-bubble span:nth-child(3) { animation-delay: .24s; }

.typing-label {
  color: var(--subtext);
  font-size: 11px;
}

@keyframes typing {
  0%, 55%, 100% { transform: translateY(0); opacity: .45; }
  25% { transform: translateY(-3px); opacity: 1; }
}

.composer {
  display: grid;
  grid-template-columns: 1fr 42px;
  gap: 8px;
  align-items: end;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: rgba(248,248,250,.97);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.message-input {
  width: 100%;
  min-height: 42px;
  max-height: 120px;
  resize: none;
  border: 1px solid rgba(60,60,67,.2);
  border-radius: 22px;
  padding: 10px 15px;
  background: white;
  outline: none;
  font-size: 15px;
}

.message-input:focus { border-color: rgba(77,143,91,.55); }

.send-button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 0;
  background: #b6d2be;
  color: white;
  font-weight: 800;
  font-size: 17px;
}

.send-button:not(:disabled) {
  background: var(--accent);
  cursor: pointer;
}

.send-button:disabled { opacity: .65; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(82px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  max-width: calc(100% - 48px);
  padding: 10px 15px;
  border-radius: 14px;
  background: rgba(28,28,30,.92);
  color: white;
  font-size: 12px;
  line-height: 1.45;
  opacity: 0;
  pointer-events: none;
  transition: .18s ease;
  z-index: 30;
}

.toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

.dialog {
  border: 0;
  border-radius: 18px;
  padding: 0;
  width: min(90vw, 420px);
  background: transparent;
}

.dialog::backdrop {
  background: rgba(0,0,0,.34);
  backdrop-filter: blur(1px);
}

.dialog-card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 16px 50px rgba(0,0,0,.18);
}

.dialog-card h3 {
  margin: 0 0 8px;
  font-size: 19px;
}

.dialog-card p {
  margin: 0 0 16px;
  color: #666a71;
  font-size: 13px;
  line-height: 1.5;
}

.dialog-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 16px;
}

.dialog-button {
  min-height: 44px;
  border: 0;
  border-radius: 12px;
  background: #edf0f3;
  color: #33363b;
  font-weight: 700;
}

.dialog-button.primary {
  background: var(--accent);
  color: white;
}

.dialog-button.danger {
  background: #fbe9e9;
  color: var(--danger);
}

.dialog-button.full {
  grid-column: 1 / -1;
}

.dialog-input {
  width: 100%;
  min-height: 44px;
  border: 1px solid rgba(60,60,67,.23);
  border-radius: 12px;
  padding: 10px 12px;
  outline: none;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 13px;
  color: #565a61;
  font-size: 13px;
}

.check-row input {
  width: 18px;
  height: 18px;
}

.settings-avatar {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: 2px auto 14px;
  overflow: hidden;
  font-weight: 700;
  font-size: 24px;
}

.settings-caption {
  text-align: center;
  color: #74777d;
  font-size: 12px;
  margin: -7px 0 15px;
}


.avatar-group {
  background: linear-gradient(135deg, #d9e7ef, #e7ddf2);
  color: #46536b;
}

.sender-name {
  margin: 0 0 3px 4px;
  font-size: 10px;
  font-weight: 700;
  color: #6d7178;
}

.group-members {
  margin-top: 2px;
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.group-name-section {
  margin: 4px 0 12px;
}

.group-name-section label {
  display: block;
  margin-bottom: 6px;
  color: #666a71;
  font-size: 12px;
  font-weight: 700;
}



.settings-screen,
.profile-screen {
  display: grid;
  grid-template-rows: auto 1fr;
  background: #f2f3f5;
}

.settings-topbar {
  min-height: 58px;
  padding: calc(7px + env(safe-area-inset-top)) 10px 7px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  background: rgba(248,248,250,.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 5;
}

.settings-topbar h2 {
  margin: 0;
  text-align: center;
  font-size: 17px;
}

.settings-scroll,
.profile-editor-scroll {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 18px 14px calc(30px + env(safe-area-inset-bottom));
}

.settings-section {
  margin-bottom: 22px;
}

.settings-section-title {
  margin: 0 0 7px 5px;
  color: #72767d;
  font-size: 12px;
  font-weight: 700;
}

.settings-card {
  overflow: hidden;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 1px 0 rgba(0,0,0,.03);
}

.settings-row {
  width: 100%;
  min-height: 68px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: #fff;
  display: grid;
  grid-template-columns: 46px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 13px;
  text-align: left;
  cursor: pointer;
}

.settings-row:last-child { border-bottom: 0; }
.settings-row:active { background: #f4f5f6; }

.settings-row-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 15px;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}

.settings-row-avatar img,
.profile-editor-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.settings-row-main { min-width: 0; }

.settings-row-name {
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.settings-row-subtitle {
  margin-top: 3px;
  color: #7a7e85;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.settings-row-chevron {
  color: #a0a3a9;
  font-size: 22px;
  line-height: 1;
}

.profile-editor-card {
  max-width: 520px;
  margin: 0 auto;
}

.profile-editor-avatar {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  overflow: hidden;
  margin: 5px auto 10px;
  font-size: 32px;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
}

.profile-photo-button {
  display: block;
  margin: 0 auto 22px;
  border: 0;
  background: transparent;
  color: #1677d2;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.profile-form-card {
  border-radius: 14px;
  background: #fff;
  padding: 4px 14px;
}

.profile-field {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.profile-field:last-child { border-bottom: 0; }

.profile-field label {
  display: block;
  margin-bottom: 6px;
  color: #6f737a;
  font-size: 11px;
  font-weight: 700;
}

.profile-field input {
  width: 100%;
  border: 0;
  outline: none;
  padding: 0;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}

.profile-readonly-value {
  color: #6f737a;
  font-size: 15px;
}

.profile-note {
  margin: 10px 5px 0;
  color: #81858b;
  font-size: 11px;
  line-height: 1.5;
}

.profile-action-stack {
  display: grid;
  gap: 10px;
  margin-top: 18px;
}

.profile-action-button {
  min-height: 46px;
  border: 0;
  border-radius: 13px;
  background: #fff;
  color: #33363b;
  font-weight: 700;
  cursor: pointer;
}

.profile-action-button.primary {
  background: var(--accent);
  color: #fff;
}

.profile-action-button.danger {
  color: var(--danger);
}


.notification-card {
  border-radius: 16px;
  background: #fff;
  overflow: hidden;
}

.notification-summary {
  padding: 14px 15px;
  border-bottom: 1px solid var(--line);
}

.notification-status-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.notification-status-title {
  font-size: 15px;
  font-weight: 700;
}

.notification-status-badge {
  flex: 0 0 auto;
  border-radius: 999px;
  background: #eef1f4;
  color: #6b7076;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 700;
}

.notification-status-badge.enabled {
  background: #e0f5e7;
  color: #2e7d49;
}

.notification-note {
  margin-top: 8px;
  color: #7a7e85;
  font-size: 11px;
  line-height: 1.55;
}

.notification-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}

.notification-action {
  min-height: 42px;
  border: 0;
  border-radius: 11px;
  font-weight: 700;
  cursor: pointer;
}

.notification-action.primary {
  background: var(--accent);
  color: #fff;
}

.notification-action.secondary {
  background: #f0f2f4;
  color: #33363b;
}

.notification-action:disabled {
  opacity: .45;
  cursor: default;
}

.notification-forced-test-wrap {
  padding: 0 14px 12px;
  border-bottom: 1px solid var(--line);
}

.notification-forced-test {
  width: 100%;
  min-height: 44px;
  border: 1px solid #d7dbdf;
  border-radius: 11px;
  background: #fff;
  color: #33363b;
  font-weight: 700;
  cursor: pointer;
}

.notification-forced-test:disabled {
  opacity: .45;
  cursor: default;
}

.notification-forced-test-note {
  margin-top: 7px;
  color: #858a90;
  font-size: 10px;
  line-height: 1.45;
}

.notification-diagnostics-wrap {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: #fcfcfd;
}

.notification-diagnostic-select {
  width: 100%;
  min-height: 42px;
  margin-bottom: 8px;
  padding: 0 12px;
  border: 1px solid #d7dbdf;
  border-radius: 11px;
  background: #fff;
  color: #33363b;
  font-size: 12px;
  font-weight: 700;
}

.notification-diagnostics-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.notification-diagnostic-button {
  min-height: 42px;
  border: 1px solid #d7dbdf;
  border-radius: 11px;
  background: #fff;
  color: #33363b;
  font-weight: 700;
  font-size: 12px;
}

.notification-diagnostic-button.primary {
  background: #eef5f0;
  color: #386945;
  border-color: #d4e5d9;
}

.notification-diagnostic-button:disabled {
  opacity: .45;
}

.notification-diagnostics-panel {
  margin-top: 10px;
  padding: 11px 12px;
  border-radius: 11px;
  background: #f1f3f5;
  font-size: 11px;
  line-height: 1.58;
  color: #555a61;
  white-space: pre-wrap;
  word-break: break-word;
}

.notification-diagnostics-panel.good {
  background: #eaf6ed;
  color: #356344;
}

.notification-diagnostics-panel.warn {
  background: #fff3df;
  color: #795721;
}

.notification-diagnostics-panel.error {
  background: #fdecec;
  color: #8b3f3f;
}

.notification-setting-row {
  min-height: 52px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line);
}

.notification-setting-row:last-child {
  border-bottom: 0;
}

function seedNatsuki() {
  const now = new Date();
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  yesterday.setHours(21, 18, 0, 0);
  return [{ id:makeId(), senderId:"natsuki", text:"じゃ、また明日", createdAt:yesterday.toISOString(), readByCharacter:true, seenByUser:true, source:"seed" }];
}

function makeId() { return `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
function characterById(id) { return CHARACTERS[id] || null; }
function groupById(id) { return GROUPS[id] || null; }
function conversationById(id) { return CONVERSATIONS.find(c => c.id === id) || null; }
function activeConversation() { return appState.activeConversationId ? conversationById(appState.activeConversationId) : null; }
function activeCharacter() { const c=activeConversation(); return c?.type === "dm" ? characterById(c.characterId) : null; }
function activeGroup() { const c=activeConversation(); return c?.type === "group" ? groupById(c.groupId) : null; }

function messageKeyForConversation(conversationId) { return `mashiroLine.phase2.conversation.${conversationId}.messages.v1`; }
function memoryKey(characterId) { return `mashiroLine.phase2.character.${characterId}.memories.v1`; }
function proactiveKey(characterId) { return `mashiroLine.phase2.character.${characterId}.proactive.v1`; }
function avatarKey(characterId) { return `mashiroLine.phase2.character.${characterId}.avatar.v1`; }
function characterDisplayNameKey(characterId) { return `mashiroLine.phase2.character.${characterId}.displayName.v1`; }
function selfDisplayNameKey() { return "mashiroLine.phase2.self.displayName.v1"; }
function selfAvatarKey() { return "mashiroLine.phase2.self.avatar.v1"; }
function groupMemoryKey(groupId) { return `mashiroLine.phase2.group.${groupId}.memories.v1`; }
function groupProactiveKey(groupId) { return `mashiroLine.phase2.group.${groupId}.proactive.v1`; }
function groupAvatarKey(groupId) { return `mashiroLine.phase2.group.${groupId}.avatar.v1`; }
function groupNameKey(groupId) { return `mashiroLine.phase2.group.${groupId}.name.v1`; }

function conversationSeed(conversation) {
  if (conversation.type === "dm") return characterById(conversation.characterId).seed();
  return [];
}

function migrateLegacyNatsukiData() {
  const conv = conversationById("dm_natsuki");
  const newMessagesKey = messageKeyForConversation(conv.id);
  if (!localStorage.getItem(newMessagesKey)) {
    try {
      const raw = localStorage.getItem(LEGACY_NATSUKI_MESSAGES_KEY);
      const legacy = raw ? JSON.parse(raw) : null;
      if (Array.isArray(legacy) && legacy.length) {
        const migrated = legacy.map(message => ({
          id: message.id || makeId(),
          senderId: message.sender === "mashiro" ? "mashiro" : "natsuki",
          text: String(message.text || ""),
          createdAt: message.createdAt || new Date().toISOString(),
          readByCharacter: message.sender === "mashiro" ? Boolean(message.read) : true,
          seenByUser: message.sender !== "mashiro",
          source: message.proactive ? "proactive" : "migrated"
        }));
        localStorage.setItem(newMessagesKey, JSON.stringify(migrated));
      }
    } catch {}
  }
  if (!localStorage.getItem(memoryKey("natsuki"))) {
    const raw = localStorage.getItem(LEGACY_NATSUKI_MEMORY_KEY);
    if (raw) localStorage.setItem(memoryKey("natsuki"), raw);
  }
  if (!localStorage.getItem(proactiveKey("natsuki"))) {
    for (const oldKey of LEGACY_NATSUKI_PROACTIVE_KEYS) {
      const raw = localStorage.getItem(oldKey);
      if (raw) { localStorage.setItem(proactiveKey("natsuki"), raw); break; }
    }
  }
}

function loadConversationMessages(conversationId) {
  const conversation = conversationById(conversationId);
  if (!conversation) return [];
  try {
    const raw = localStorage.getItem(messageKeyForConversation(conversationId));
    if (!raw) {
      const seeded = conversationSeed(conversation);
      saveConversationMessages(conversationId, seeded);
      return seeded;
    }
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : conversationSeed(conversation);
  } catch { return conversationSeed(conversation); }
}
function saveConversationMessages(conversationId, messages) { localStorage.setItem(messageKeyForConversation(conversationId), JSON.stringify(messages)); schedulePushSync(); }

function pruneMemories(list) {
  const now = Date.now();
  const valid = (Array.isArray(list)?list:[]).filter(m => {
    if (!m || typeof m.text !== "string" || !m.text.trim()) return false;
    if (!m.expiresAt) return true;
    const t = Date.parse(m.expiresAt); return Number.isNaN(t) || t > now;
  });
  valid.sort((a,b) => Number(b.importance||1)-Number(a.importance||1) || Date.parse(b.updatedAt||b.createdAt||0)-Date.parse(a.updatedAt||a.createdAt||0));
  return valid.slice(0, MAX_LONG_TERM_MEMORIES);
}
function loadMemories(characterId) { try { const raw=localStorage.getItem(memoryKey(characterId)); return pruneMemories(raw?JSON.parse(raw):[]); } catch { return []; } }
function saveMemories(characterId, memories) { localStorage.setItem(memoryKey(characterId), JSON.stringify(pruneMemories(memories))); schedulePushSync(); }
function loadGroupMemories(groupId) { try { const raw=localStorage.getItem(groupMemoryKey(groupId)); return pruneMemories(raw?JSON.parse(raw):[]); } catch { return []; } }
function saveGroupMemories(groupId, memories) { localStorage.setItem(groupMemoryKey(groupId), JSON.stringify(pruneMemories(memories))); schedulePushSync(); }
function normalizeMemoryText(text) { return String(text||"").trim().replace(/\s+/g," ").replace(/[。．.]+$/g,"").toLowerCase(); }
function memoryExpiryFromTTL(ttlDays) { const d=Number(ttlDays); if(!Number.isFinite(d)||d>=3650)return null; const x=new Date();x.setDate(x.getDate()+Math.max(1,d));return x.toISOString(); }

function mergeCandidatesIntoList(existingList, candidates) {
  if (!Array.isArray(candidates) || !candidates.length) return existingList;
  const memories = pruneMemories(existingList);
  const nowIso = new Date().toISOString();
  for (const candidate of candidates.slice(0,3)) {
    const text=String(candidate?.text||"").trim().slice(0,240); if(!text)continue;
    const key=String(candidate?.key||"").trim().toLowerCase().replace(/[^a-z0-9_]+/g,"_").replace(/^_+|_+$/g,"").slice(0,80);
    const category=["event","preference","habit","promise","relationship","school","other"].includes(candidate?.category)?candidate.category:"other";
    const importance=[1,2,3].includes(Number(candidate?.importance))?Number(candidate.importance):1;
    const normalized=normalizeMemoryText(text);
    let existing=key?memories.find(m=>m.key===key):null;
    if(!existing) existing=memories.find(m=>normalizeMemoryText(m.text)===normalized)||null;
    if(existing){ existing.key=key||existing.key; existing.text=text; existing.category=category; existing.importance=Math.max(Number(existing.importance||1),importance); existing.updatedAt=nowIso; existing.expiresAt=memoryExpiryFromTTL(candidate?.ttlDays); }
    else memories.push({id:makeId(),key:key||`memory_${Date.now()}`,text,category,importance,createdAt:nowIso,updatedAt:nowIso,expiresAt:memoryExpiryFromTTL(candidate?.ttlDays)});
  }
  return pruneMemories(memories);
}
function mergeMemoryCandidates(characterId,candidates){ saveMemories(characterId, mergeCandidatesIntoList(loadMemories(characterId),candidates)); }
function mergeGroupMemoryCandidates(groupId,candidates){ saveGroupMemories(groupId, mergeCandidatesIntoList(loadGroupMemories(groupId),candidates)); }
function memoriesForAPI(characterId){ const m=loadMemories(characterId); saveMemories(characterId,m); return m.slice(0,MAX_MEMORIES_SENT_TO_AI); }
function groupMemoriesForAPI(groupId){ const m=loadGroupMemories(groupId); saveGroupMemories(groupId,m); return m.slice(0,MAX_MEMORIES_SENT_TO_AI); }

function getAvatarData(characterId){return localStorage.getItem(avatarKey(characterId))||"";}
function setAvatarData(characterId,dataUrl){ if(dataUrl)localStorage.setItem(avatarKey(characterId),dataUrl); else localStorage.removeItem(avatarKey(characterId)); }
function getCharacterDisplayName(characterId){const c=characterById(characterId);return localStorage.getItem(characterDisplayNameKey(characterId))||c?.displayName||characterId;}
function setCharacterDisplayName(characterId,name){const c=characterById(characterId);if(!c)return;const value=String(name||"").trim().slice(0,30);if(!value||value===c.displayName)localStorage.removeItem(characterDisplayNameKey(characterId));else localStorage.setItem(characterDisplayNameKey(characterId),value);}
function getSelfDisplayName(){return localStorage.getItem(selfDisplayNameKey())||SELF_PROFILE.defaultDisplayName;}
function setSelfDisplayName(name){const value=String(name||"").trim().slice(0,30);if(!value||value===SELF_PROFILE.defaultDisplayName)localStorage.removeItem(selfDisplayNameKey());else localStorage.setItem(selfDisplayNameKey(),value);}
function getSelfAvatarData(){return localStorage.getItem(selfAvatarKey())||"";}
function setSelfAvatarData(dataUrl){if(dataUrl)localStorage.setItem(selfAvatarKey(),dataUrl);else localStorage.removeItem(selfAvatarKey());}
function getGroupAvatarData(groupId){return localStorage.getItem(groupAvatarKey(groupId))||"";}
function setGroupAvatarData(groupId,dataUrl){ if(dataUrl)localStorage.setItem(groupAvatarKey(groupId),dataUrl); else localStorage.removeItem(groupAvatarKey(groupId)); }
function getGroupName(groupId){const g=groupById(groupId);return localStorage.getItem(groupNameKey(groupId))||g.defaultName;}

function baseAvatarClasses(element){

  return ["talk-avatar"];
}

  if(data){const img=document.createElement("img");img.src=data;img.alt=`${getCharacterDisplayName(characterId)}のアイコン`;element.appendChild(img);}else element.textContent=c.initial;

function applyGroupAvatar(element, groupId){

async function makeAvatarDataUrl(file){ const objectUrl=URL.createObjectURL(file); try{const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=objectUrl;});const size=Math.min(image.naturalWidth,image.naturalHeight);const sx=(image.naturalWidth-size)/2,sy=(image.naturalHeight-size)/2;const canvas=document.createElement("canvas");canvas.width=256;canvas.height=256;canvas.getContext("2d").drawImage(image,sx,sy,size,size,0,0,256,256);return canvas.toDataURL("image/jpeg",.86);}finally{URL.revokeObjectURL(objectUrl);} }

function formatClock(iso){return new Intl.DateTimeFormat("ja-JP",{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso));}
function formatListTime(iso){if(!iso)return"";const d=new Date(iso),n=new Date();if(d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate())return formatClock(iso);return new Intl.DateTimeFormat("ja-JP",{month:"numeric",day:"numeric"}).format(d);}
function dayLabel(iso){const d=new Date(iso),t=new Date(),y=new Date(t);y.setDate(t.getDate()-1);const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();if(same(d,t))return"今日";if(same(d,y))return"昨日";return new Intl.DateTimeFormat("ja-JP",{month:"numeric",day:"numeric",weekday:"short"}).format(d);}
function senderDisplayName(senderId){if(senderId==="mashiro")return getSelfDisplayName();return characterById(senderId)?getCharacterDisplayName(senderId):senderId;}

    const item=document.createElement("button");item.type="button";item.className="talk-item";item.dataset.conversationId=conversation.id;

function renderMessages(){
  const conversation=activeConversation();if(!conversation)return;const messages=loadConversationMessages(conversation.id);messageList.replaceChildren();let previousDay="";
  for(const message of messages){
    const currentDay=dayLabel(message.createdAt);if(currentDay!==previousDay){const divider=document.createElement("div");divider.className="day-divider";const span=document.createElement("span");span.textContent=currentDay;divider.appendChild(span);messageList.appendChild(divider);previousDay=currentDay;}
    const outgoing=message.senderId==="mashiro";const row=document.createElement("div");row.className=`message-row ${outgoing?"outgoing":"incoming"}`;
    if(!outgoing){const mini=document.createElement("div");applyCharacterAvatar(mini,message.senderId);mini.classList.add("mini-avatar");row.appendChild(mini);}
    const stack=document.createElement("div");stack.className="message-stack";
    if(conversation.type==="group"&&!outgoing){const sender=document.createElement("div");sender.className="sender-name";sender.textContent=senderDisplayName(message.senderId);stack.appendChild(sender);}
    const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=message.text;
    const meta=document.createElement("div");meta.className="message-meta";
    if(outgoing&&message.readByCharacter){const read=document.createElement("span");read.textContent=conversation.type==="group"?"既読 5":"既読";meta.appendChild(read);}
    const clock=document.createElement("span");clock.textContent=formatClock(message.createdAt);meta.appendChild(clock);stack.append(bubble,meta);row.appendChild(stack);messageList.appendChild(row);
  }
}

function profileTargetData(){
  const target=appState.profileTarget;if(!target)return null;
  if(target.type==="self")return {type:"self",id:"mashiro",defaultName:SELF_PROFILE.defaultDisplayName,fullName:SELF_PROFILE.fullName};
  if(target.type==="character"){
    const c=characterById(target.id);if(!c)return null;
    return {type:"character",id:c.id,defaultName:c.displayName,fullName:c.fullName};

  return {type:"group",id:g.id,defaultName:g.defaultName,fullName:`参加者 ${g.participants.length}人`};
}

function currentProfileDisplayName(data){
  if(data.type==="self")return getSelfDisplayName();

}

function saveProfileTarget(){
  const data=profileTargetData();if(!data)return;
  const value=String(profileNameInput.value||"").trim();
  if(!value){showToast(data.type==="group"?"グループ名を入力してください":"表示名を入力してください");return;}

  else setGroupAvatarData(data.id,dataUrl);

function addMessage(conversationId,senderId,text,options={}){
  const conversation=conversationById(conversationId);const messages=loadConversationMessages(conversationId);const activeVisible=appState.activeConversationId===conversationId&&!chatScreen.hidden&&document.visibilityState==="visible";
  const message={id:options.id||makeId(),pushEventId:options.pushEventId||null,senderId,text:String(text||"").trim(),createdAt:options.createdAt||new Date().toISOString(),readByCharacter:senderId==="mashiro"?Boolean(options.readByCharacter):true,seenByUser:senderId!=="mashiro"?(options.seenByUser??activeVisible):true,source:options.source||"ai"};
  messages.push(message);saveConversationMessages(conversationId,messages);if(appState.activeConversationId===conversationId){if(senderId!=="mashiro")markIncomingSeen(conversationId);renderMessages();scrollToBottom();}renderTalkList();return message;
}
function markOutgoingRead(conversationId){const messages=loadConversationMessages(conversationId);let changed=false;for(const m of messages){if(m.senderId==="mashiro"&&!m.readByCharacter){m.readByCharacter=true;changed=true;}}if(changed){saveConversationMessages(conversationId,messages);if(appState.activeConversationId===conversationId)renderMessages();renderTalkList();}}

function getAccessCode(){return localStorage.getItem(ACCESS_CODE_KEY)||"";}
function askForAccessCode(){return new Promise(resolve=>{accessCodeInput.value=getAccessCode();const cleanup=()=>{accessForm.removeEventListener("submit",onSubmit);accessCancel.removeEventListener("click",onCancel);accessDialog.removeEventListener("cancel",onCancel);};const onSubmit=e=>{e.preventDefault();const code=accessCodeInput.value.trim();if(!code){showToast("接続コードを入力してください");return;}localStorage.setItem(ACCESS_CODE_KEY,code);cleanup();accessDialog.close();resolve(code);};const onCancel=e=>{e?.preventDefault?.();cleanup();accessDialog.close();resolve("");};accessForm.addEventListener("submit",onSubmit);accessCancel.addEventListener("click",onCancel);accessDialog.addEventListener("cancel",onCancel);accessDialog.showModal();setTimeout(()=>accessCodeInput.focus(),50);});}
function normalizeBackendUrl(value){const raw=String(value||"").trim().replace(/\/+$/,"");if(!/^https:\/\//i.test(raw))return"";return `${raw}/api/chat`;}
function getApiEndpoint(){if(CONFIGURED_API_ENDPOINT)return CONFIGURED_API_ENDPOINT;const saved=localStorage.getItem(BACKEND_URL_KEY)||"";return saved?normalizeBackendUrl(saved):"";}
function endpointFor(apiEndpoint,kind){
  const base=String(apiEndpoint).replace(/\/api\/chat(?:\?.*)?$/,"/").replace(/\/$/,"");
  if(kind==="health")return `${base}/health`;
  if(kind==="proactive")return `${base}/api/proactive`;
  if(kind==="groupChat")return `${base}/api/group/chat`;
  if(kind==="groupProactive")return `${base}/api/group/proactive`;
  if(kind==="pushPublicKey")return `${base}/api/push/public-key`;
  if(kind==="pushRegister")return `${base}/api/push/register`;
  if(kind==="pushSync")return `${base}/api/push/sync`;
  if(kind==="pushPending")return `${base}/api/push/pending`;
  if(kind==="pushAck")return `${base}/api/push/ack`;
  if(kind==="pushUnregister")return `${base}/api/push/unregister`;
  if(kind==="pushTest")return `${base}/api/push/test`;
  if(kind==="pushNatsukiProactiveTest")return `${base}/api/push/test-proactive-natsuki`;
  if(kind==="pushDiagnostics")return `${base}/api/push/diagnostics`;
  if(kind==="pushRunDue")return `${base}/api/push/run-due`;
  return apiEndpoint;
}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function warmBackend(apiEndpoint){const health=endpointFor(apiEndpoint,"health");const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),10000);try{await fetch(health,{method:"GET",cache:"no-store",signal:controller.signal});}catch{}finally{clearTimeout(timeout);}}
function recentHistoryForAPI(conversationId){return loadConversationMessages(conversationId).slice(-40).map(m=>({senderId:m.senderId,text:m.text,createdAt:m.createdAt}));}

async function fetchJsonWithRetry(endpoint,options,retries=1){let lastError;for(let attempt=0;attempt<=retries;attempt++){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),60000);try{const response=await fetch(endpoint,{...options,signal:controller.signal,cache:"no-store"});const data=await response.json().catch(()=>({}));if(response.status===401){localStorage.removeItem(ACCESS_CODE_KEY);throw Object.assign(new Error("invalid_app_code"),{code:"invalid_app_code"});}if(!response.ok){const e=Object.assign(new Error(String(data?.error||`http_${response.status}`)),{code:[429,500,502,503,504].includes(response.status)?"temporary_error":response.status===403?"origin_not_allowed":"api_error"});throw e;}return data;}catch(error){lastError=error;const retryable=error?.name==="AbortError"||error instanceof TypeError||error?.code==="temporary_error";if(!retryable||attempt===retries)throw error;await sleep(1800);}finally{clearTimeout(timeout);}}throw lastError;}

async function callDmChat(conversation,accessCode,apiEndpoint){const c=characterById(conversation.characterId);return fetchJsonWithRetry(apiEndpoint,{method:"POST",headers:{"Content-Type":"application/json","X-App-Code":accessCode},body:JSON.stringify({characterId:c.id,conversationId:conversation.id,messages:recentHistoryForAPI(conversation.id),memories:memoriesForAPI(c.id),currentTime:new Date().toLocaleString("ja-JP",{dateStyle:"full",timeStyle:"short"}),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone})});}
function privateMemoriesForGroup(group){const map={};for(const id of group.participants){if(id!=="mashiro"&&characterById(id))map[id]=memoriesForAPI(id);}return map;}
async function callGroupChat(conversation,accessCode,apiEndpoint){const group=groupById(conversation.groupId);return fetchJsonWithRetry(endpointFor(apiEndpoint,"groupChat"),{method:"POST",headers:{"Content-Type":"application/json","X-App-Code":accessCode},body:JSON.stringify({groupId:group.id,conversationId:conversation.id,messages:recentHistoryForAPI(conversation.id),sharedMemories:groupMemoriesForAPI(group.id),privateMemoriesByCharacter:privateMemoriesForGroup(group),currentTime:new Date().toLocaleString("ja-JP",{dateStyle:"full",timeStyle:"short"}),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone})});}

async function sendUserMessage(){
  const conversation=activeConversation();const text=messageInput.value.trim();if(!conversation||!text||appState.isReplying)return;
  addMessage(conversation.id,"mashiro",text,{readByCharacter:false,source:"user"});messageInput.value="";autosizeInput();appState.isReplying=true;sendButton.disabled=true;await sleep(350);markOutgoingRead(conversation.id);setTyping(true);
  const apiEndpoint=getApiEndpoint();if(!apiEndpoint){setTyping(false);appState.isReplying=false;autosizeInput();showToast("AIバックエンドURLが設定されていません");return;}
  let accessCode=getAccessCode();if(!accessCode)accessCode=await askForAccessCode();if(!accessCode){setTyping(false);appState.isReplying=false;autosizeInput();return;}
  await warmBackend(apiEndpoint);
  try{
    if(conversation.type==="dm"){
      const result=await callDmChat(conversation,accessCode,apiEndpoint);await sleep(650);setTyping(false);addMessage(conversation.id,conversation.characterId,String(result.reply||"").trim(),{source:"ai",seenByUser:true});mergeMemoryCandidates(conversation.characterId,result.memoryCandidates);scheduleDmProactive(conversation.characterId,"normal");
    }else{
      const result=await callGroupChat(conversation,accessCode,apiEndpoint);setTyping(false);const replies=Array.isArray(result.replies)?result.replies.slice(0,3):[];
      for(const reply of replies){if(!characterById(reply?.speakerId)||!String(reply?.message||"").trim())continue;setTyping(true,reply.speakerId);await sleep(550+Math.min(850,String(reply.message).length*12));setTyping(false);addMessage(conversation.id,reply.speakerId,String(reply.message).trim(),{source:"group-ai",seenByUser:true});}
      mergeGroupMemoryCandidates(conversation.groupId,result.groupMemoryCandidates);scheduleGroupProactive(conversation.groupId,"normal");
    }
  }catch(error){setTyping(false);if(error?.code==="invalid_app_code"){showToast("接続コードが違います。もう一度入力してください");await askForAccessCode();}else showToast("AIに接続できませんでした。少し待ってもう一度試してください");}
  finally{appState.isReplying=false;autosizeInput();}
}


function defaultPushSettings(){
  const characterEnabled={};
  for(const id of Object.keys(CHARACTERS)) characterEnabled[id]=true;
  return {
    enabled:false,
    dmEnabled:true,
    groupEnabled:true,
    characterEnabled,
    quietStart:"22:30",
    quietEnd:"07:00"
  };
}

function getPushSettings(){
  try{
    const raw=localStorage.getItem(PUSH_SETTINGS_KEY);
    const parsed=raw?JSON.parse(raw):{};
    const defaults=defaultPushSettings();
    return {
      ...defaults,
      ...parsed,
      characterEnabled:{...defaults.characterEnabled,...(parsed?.characterEnabled||{})}
    };
  }catch{return defaultPushSettings();}
}

function savePushSettings(settings){
  localStorage.setItem(PUSH_SETTINGS_KEY,JSON.stringify(settings));
  schedulePushSync();
}

function getPushDeviceId(){
  let id=localStorage.getItem(PUSH_DEVICE_ID_KEY)||"";
  if(!id){
    id=(crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`);
    localStorage.setItem(PUSH_DEVICE_ID_KEY,id);
  }
  return id;
}

function isStandalonePwa(){
  return window.matchMedia?.("(display-mode: standalone)")?.matches || window.navigator.standalone===true;
}

function pushApiSupported(){
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

function pushNotificationsEnabled(){
  const settings=getPushSettings();
  return Boolean(settings.enabled && pushApiSupported() && Notification.permission==="granted");
}

function base64UrlToUint8Array(base64String){
  const padding="=".repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(ch=>ch.charCodeAt(0)));
}

function pushAuthHeaders(accessCode){
  return {"Content-Type":"application/json","X-App-Code":accessCode};
}

function pushUiLabels(){
  const characterDisplayNames={};
  for(const id of Object.keys(CHARACTERS))characterDisplayNames[id]=getCharacterDisplayName(id);
  const groupNames={};
  for(const id of Object.keys(GROUPS))groupNames[id]=getGroupName(id);
  return {characterDisplayNames,groupNames};
}

function buildPushSnapshot(){
  const dm={};
  for(const id of Object.keys(CHARACTERS)){
    const c=characterById(id);
    dm[id]={
      conversationId:c.conversationId,
      messages:recentHistoryForAPI(c.conversationId),
      memories:memoriesForAPI(id)
    };
  }

  const group={};
  for(const id of Object.keys(GROUPS)){
    const g=groupById(id);
    group[id]={
      conversationId:g.conversationId,
      messages:recentHistoryForAPI(g.conversationId),
      sharedMemories:groupMemoriesForAPI(id)
    };
  }

  return {version:PUSH_VERSION,ui:pushUiLabels(),scopes:{dm,group}};
}

async function currentPushSubscription(){
  if(!pushApiSupported())return null;
  const registration=await navigator.serviceWorker.ready;
  return registration.pushManager.getSubscription();
}

async function ensurePushSubscription(accessCode,apiEndpoint){
  const registration=await navigator.serviceWorker.ready;
  let subscription=await registration.pushManager.getSubscription();
  if(subscription)return subscription;

  const keyResult=await fetchJsonWithRetry(endpointFor(apiEndpoint,"pushPublicKey"),{
    method:"GET",
    headers:{"X-App-Code":accessCode}
  });

  const publicKey=String(keyResult?.publicKey||"");
  if(!publicKey)throw new Error("push_public_key_missing");

  subscription=await registration.pushManager.subscribe({
    userVisibleOnly:true,
    applicationServerKey:base64UrlToUint8Array(publicKey)
  });
  return subscription;
}

async function registerPushDevice(accessCode,apiEndpoint,subscription){
  const settings=getPushSettings();
  return fetchJsonWithRetry(endpointFor(apiEndpoint,"pushRegister"),{
    method:"POST",
    headers:pushAuthHeaders(accessCode),
    body:JSON.stringify({
      deviceId:getPushDeviceId(),
      subscription:subscription.toJSON(),
      timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
      settings,
      snapshot:buildPushSnapshot()
    })
  });
}

async function enablePushNotifications(){
  if(!pushApiSupported()){
    showToast("この環境はWeb通知に対応していません");
    return;
  }
  if(!isStandalonePwa()){
    showToast("通知はホーム画面のましろLINEから有効にしてください",5000);
    return;
  }

  const apiEndpoint=getApiEndpoint();
  if(!apiEndpoint){showToast("AIバックエンドURLが設定されていません");return;}
  let accessCode=getAccessCode();
  if(!accessCode)accessCode=await askForAccessCode();
  if(!accessCode)return;

  const permission=await Notification.requestPermission();
  if(permission!=="granted"){
    showToast("通知が許可されませんでした");
    renderSettingsScreen();
    return;
  }

  try{
    await warmBackend(apiEndpoint);
    const subscription=await ensurePushSubscription(accessCode,apiEndpoint);
    const settings=getPushSettings();
    settings.enabled=true;
    localStorage.setItem(PUSH_SETTINGS_KEY,JSON.stringify(settings));
    await registerPushDevice(accessCode,apiEndpoint,subscription);
    await pullPendingPushMessages();
    await syncPushSnapshotNow();
    renderSettingsScreen();
    updateAppBadgeFromLocal();
    showToast("通知を有効にしました");
  }catch(error){
    console.error(error);
    showToast(error?.message==="Push database is not configured"?"Replitのデータベース設定が必要です":"通知を有効にできませんでした",5000);
  }
}

async function disablePushNotifications(){
  const settings=getPushSettings();
  settings.enabled=false;
  localStorage.setItem(PUSH_SETTINGS_KEY,JSON.stringify(settings));

  const apiEndpoint=getApiEndpoint();
  const accessCode=getAccessCode();
  try{
    const sub=await currentPushSubscription();
    if(apiEndpoint&&accessCode){
      await fetchJsonWithRetry(endpointFor(apiEndpoint,"pushUnregister"),{
        method:"POST",
        headers:pushAuthHeaders(accessCode),
        body:JSON.stringify({deviceId:getPushDeviceId()})
      },0);
    }
    await sub?.unsubscribe?.();
  }catch{}
  renderSettingsScreen();
  updateAppBadgeFromLocal();
  showToast("通知をオフにしました");
}

function formatDiagnosticTime(iso){
  if(!iso)return "なし";
  try{
    return new Date(iso).toLocaleString("ja-JP",{
      month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"
    });
  }catch{return String(iso);}
}

function formatDiagnosticDuration(ms){
  const value=Math.max(0,Number(ms||0));
  if(value<1000)return "0秒";
  const minutes=Math.floor(value/60000);
  const hours=Math.floor(minutes/60);
  const remainMinutes=minutes%60;
  if(hours>0)return `${hours}時間${remainMinutes}分`;
  return `${minutes}分`;
}

async function fetchPushDiagnostics({render=true}={}){
  if(!pushNotificationsEnabled()){
    showToast("先に通知を有効にしてください");
    return null;
  }
  if(appState.pushDiagnosticsBusy)return appState.pushDiagnosticsData;

  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode)return null;

  appState.pushDiagnosticsBusy=true;
  if(render)renderSettingsScreen();

  try{
    const url=`${endpointFor(apiEndpoint,"pushDiagnostics")}?deviceId=${encodeURIComponent(getPushDeviceId())}&characterId=${encodeURIComponent(appState.pushDiagnosticsCharacterId||"natsuki")}`;
    const data=await fetchJsonWithRetry(url,{
      method:"GET",
      headers:{"X-App-Code":accessCode}
    },0);
    appState.pushDiagnosticsData=data;
  }catch(error){
    appState.pushDiagnosticsData={error:String(error?.message||"診断に失敗しました")};
  }finally{
    appState.pushDiagnosticsBusy=false;
    if(render)renderSettingsScreen();
  }

  return appState.pushDiagnosticsData;
}

async function runSchedulerDiagnosticOnce(){
  if(!pushNotificationsEnabled()){
    showToast("先に通知を有効にしてください");
    return;
  }
  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode)return;

  try{
    showToast("通常スケジューラを1回実行しています…",3000);
    const result=await fetchJsonWithRetry(endpointFor(apiEndpoint,"pushRunDue"),{
      method:"POST",
      headers:pushAuthHeaders(accessCode),
      body:JSON.stringify({source:"diagnostic-button"})
    },0);

    await sleep(500);
    await pullPendingPushMessages();
    const data=await fetchPushDiagnostics({render:false});
    if(data){
      data.manualRunResult=result;
      appState.pushDiagnosticsData=data;
    }
    renderSettingsScreen();

    if(Number(result?.sent||0)>0){
      showToast("通常スケジューラから通知を送信しました",4000);
    }else{
      showToast("通常スケジューラを実行しました。診断結果を確認してください",4500);
    }
  }catch(error){
    appState.pushDiagnosticsData={error:String(error?.message||"スケジューラ実行に失敗しました")};
    renderSettingsScreen();
    showToast("通常スケジューラの実行に失敗しました",4500);
  }
}

  if(!pushNotificationsEnabled())return;
  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode)return;

      })

async function pullPendingPushMessages(){
  if(!pushNotificationsEnabled())return;
  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode)return;

  try{
    const url=`${endpointFor(apiEndpoint,"pushPending")}?deviceId=${encodeURIComponent(getPushDeviceId())}`;
    const result=await fetchJsonWithRetry(url,{method:"GET",headers:{"X-App-Code":accessCode}},0);
    const events=Array.isArray(result?.events)?result.events:[];
    const ackIds=[];

    for(const event of events){
      const conversation=conversationById(event?.conversationId);
      if(!conversation||!event?.eventId||!String(event?.message||"").trim())continue;
      const messageId=`push-${event.eventId}`;
      const existing=loadConversationMessages(conversation.id).some(m=>m.id===messageId||m.pushEventId===event.eventId);
      if(!existing){
        addMessage(conversation.id,event.speakerId,String(event.message).trim(),{
          id:messageId,
          pushEventId:event.eventId,
          createdAt:event.createdAt||new Date().toISOString(),
          source:"push-proactive",
          seenByUser:appState.activeConversationId===conversation.id&&!chatScreen.hidden&&document.visibilityState==="visible"
        });
      }
      ackIds.push(event.eventId);
    }

    if(ackIds.length){
      await fetchJsonWithRetry(endpointFor(apiEndpoint,"pushAck"),{
        method:"POST",
        headers:pushAuthHeaders(accessCode),
        body:JSON.stringify({deviceId:getPushDeviceId(),eventIds:ackIds})
      },0);
      await syncPushSnapshotNow();
    }

    renderTalkList();
    if(appState.activeConversationId)renderMessages();
    updateAppBadgeFromLocal();
  }catch{}
}

function localUnreadCount(){
  let count=0;
  for(const conversation of CONVERSATIONS){
    count+=loadConversationMessages(conversation.id).filter(m=>m.senderId!=="mashiro"&&!m.seenByUser).length;
  }
  return count;
}

function updateAppBadgeFromLocal(){
  const count=localUnreadCount();
  try{
    if(count>0&&"setAppBadge" in navigator)navigator.setAppBadge(count);
    else if("clearAppBadge" in navigator)navigator.clearAppBadge();
  }catch{}
}

async function pushBridgeTick(){
  if(appState.pushBridgeBusy||!pushNotificationsEnabled())return;
  appState.pushBridgeBusy=true;
  try{
    await pullPendingPushMessages();
    if(document.visibilityState==="visible"){
      await syncPushSnapshotNow();
      await triggerPushDue();
      await sleep(350);
      await pullPendingPushMessages();
    }
  }finally{appState.pushBridgeBusy=false;}
}

function startPushBridge(){
  clearInterval(appState.pushBridgeTimer);
  appState.pushBridgeTimer=setInterval(pushBridgeTick,60*1000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(pushBridgeTick,350);});
  window.addEventListener("focus",()=>setTimeout(pushBridgeTick,350));
  navigator.serviceWorker?.addEventListener?.("message",(event)=>{
    if(event?.data?.type==="open-conversation"&&conversationById(event.data.conversationId)){
      openConversation(event.data.conversationId,true);
    }
  });
  setTimeout(pushBridgeTick,1800);
}

  const actions=document.createElement("div");actions.className="notification-actions";
  const mainButton=document.createElement("button");mainButton.type="button";mainButton.className="notification-action primary";mainButton.textContent=pushNotificationsEnabled()?"通知をオフ":"通知を有効にする";
  mainButton.disabled=!pushApiSupported()||(!isStandalonePwa()&&!pushNotificationsEnabled());
  mainButton.addEventListener("click",()=>pushNotificationsEnabled()?disablePushNotifications():enablePushNotifications());
  const testButton=document.createElement("button");testButton.type="button";testButton.className="notification-action secondary";testButton.textContent="テスト通知";testButton.disabled=!pushNotificationsEnabled();testButton.addEventListener("click",sendTestPush);
  actions.append(mainButton,testButton);
  card.appendChild(actions);

  const forcedWrap=document.createElement("div");forcedWrap.className="notification-forced-test-wrap";
  const forcedButton=document.createElement("button");forcedButton.type="button";forcedButton.className="notification-forced-test";forcedButton.textContent="夏樹の自発通知を今すぐテスト";forcedButton.disabled=!pushNotificationsEnabled();forcedButton.addEventListener("click",sendForcedNatsukiProactiveTest);
  const forcedNote=document.createElement("div");forcedNote.className="notification-forced-test-note";forcedNote.textContent="自然な待ち時間を無視し、このテスト時だけ夏樹から実際の自発メッセージを1通生成します。通常の送信回数・次回予定には影響しません。";
  forcedWrap.append(forcedButton,forcedNote);
  card.appendChild(forcedWrap);
  card.appendChild(buildPushDiagnosticsBlock());

  const enabled=pushNotificationsEnabled();
  card.appendChild(createNotificationToggle("個別トーク","キャラクターからの自発メッセージ",settings.dmEnabled,(value)=>{const s=getPushSettings();s.dmEnabled=value;savePushSettings(s);renderSettingsScreen();},!enabled));
  card.appendChild(createNotificationToggle("グループ","グループからの自発メッセージ",settings.groupEnabled,(value)=>{const s=getPushSettings();s.groupEnabled=value;savePushSettings(s);renderSettingsScreen();},!enabled));

  const charWrap=document.createElement("div");charWrap.className="notification-character-list";
  for(const id of Object.keys(CHARACTERS)){
    charWrap.appendChild(createNotificationToggle(
      getCharacterDisplayName(id),
      "このキャラクターの通知",
      settings.characterEnabled[id]!==false,
      (value)=>{const s=getPushSettings();s.characterEnabled[id]=value;savePushSettings(s);renderSettingsScreen();},
      !enabled||!settings.dmEnabled
    ));
  }
  card.appendChild(charWrap);

  const quietRow=document.createElement("div");quietRow.className="notification-setting-row";
  const quietCopy=document.createElement("div");
  const quietTitle=document.createElement("div");quietTitle.className="notification-setting-label";quietTitle.textContent="通知しない時間";
  const quietSub=document.createElement("div");quietSub.className="notification-setting-sub";quietSub.textContent="この時間帯は自発メッセージ通知を送りません";
  quietCopy.append(quietTitle,quietSub);
  const timeGrid=document.createElement("div");timeGrid.className="notification-time-grid";
  const start=document.createElement("input");start.type="time";start.className="notification-time-input";start.value=settings.quietStart;start.disabled=!enabled;
  const dash=document.createElement("span");dash.textContent="〜";
  const end=document.createElement("input");end.type="time";end.className="notification-time-input";end.value=settings.quietEnd;end.disabled=!enabled;
  const saveTimes=()=>{const s=getPushSettings();s.quietStart=start.value||"22:30";s.quietEnd=end.value||"07:00";savePushSettings(s);};
  start.addEventListener("change",saveTimes);end.addEventListener("change",saveTimes);
  timeGrid.append(start,dash,end);
  quietRow.append(quietCopy,timeGrid);
  card.appendChild(quietRow);

  section.append(heading,card);
  return section;
}

function dateKey(date=new Date()){return `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;}
function randomBetween(min,max){return min+Math.random()*(max-min);}
function isQuietTime(date=new Date()){const h=date.getHours()+date.getMinutes()/60;return h>=22.5||h<7;}
function nextMorningTimestamp(){const t=new Date();t.setDate(t.getDate()+(t.getHours()>=22?1:0));t.setHours(7,15+Math.floor(Math.random()*45),0,0);return t.getTime();}

function loadDmProactiveState(characterId){const c=characterById(characterId),now=Date.now();try{const raw=localStorage.getItem(proactiveKey(characterId));if(raw){const p=JSON.parse(raw);if(p.dailyDate!==dateKey()){p.dailyDate=dateKey();p.dailyCount=0;}if(!Number.isFinite(Number(p.nextDueAt)))p.nextDueAt=now+randomBetween(c.proactive.normalMinMs,c.proactive.normalMaxMs);return{nextDueAt:Number(p.nextDueAt),lastSentAt:Number(p.lastSentAt||0),dailyDate:p.dailyDate||dateKey(),dailyCount:Number(p.dailyCount||0)};}}catch{}return{nextDueAt:now+randomBetween(c.proactive.normalMinMs,c.proactive.normalMaxMs),lastSentAt:0,dailyDate:dateKey(),dailyCount:0};}
function saveDmProactiveState(id,state){localStorage.setItem(proactiveKey(id),JSON.stringify(state));schedulePushSync();}
function scheduleDmProactive(id,mode="normal"){const c=characterById(id),s=loadDmProactiveState(id),now=Date.now();if(isQuietTime())s.nextDueAt=nextMorningTimestamp();else if(mode==="retry")s.nextDueAt=now+randomBetween(12*60*1000,25*60*1000);else s.nextDueAt=now+randomBetween(c.proactive.normalMinMs,c.proactive.normalMaxMs);saveDmProactiveState(id,s);}
function latestMessage(conversationId,senderId=null){const messages=loadConversationMessages(conversationId);for(let i=messages.length-1;i>=0;i--){if(!senderId||messages[i].senderId===senderId)return messages[i];}return null;}

async function callDmProactive(characterId,accessCode,apiEndpoint){const c=characterById(characterId),conv=conversationById(c.conversationId),state=loadDmProactiveState(characterId);return fetchJsonWithRetry(endpointFor(apiEndpoint,"proactive"),{method:"POST",headers:{"Content-Type":"application/json","X-App-Code":accessCode},body:JSON.stringify({characterId,conversationId:conv.id,messages:recentHistoryForAPI(conv.id),memories:memoriesForAPI(characterId),currentTime:new Date().toLocaleString("ja-JP",{dateStyle:"full",timeStyle:"short"}),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,proactiveContext:{messagesToday:state.dailyCount,lastUserActivityAt:latestMessage(conv.id,"mashiro")?.createdAt||null,lastCharacterMessageAt:latestMessage(conv.id,characterId)?.createdAt||null}})});}
async function maybeSendDmProactive(characterId){
  if(document.visibilityState!=="visible")return;const c=characterById(characterId),conv=conversationById(c.conversationId),state=loadDmProactiveState(characterId);if(Date.now()<state.nextDueAt)return;if(isQuietTime()){scheduleDmProactive(characterId);return;}if(state.dailyCount>=c.proactive.dailyMax){state.nextDueAt=nextMorningTimestamp();saveDmProactiveState(characterId,state);return;}
  const latestUser=latestMessage(conv.id,"mashiro"),latestChar=latestMessage(conv.id,characterId),latestAny=latestMessage(conv.id),now=Date.now();if(latestUser&&now-Date.parse(latestUser.createdAt)<c.proactive.recentUserCooldownMs){scheduleDmProactive(characterId,"retry");return;}if(latestAny?.senderId===characterId&&latestChar&&now-Date.parse(latestChar.createdAt)<c.proactive.recentCharacterCooldownMs){scheduleDmProactive(characterId);return;}
  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();if(!apiEndpoint||!accessCode){scheduleDmProactive(characterId,"retry");return;}await warmBackend(apiEndpoint);const show=appState.activeConversationId===conv.id&&!chatScreen.hidden;if(show)setTyping(true,characterId);
  try{const result=await callDmProactive(characterId,accessCode,apiEndpoint);if(show){await sleep(700);setTyping(false);}if(result?.send&&result.message){addMessage(conv.id,characterId,result.message,{source:"proactive",seenByUser:show});state.lastSentAt=Date.now();state.dailyCount+=1;saveDmProactiveState(characterId,state);scheduleDmProactive(characterId);}else scheduleDmProactive(characterId,"retry");}catch{if(show)setTyping(false);scheduleDmProactive(characterId,"retry");}
}

function loadGroupProactiveState(groupId){const g=groupById(groupId),now=Date.now();try{const raw=localStorage.getItem(groupProactiveKey(groupId));if(raw){const p=JSON.parse(raw);if(p.dailyDate!==dateKey()){p.dailyDate=dateKey();p.dailyCount=0;}if(!Number.isFinite(Number(p.nextDueAt)))p.nextDueAt=now+randomBetween(g.proactive.normalMinMs,g.proactive.normalMaxMs);return{nextDueAt:Number(p.nextDueAt),lastSentAt:Number(p.lastSentAt||0),dailyDate:p.dailyDate||dateKey(),dailyCount:Number(p.dailyCount||0)};}}catch{}return{nextDueAt:now+randomBetween(g.proactive.normalMinMs,g.proactive.normalMaxMs),lastSentAt:0,dailyDate:dateKey(),dailyCount:0};}
function saveGroupProactiveState(id,state){localStorage.setItem(groupProactiveKey(id),JSON.stringify(state));schedulePushSync();}
function scheduleGroupProactive(id,mode="normal"){const g=groupById(id),s=loadGroupProactiveState(id),now=Date.now();if(isQuietTime())s.nextDueAt=nextMorningTimestamp();else if(mode==="retry")s.nextDueAt=now+randomBetween(20*60*1000,40*60*1000);else s.nextDueAt=now+randomBetween(g.proactive.normalMinMs,g.proactive.normalMaxMs);saveGroupProactiveState(id,s);}
async function callGroupProactive(groupId,accessCode,apiEndpoint){const g=groupById(groupId),state=loadGroupProactiveState(groupId);return fetchJsonWithRetry(endpointFor(apiEndpoint,"groupProactive"),{method:"POST",headers:{"Content-Type":"application/json","X-App-Code":accessCode},body:JSON.stringify({groupId,conversationId:g.conversationId,messages:recentHistoryForAPI(g.conversationId),sharedMemories:groupMemoriesForAPI(groupId),currentTime:new Date().toLocaleString("ja-JP",{dateStyle:"full",timeStyle:"short"}),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,proactiveContext:{messagesToday:state.dailyCount,lastActivityAt:latestMessage(g.conversationId)?.createdAt||null}})});}
async function maybeSendGroupProactive(groupId){
  if(document.visibilityState!=="visible")return;const g=groupById(groupId),state=loadGroupProactiveState(groupId);if(Date.now()<state.nextDueAt)return;if(isQuietTime()){scheduleGroupProactive(groupId);return;}if(state.dailyCount>=g.proactive.dailyMax){state.nextDueAt=nextMorningTimestamp();saveGroupProactiveState(groupId,state);return;}
  const latestUser=latestMessage(g.conversationId,"mashiro"),latestAny=latestMessage(g.conversationId),now=Date.now();if(latestUser&&now-Date.parse(latestUser.createdAt)<g.proactive.recentUserCooldownMs){scheduleGroupProactive(groupId,"retry");return;}if(latestAny&&latestAny.senderId!=="mashiro"&&now-Date.parse(latestAny.createdAt)<g.proactive.recentGroupCooldownMs){scheduleGroupProactive(groupId);return;}
  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();if(!apiEndpoint||!accessCode){scheduleGroupProactive(groupId,"retry");return;}await warmBackend(apiEndpoint);const show=appState.activeConversationId===g.conversationId&&!chatScreen.hidden;if(show)setTyping(true);
  try{const result=await callGroupProactive(groupId,accessCode,apiEndpoint);if(show)setTyping(false);const replies=Array.isArray(result?.replies)?result.replies.slice(0,2):[];if(replies.length){for(const reply of replies){if(!characterById(reply?.speakerId)||!String(reply?.message||"").trim())continue;if(show){setTyping(true,reply.speakerId);await sleep(500);setTyping(false);}addMessage(g.conversationId,reply.speakerId,String(reply.message).trim(),{source:"group-proactive",seenByUser:show});}state.lastSentAt=Date.now();state.dailyCount+=1;saveGroupProactiveState(groupId,state);scheduleGroupProactive(groupId);}else scheduleGroupProactive(groupId,"retry");}catch{if(show)setTyping(false);scheduleGroupProactive(groupId,"retry");}
}

async function proactiveTick(){if(pushNotificationsEnabled())return;if(appState.proactiveBusy||document.visibilityState!=="visible")return;appState.proactiveBusy=true;try{const due=[];for(const id of Object.keys(CHARACTERS)){const s=loadDmProactiveState(id);if(Date.now()>=s.nextDueAt)due.push({type:"dm",id,due:s.nextDueAt});}for(const id of Object.keys(GROUPS)){const s=loadGroupProactiveState(id);if(Date.now()>=s.nextDueAt)due.push({type:"group",id,due:s.nextDueAt});}due.sort((a,b)=>a.due-b.due);const next=due[0];if(next){if(next.type==="dm")await maybeSendDmProactive(next.id);else await maybeSendGroupProactive(next.id);}}finally{appState.proactiveBusy=false;}}
function startProactiveScheduler(){clearInterval(appState.proactiveTimer);setTimeout(proactiveTick,1500);appState.proactiveTimer=setInterval(proactiveTick,60*1000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(proactiveTick,700);});window.addEventListener("focus",()=>setTimeout(proactiveTick,700));}

async function resetActiveConversation(clearMemory){const conversation=activeConversation();if(!conversation)return;appState.currentRequestController?.abort();appState.isReplying=false;setTyping(false);saveConversationMessages(conversation.id,conversationSeed(conversation));if(conversation.type==="dm"){if(clearMemory)localStorage.removeItem(memoryKey(conversation.characterId));localStorage.removeItem(proactiveKey(conversation.characterId));}else{if(clearMemory)localStorage.removeItem(groupMemoryKey(conversation.groupId));localStorage.removeItem(groupProactiveKey(conversation.groupId));}resetMemoryCheckbox.checked=false;renderMessages();renderTalkList();autosizeInput();setTimeout(()=>scrollToBottom("auto"),0);}

composer.addEventListener("submit",e=>{e.preventDefault();sendUserMessage();});
messageInput.addEventListener("input",autosizeInput);messageInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();composer.requestSubmit();}});
backButton.addEventListener("click",()=>history.back());
resetButton.addEventListener("click",()=>{const conversation=activeConversation();if(!conversation)return;if(conversation.type==="dm"){const c=characterById(conversation.characterId);resetTitle.textContent=`${getCharacterDisplayName(c.id)}とのトークを初期化`;resetMemoryLabel.textContent="このキャラクターの長期記憶も削除する";}else{resetTitle.textContent="グループトークを初期化";resetMemoryLabel.textContent="このグループの共有記憶も削除する";}resetDialog.showModal();});
confirmReset.addEventListener("click",()=>resetActiveConversation(resetMemoryCheckbox.checked));
avatarButton.addEventListener("click",()=>{
  const conversation=activeConversation();if(!conversation)return;
  if(conversation.type==="dm")openProfileEditor("character",conversation.characterId,true);
  else openProfileEditor("group",conversation.groupId,true);
});
settingsButton.addEventListener("click",()=>showSettingsScreen(true));
settingsBackButton.addEventListener("click",()=>history.back());
profileBackButton.addEventListener("click",()=>history.back());
profileChooseAvatarButton.addEventListener("click",()=>profileAvatarFileInput.click());
profileAvatarFileInput.addEventListener("change",async()=>{
  const file=profileAvatarFileInput.files?.[0];profileAvatarFileInput.value="";if(!file)return;
  try{const data=await makeAvatarDataUrl(file);setProfileAvatar(data);showToast("アイコンを変更しました");}
  catch{showToast("画像を読み込めませんでした");}
});
profileSaveButton.addEventListener("click",saveProfileTarget);
profileNameInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();saveProfileTarget();}});
profileResetAvatarButton.addEventListener("click",()=>{setProfileAvatar("");showToast("標準アイコンに戻しました");});
profileResetAllButton.addEventListener("click",resetProfileAll);
window.addEventListener("popstate",e=>{
  const state=e.state||{};
  if(state.conversationId&&conversationById(state.conversationId))openConversation(state.conversationId,false);
  else if(state.settings)showSettingsScreen(false);
  else if(state.profile?.type)openProfileEditor(state.profile.type,state.profile.id,false);
  else showTalkList(false);
});

function registerServiceWorker(){if(!("serviceWorker" in navigator))return;let reloading=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload();});window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));}

migrateLegacyNatsukiData();
const initialChatMatch=location.hash.match(/^#chat=([^&]+)$/);
const initialConversationId=initialChatMatch?decodeURIComponent(initialChatMatch[1]):"";
history.replaceState({list:true},"",location.pathname+location.search);
renderTalkList();showTalkList(false);autosizeInput();registerServiceWorker();startProactiveScheduler();startPushBridge();
if(initialConversationId&&conversationById(initialConversationId)){
  setTimeout(()=>{openConversation(initialConversationId,false);history.replaceState({conversationId:initialConversationId},"",`#chat=${encodeURIComponent(initialConversationId)}`);},250);
}
