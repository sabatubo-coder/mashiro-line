<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f7f7f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ましろLINE" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>ましろLINE（仮） Phase 2.1</title>
  <style>
:root {
  color-scheme: light;
  --bg: #eef1f5;
  --panel: #f8f8fa;
  --panel-strong: #ffffff;
  --text: #1c1c1e;
  --subtext: #74777d;
  --line: rgba(60, 60, 67, 0.15);
  --incoming: #ffffff;
  --outgoing: #d9f7be;
  --accent: #4d8f5b;
  --danger: #b84242;
  --shadow: 0 1px 3px rgba(0,0,0,.07);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}

body {
  overscroll-behavior: none;
}

button, textarea, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
}

.screen {
  width: 100%;
  height: 100%;
}

.screen[hidden] { display: none !important; }

.list-screen {
  display: grid;
  grid-template-rows: auto 1fr;
}

.list-header {
  padding: calc(12px + env(safe-area-inset-top)) 18px 13px;
  background: rgba(248,248,250,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.list-header h1 {
  margin: 0;
  font-size: 25px;
  line-height: 1.2;
  letter-spacing: -.02em;
}

.list-header p {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--subtext);
}

.talk-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
}

.talk-item {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: #fff;
  display: grid;
  grid-template-columns: 54px 1fr auto;
  gap: 12px;
  align-items: center;
  text-align: left;
  padding: 12px 15px;
  cursor: pointer;
}

.talk-item:active { background: #f2f3f5; }

.talk-avatar,
.avatar {
  position: relative;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}

.talk-avatar {
  width: 54px;
  height: 54px;
  font-size: 17px;
}

.avatar {
  width: 38px;
  height: 38px;
  font-size: 14px;
}

.talk-avatar img,
.avatar img,
.settings-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.avatar-natsuki {
  background: #f3d99c;
  color: #6f5124;
}

.avatar-shiki {
  background: #d9d1ef;
  color: #51456d;
}

.avatar-ichi {
  background: #d9eef5;
  color: #315e6e;
}

.avatar-bunji {
  background: #efd8b7;
  color: #694b25;
}

.avatar-sosuke {
  background: #d7dde5;
  color: #3e4855;
}

.avatar-chiaki {
  background: #d9e8d2;
  color: #405a39;
}

.avatar-saku {
  background: #e3d8cf;
  color: #5c493d;
}

.avatar-yuna {
  background: #f0dfea;
  color: #704d63;
}

.talk-main { min-width: 0; }

.talk-topline {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.talk-name {
  font-size: 16px;
  font-weight: 700;
  min-width: 0;
}

.talk-preview {
  margin-top: 5px;
  color: #70747b;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.talk-side {
  min-width: 48px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
}

.talk-time {
  color: #8b8e94;
  font-size: 10px;
  white-space: nowrap;
}

.unread-badge {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: #e04b52;
  color: white;
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

.chat-screen {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
}

.topbar {
  min-height: 63px;
  padding: calc(7px + env(safe-area-inset-top)) 10px 7px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  background: rgba(248,248,250,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 5;
}

.icon-button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #62656b;
  font-size: 22px;
  cursor: pointer;
}

.icon-button:active { background: rgba(0,0,0,.06); }

.profile-heading {
  display: flex;
  gap: 9px;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.avatar-button {
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

.profile-text { min-width: 0; }

.profile-text h2 {
  margin: 0;
  font-size: 16px;
  line-height: 1.15;
}

.status-text {
  margin: 2px 0 0;
  font-size: 10px;
  color: var(--subtext);
}

.message-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 18px;
  scroll-behavior: smooth;
}

.day-divider {
  display: flex;
  justify-content: center;
  margin: 8px 0 14px;
}

.day-divider span {
  font-size: 11px;
  color: #74777d;
  background: rgba(255,255,255,.66);
  border-radius: 999px;
  padding: 4px 9px;
}

.message-row {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  margin-bottom: 10px;
}

.message-row.outgoing { justify-content: flex-end; }

.mini-avatar {
  width: 29px;
  height: 29px;
  font-size: 11px;
}

.message-stack {
  display: flex;
  flex-direction: column;
  max-width: min(76%, 540px);
}

.outgoing .message-stack { align-items: flex-end; }
.incoming .message-stack { align-items: flex-start; }

.bubble {
  padding: 9px 12px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: var(--shadow);
}

.incoming .bubble {
  background: var(--incoming);
  border-bottom-left-radius: 5px;
}

.outgoing .bubble {
  background: var(--outgoing);
  border-bottom-right-radius: 5px;
}

.message-meta {
  min-height: 15px;
  margin-top: 3px;
  color: #777b82;
  font-size: 10px;
  display: flex;
  gap: 5px;
}

.typing-row {
  min-height: 46px;
  display: none;
  align-items: center;
  gap: 7px;
  padding: 4px 12px 8px;
}

.typing-row.visible { display: flex; }

.typing-bubble {
  min-width: 54px;
  height: 32px;
  padding: 0 11px;
  background: white;
  border-radius: 16px 16px 16px 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: var(--shadow);
}

.typing-bubble span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #9b9ea4;
  animation: typing 1.05s infinite ease-in-out;
}

.typing-bubble span:nth-child(2) { animation-delay: .12s; }
.typing-bubble span:nth-child(3) { animation-delay: .24s; }

.typing-label {
  color: var(--subtext);
  font-size: 11px;
}

@keyframes typing {
  0%, 55%, 100% { transform: translateY(0); opacity: .45; }
  25% { transform: translateY(-3px); opacity: 1; }
}

.composer {
  display: grid;
  grid-template-columns: 1fr 42px;
  gap: 8px;
  align-items: end;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: rgba(248,248,250,.97);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.message-input {
  width: 100%;
  min-height: 42px;
  max-height: 120px;
  resize: none;
  border: 1px solid rgba(60,60,67,.2);
  border-radius: 22px;
  padding: 10px 15px;
  background: white;
  outline: none;
  font-size: 15px;
}

.message-input:focus { border-color: rgba(77,143,91,.55); }

.send-button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 0;
  background: #b6d2be;
  color: white;
  font-weight: 800;
  font-size: 17px;
}

.send-button:not(:disabled) {
  background: var(--accent);
  cursor: pointer;
}

.send-button:disabled { opacity: .65; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(82px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  max-width: calc(100% - 48px);
  padding: 10px 15px;
  border-radius: 14px;
  background: rgba(28,28,30,.92);
  color: white;
  font-size: 12px;
  line-height: 1.45;
  opacity: 0;
  pointer-events: none;
  transition: .18s ease;
  z-index: 30;
}

.toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

.dialog {
  border: 0;
  border-radius: 18px;
  padding: 0;
  width: min(90vw, 420px);
  background: transparent;
}

.dialog::backdrop {
  background: rgba(0,0,0,.34);
  backdrop-filter: blur(1px);
}

.dialog-card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 16px 50px rgba(0,0,0,.18);
}

.dialog-card h3 {
  margin: 0 0 8px;
  font-size: 19px;
}

.dialog-card p {
  margin: 0 0 16px;
  color: #666a71;
  font-size: 13px;
  line-height: 1.5;
}

.dialog-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 16px;
}

.dialog-button {
  min-height: 44px;
  border: 0;
  border-radius: 12px;
  background: #edf0f3;
  color: #33363b;
  font-weight: 700;
}

.dialog-button.primary {
  background: var(--accent);
  color: white;
}

.dialog-button.danger {
  background: #fbe9e9;
  color: var(--danger);
}

.dialog-button.full {
  grid-column: 1 / -1;
}

.dialog-input {
  width: 100%;
  min-height: 44px;
  border: 1px solid rgba(60,60,67,.23);
  border-radius: 12px;
  padding: 10px 12px;
  outline: none;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 13px;
  color: #565a61;
  font-size: 13px;
}

.check-row input {
  width: 18px;
  height: 18px;
}

.settings-avatar {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: 2px auto 14px;
  overflow: hidden;
  font-weight: 700;
  font-size: 24px;
}

.settings-caption {
  text-align: center;
  color: #74777d;
  font-size: 12px;
  margin: -7px 0 15px;
}

@media (min-width: 780px) {
  .app {
    max-width: 620px;
    margin: 0 auto;
    box-shadow: 0 0 0 1px rgba(0,0,0,.04);
  }
}
  </style>
</head>
<body>
<div class="app">
  <section id="listScreen" class="screen list-screen">
    <header class="list-header">
      <h1>トーク</h1>
      <p>ましろLINE（仮）</p>
    </header>
    <main id="talkList" class="talk-list" aria-label="トーク一覧"></main>
  </section>

  <section id="chatScreen" class="screen chat-screen" hidden>
    <header class="topbar">
      <button id="backButton" class="icon-button" type="button" aria-label="トーク一覧へ戻る">‹</button>

      <div class="profile-heading">
        <button id="avatarButton" class="avatar-button" type="button" aria-label="アイコン設定">
          <div id="headerAvatar" class="avatar"></div>
        </button>
        <div class="profile-text">
          <h2 id="chatTitle">夏樹</h2>
          <p id="statusText" class="status-text">オンライン</p>
        </div>
      </div>

      <button id="resetButton" class="icon-button" type="button" aria-label="トーク初期化">↻</button>
    </header>

    <main id="messageList" class="message-list"></main>

    <div id="typingRow" class="typing-row" aria-hidden="true">
      <div id="typingAvatar" class="avatar mini-avatar"></div>
      <div class="typing-bubble"><span></span><span></span><span></span></div>
      <div id="typingLabel" class="typing-label">入力中…</div>
    </div>

    <form id="composer" class="composer">
      <textarea id="messageInput" class="message-input" rows="1" maxlength="1200" placeholder="メッセージ"></textarea>
      <button id="sendButton" class="send-button" type="submit" disabled>➤</button>
    </form>
  </section>
</div>

<div id="toast" class="toast"></div>

<dialog id="accessDialog" class="dialog">
  <form id="accessForm" class="dialog-card">
    <h3>AI接続コード</h3>
    <p>ReplitのAPP_ACCESS_CODEに設定した接続コードを入力してください。このiPhone内だけに保存します。</p>
    <input id="accessCodeInput" class="dialog-input" type="password" autocomplete="off" maxlength="120" placeholder="接続コード" />
    <div class="dialog-actions">
      <button id="accessCancel" class="dialog-button" type="button">キャンセル</button>
      <button class="dialog-button primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<dialog id="resetDialog" class="dialog">
  <form method="dialog" class="dialog-card">
    <h3 id="resetTitle">トークを初期化</h3>
    <p>このキャラクターとのトーク履歴を最初の状態に戻します。</p>
    <label class="check-row">
      <input id="resetMemoryCheckbox" type="checkbox" />
      <span>このキャラクターの長期記憶も削除する</span>
    </label>
    <div class="dialog-actions">
      <button class="dialog-button" value="cancel">キャンセル</button>
      <button id="confirmReset" class="dialog-button danger" value="default">初期化</button>
    </div>
  </form>
</dialog>

<dialog id="characterDialog" class="dialog">
  <form method="dialog" class="dialog-card">
    <h3 id="characterSettingsTitle">アイコン設定</h3>
    <div id="settingsAvatar" class="settings-avatar"></div>
    <div class="settings-caption">選んだ画像はこのiPhone内だけに保存されます。</div>
    <input id="avatarFileInput" type="file" accept="image/*" hidden />
    <div class="dialog-actions">
      <button id="chooseAvatarButton" class="dialog-button primary full" type="button">写真からアイコンを選ぶ</button>
      <button id="resetAvatarButton" class="dialog-button full" type="button">標準アイコンに戻す</button>
      <button class="dialog-button full" value="cancel">閉じる</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>

function makeId() {
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function characterById(characterId) {
  return CHARACTERS[characterId] || null;
}

function messageKey(characterId) {
  return `mashiroLine.phase2.conversation.${characterById(characterId).conversationId}.messages.v1`;
}

function memoryKey(characterId) {
  return `mashiroLine.phase2.character.${characterId}.memories.v1`;
}

function proactiveKey(characterId) {
  return `mashiroLine.phase2.character.${characterId}.proactive.v1`;
}

function avatarKey(characterId) {
  return `mashiroLine.phase2.character.${characterId}.avatar.v1`;
}

function migrateLegacyNatsukiData() {
  const newMessagesKey = messageKey("natsuki");
  if (!localStorage.getItem(newMessagesKey)) {
    try {
      const raw = localStorage.getItem(LEGACY_NATSUKI_MESSAGES_KEY);
      const legacy = raw ? JSON.parse(raw) : null;
      if (Array.isArray(legacy) && legacy.length) {
        const migrated = legacy.map((message) => ({
          id: message.id || makeId(),
          senderId: message.sender === "mashiro" ? "mashiro" : "natsuki",
          text: String(message.text || ""),
          createdAt: message.createdAt || new Date().toISOString(),
          readByCharacter: message.sender === "mashiro" ? Boolean(message.read) : true,
          seenByUser: message.sender !== "mashiro",
          source: message.proactive ? "proactive" : "migrated"
        }));
        localStorage.setItem(newMessagesKey, JSON.stringify(migrated));
      }
    } catch {}
  }

  const newMemoryKey = memoryKey("natsuki");
  if (!localStorage.getItem(newMemoryKey)) {
    const raw = localStorage.getItem(LEGACY_NATSUKI_MEMORY_KEY);
    if (raw) localStorage.setItem(newMemoryKey, raw);
  }

  const newProactiveKey = proactiveKey("natsuki");
  if (!localStorage.getItem(newProactiveKey)) {
    for (const oldKey of LEGACY_NATSUKI_PROACTIVE_KEYS) {
      const raw = localStorage.getItem(oldKey);
      if (raw) {
        localStorage.setItem(newProactiveKey, raw);
        break;
      }
    }
  }
}

function loadMessages(characterId) {
  const character = characterById(characterId);
  try {
    const raw = localStorage.getItem(messageKey(characterId));
    if (!raw) {
      const seeded = character.seed();
      saveMessages(characterId, seeded);
      return seeded;
    }
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : character.seed();
  } catch {
    return character.seed();
  }
}

function saveMessages(characterId, messages) {
  localStorage.setItem(messageKey(characterId), JSON.stringify(messages));
}

function pruneMemories(list) {
  const now = Date.now();
  const valid = (Array.isArray(list) ? list : []).filter((memory) => {
    if (!memory || typeof memory.text !== "string" || !memory.text.trim()) return false;
    if (!memory.expiresAt) return true;
    const expiresAt = Date.parse(memory.expiresAt);
    return Number.isNaN(expiresAt) || expiresAt > now;
  });

  valid.sort((a, b) => {
    const importance = Number(b.importance || 1) - Number(a.importance || 1);
    if (importance !== 0) return importance;
    return Date.parse(b.updatedAt || b.createdAt || 0) - Date.parse(a.updatedAt || a.createdAt || 0);
  });

  return valid.slice(0, MAX_LONG_TERM_MEMORIES);
}

function loadMemories(characterId) {
  try {
    const raw = localStorage.getItem(memoryKey(characterId));
    return pruneMemories(raw ? JSON.parse(raw) : []);
  } catch {
    return [];
  }
}

function saveMemories(characterId, memories) {
  localStorage.setItem(memoryKey(characterId), JSON.stringify(pruneMemories(memories)));
}

function normalizeMemoryText(text) {
  return String(text || "")
    .trim()
    .replace(/\s+/g, " ")
    .replace(/[。．.]+$/g, "")
    .toLowerCase();
}

function memoryExpiryFromTTL(ttlDays) {
  const days = Number(ttlDays);
  if (!Number.isFinite(days) || days >= 3650) return null;
  const date = new Date();
  date.setDate(date.getDate() + Math.max(1, days));
  return date.toISOString();
}

function mergeMemoryCandidates(characterId, candidates) {
  if (!Array.isArray(candidates) || !candidates.length) return;

  const memories = loadMemories(characterId);
  const nowIso = new Date().toISOString();

  for (const candidate of candidates.slice(0, 2)) {
    const text = String(candidate?.text || "").trim().slice(0, 240);
    if (!text) continue;

    const key = String(candidate?.key || "")
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]+/g, "_")
      .replace(/^_+|_+$/g, "")
      .slice(0, 80);

    const category = ["event", "preference", "habit", "promise", "relationship", "school", "other"]
      .includes(candidate?.category)
      ? candidate.category
      : "other";

    const importance = [1,2,3].includes(Number(candidate?.importance))
      ? Number(candidate.importance)
      : 1;

    const normalized = normalizeMemoryText(text);

    let existing = key ? memories.find((memory) => memory.key === key) : null;
    if (!existing) {
      existing = memories.find((memory) => normalizeMemoryText(memory.text) === normalized) || null;
    }

    if (existing) {
      existing.key = key || existing.key;
      existing.text = text;
      existing.category = category;
      existing.importance = Math.max(Number(existing.importance || 1), importance);
      existing.updatedAt = nowIso;
      existing.expiresAt = memoryExpiryFromTTL(candidate?.ttlDays);
    } else {
      memories.push({
        id: makeId(),
        key: key || `memory_${Date.now()}`,
        text,
        category,
        importance,
        createdAt: nowIso,
        updatedAt: nowIso,
        expiresAt: memoryExpiryFromTTL(candidate?.ttlDays)
      });
    }
  }

  saveMemories(characterId, memories);
}

function memoriesForAPI(characterId) {
  const memories = loadMemories(characterId);
  saveMemories(characterId, memories);
  return memories.slice(0, MAX_MEMORIES_SENT_TO_AI);
}

function getAvatarData(characterId) {
  return localStorage.getItem(avatarKey(characterId)) || "";
}

function setAvatarData(characterId, dataUrl) {
  if (dataUrl) localStorage.setItem(avatarKey(characterId), dataUrl);
  else localStorage.removeItem(avatarKey(characterId));
}

function applyAvatar(element, characterId) {
  const character = characterById(characterId);
  const dataUrl = getAvatarData(characterId);

  element.className = "";
  if (element.id === "headerAvatar") element.classList.add("avatar");
  else if (element.id === "typingAvatar") element.classList.add("avatar", "mini-avatar");
  else if (element.id === "settingsAvatar") element.classList.add("settings-avatar");
  else element.classList.add("talk-avatar");

  element.classList.add(character.avatarClass);
  element.replaceChildren();

  if (dataUrl) {
    const img = document.createElement("img");
    img.src = dataUrl;
    img.alt = `${character.displayName}のアイコン`;
    element.appendChild(img);
  } else {
    element.textContent = character.initial;
  }
}

async function makeAvatarDataUrl(file) {
  const objectUrl = URL.createObjectURL(file);

  try {
    const image = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = objectUrl;
    });

    const size = Math.min(image.naturalWidth, image.naturalHeight);
    const sx = (image.naturalWidth - size) / 2;
    const sy = (image.naturalHeight - size) / 2;
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;
    const context = canvas.getContext("2d");
    context.drawImage(image, sx, sy, size, size, 0, 0, 256, 256);
    return canvas.toDataURL("image/jpeg", .86);
  } finally {
    URL.revokeObjectURL(objectUrl);
  }
}

function formatClock(iso) {
  const date = new Date(iso);
  return new Intl.DateTimeFormat("ja-JP", { hour: "2-digit", minute: "2-digit", hour12: false }).format(date);
}

function formatListTime(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  const now = new Date();
  const sameDay =
    date.getFullYear() === now.getFullYear() &&
    date.getMonth() === now.getMonth() &&
    date.getDate() === now.getDate();

  if (sameDay) return formatClock(iso);

  return new Intl.DateTimeFormat("ja-JP", { month: "numeric", day: "numeric" }).format(date);
}

function dayLabel(iso) {
  const date = new Date(iso);
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);

  const same = (a, b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();

  if (same(date, today)) return "今日";
  if (same(date, yesterday)) return "昨日";

  return new Intl.DateTimeFormat("ja-JP", { month: "numeric", day: "numeric", weekday: "short" }).format(date);
}

function renderTalkList() {
  talkList.replaceChildren();

  for (const conversation of CONVERSATIONS) {
    const character = characterById(conversation.characterId);
    const messages = loadMessages(character.id);
    const last = messages[messages.length - 1] || null;
    const unread = messages.filter((message) =>
      message.senderId === character.id && !message.seenByUser
    ).length;

    const item = document.createElement("button");
    item.type = "button";
    item.className = "talk-item";
    item.dataset.characterId = character.id;

    const avatar = document.createElement("div");
    applyAvatar(avatar, character.id);

    const main = document.createElement("div");
    main.className = "talk-main";

    const topline = document.createElement("div");
    topline.className = "talk-topline";

    const name = document.createElement("div");
    name.className = "talk-name";
    name.textContent = character.displayName;
    topline.appendChild(name);

    const preview = document.createElement("div");
    preview.className = "talk-preview";
    preview.textContent = last ? last.text : "まだメッセージはありません";

    main.appendChild(topline);
    main.appendChild(preview);

    const side = document.createElement("div");
    side.className = "talk-side";

    const time = document.createElement("div");
    time.className = "talk-time";
    time.textContent = last ? formatListTime(last.createdAt) : "";
    side.appendChild(time);

    if (unread > 0) {
      const badge = document.createElement("div");
      badge.className = "unread-badge";
      badge.textContent = unread > 99 ? "99+" : String(unread);
      side.appendChild(badge);
    }

    item.appendChild(avatar);
    item.appendChild(main);
    item.appendChild(side);

    item.addEventListener("click", () => openChat(character.id));
    talkList.appendChild(item);
  }
}

function activeCharacter() {
  return appState.activeCharacterId ? characterById(appState.activeCharacterId) : null;
}

function markIncomingSeen(characterId) {
  const messages = loadMessages(characterId);
  let changed = false;

  for (const message of messages) {
    if (message.senderId === characterId && !message.seenByUser) {
      message.seenByUser = true;
      changed = true;
    }
  }

  if (changed) saveMessages(characterId, messages);
}

function openChat(characterId, pushHistory = true) {
  const character = characterById(characterId);
  if (!character) return;

  appState.activeCharacterId = characterId;
  markIncomingSeen(characterId);

  chatTitle.textContent = character.displayName;
  statusText.textContent = "オンライン";
  typingLabel.textContent = `${character.displayName}が入力中…`;
  applyAvatar(headerAvatar, characterId);
  applyAvatar(typingAvatar, characterId);

  listScreen.hidden = true;
  chatScreen.hidden = false;

  renderMessages();
  autosizeInput();
  setTimeout(() => scrollToBottom("auto"), 0);

  if (pushHistory) {
    history.pushState({ characterId }, "", `#chat=${characterId}`);
  }
}

function showTalkList(pushHistory = true) {
  appState.activeCharacterId = null;
  appState.isReplying = false;
  setTyping(false);
  messageInput.value = "";
  autosizeInput();

  chatScreen.hidden = true;
  listScreen.hidden = false;
  renderTalkList();

  if (pushHistory) {
    history.pushState({ list: true }, "", location.pathname + location.search);
  }
}

function renderMessages() {
  const character = activeCharacter();
  if (!character) return;

  const messages = loadMessages(character.id);
  messageList.replaceChildren();

  let previousDay = "";

  for (const message of messages) {
    const currentDay = dayLabel(message.createdAt);

    if (currentDay !== previousDay) {
      const divider = document.createElement("div");
      divider.className = "day-divider";
      const span = document.createElement("span");
      span.textContent = currentDay;
      divider.appendChild(span);
      messageList.appendChild(divider);
      previousDay = currentDay;
    }

    const outgoing = message.senderId === "mashiro";
    const row = document.createElement("div");
    row.className = `message-row ${outgoing ? "outgoing" : "incoming"}`;

    if (!outgoing) {
      const miniAvatar = document.createElement("div");
      applyAvatar(miniAvatar, character.id);
      miniAvatar.classList.add("mini-avatar");
      row.appendChild(miniAvatar);
    }

    const stack = document.createElement("div");
    stack.className = "message-stack";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message.text;

    const meta = document.createElement("div");
    meta.className = "message-meta";

    if (outgoing && message.readByCharacter) {
      const read = document.createElement("span");
      read.textContent = "既読";
      meta.appendChild(read);
    }

    const clock = document.createElement("span");
    clock.textContent = formatClock(message.createdAt);
    meta.appendChild(clock);

    stack.appendChild(bubble);
    stack.appendChild(meta);
    row.appendChild(stack);
    messageList.appendChild(row);
  }
}

function scrollToBottom(behavior = "smooth") {
  requestAnimationFrame(() => {
    messageList.scrollTo({ top: messageList.scrollHeight, behavior });
  });
}

function showToast(text, duration = 3200) {
  clearTimeout(appState.toastTimer);
  toast.textContent = text;
  toast.classList.add("visible");
  appState.toastTimer = setTimeout(() => toast.classList.remove("visible"), duration);
}

function setTyping(visible, characterId = appState.activeCharacterId) {
  const active = activeCharacter();
  if (!active || active.id !== characterId) {
    typingRow.classList.remove("visible");
    typingRow.setAttribute("aria-hidden", "true");
    return;
  }

  typingRow.classList.toggle("visible", visible);
  typingRow.setAttribute("aria-hidden", visible ? "false" : "true");
  statusText.textContent = visible ? "入力中…" : "オンライン";
  if (visible) scrollToBottom();
}

function autosizeInput() {
  messageInput.style.height = "auto";
  messageInput.style.height = `${Math.min(messageInput.scrollHeight, 120)}px`;
  sendButton.disabled = !messageInput.value.trim() || appState.isReplying || !appState.activeCharacterId;
}

function addMessage(characterId, senderId, text, options = {}) {
  const messages = loadMessages(characterId);
  const activeAndVisible =
    appState.activeCharacterId === characterId &&
    !chatScreen.hidden &&
    document.visibilityState === "visible";

  const message = {
    id: makeId(),
    senderId,
    text: String(text || "").trim(),
    createdAt: options.createdAt || new Date().toISOString(),
    readByCharacter: senderId === "mashiro" ? Boolean(options.readByCharacter) : true,
    seenByUser: senderId === characterId ? (options.seenByUser ?? activeAndVisible) : true,
    source: options.source || "ai"
  };

  messages.push(message);
  saveMessages(characterId, messages);

  if (appState.activeCharacterId === characterId) {
    if (message.senderId === characterId) markIncomingSeen(characterId);
    renderMessages();
    scrollToBottom();
  }

  renderTalkList();
  return message;
}

function markOutgoingRead(characterId) {
  const messages = loadMessages(characterId);
  let changed = false;

  for (const message of messages) {
    if (message.senderId === "mashiro" && !message.readByCharacter) {
      message.readByCharacter = true;
      changed = true;
    }
  }

  if (changed) {
    saveMessages(characterId, messages);
    if (appState.activeCharacterId === characterId) renderMessages();
    renderTalkList();
  }
}

function getAccessCode() {
  return localStorage.getItem(ACCESS_CODE_KEY) || "";
}

function askForAccessCode() {
  return new Promise((resolve) => {
    accessCodeInput.value = getAccessCode();

    const cleanup = () => {
      accessForm.removeEventListener("submit", onSubmit);
      accessCancel.removeEventListener("click", onCancel);
      accessDialog.removeEventListener("cancel", onCancel);
    };

    const onSubmit = (event) => {
      event.preventDefault();
      const code = accessCodeInput.value.trim();
      if (!code) {
        showToast("接続コードを入力してください");
        return;
      }

      localStorage.setItem(ACCESS_CODE_KEY, code);
      cleanup();
      accessDialog.close();
      resolve(code);
    };

    const onCancel = (event) => {
      event?.preventDefault?.();
      cleanup();
      accessDialog.close();
      resolve("");
    };

    accessForm.addEventListener("submit", onSubmit);
    accessCancel.addEventListener("click", onCancel);
    accessDialog.addEventListener("cancel", onCancel);
    accessDialog.showModal();
    setTimeout(() => accessCodeInput.focus(), 50);
  });
}

function normalizeBackendUrl(value) {
  const raw = String(value || "").trim().replace(/\/+$/, "");
  if (!/^https:\/\//i.test(raw)) return "";
  return `${raw}/api/chat`;
}

function getApiEndpoint() {
  if (CONFIGURED_API_ENDPOINT) return CONFIGURED_API_ENDPOINT;
  const saved = localStorage.getItem(BACKEND_URL_KEY) || "";
  return saved ? normalizeBackendUrl(saved) : "";
}

function endpointFor(apiEndpoint, kind) {
  if (kind === "health") return String(apiEndpoint).replace(/\/api\/chat(?:\?.*)?$/, "/health");
  if (kind === "proactive") return String(apiEndpoint).replace(/\/api\/chat(?:\?.*)?$/, "/api/proactive");
  return apiEndpoint;
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function warmBackend(apiEndpoint) {
  const health = endpointFor(apiEndpoint, "health");
  if (!health || health === apiEndpoint) return;

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);

  try {
    await fetch(health, { method: "GET", cache: "no-store", signal: controller.signal });
  } catch {
  } finally {
    clearTimeout(timeout);
  }
}

function recentHistoryForAPI(characterId) {
  return loadMessages(characterId).slice(-30).map((message) => ({
    senderId: message.senderId,
    text: message.text,
    createdAt: message.createdAt
  }));
}

async function callChatOnce(characterId, accessCode, apiEndpoint) {
  appState.currentRequestController = new AbortController();
  const timeout = setTimeout(() => appState.currentRequestController.abort(), 45000);

  try {
    const response = await fetch(apiEndpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-App-Code": accessCode
      },
      body: JSON.stringify({
        characterId,
        conversationId: characterById(characterId).conversationId,
        messages: recentHistoryForAPI(characterId),
        memories: memoriesForAPI(characterId),
        currentTime: new Date().toLocaleString("ja-JP", { dateStyle: "full", timeStyle: "short" }),
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
      }),
      signal: appState.currentRequestController.signal,
      cache: "no-store"
    });

    let data = {};
    try { data = await response.json(); } catch {}

    if (response.status === 401) {
      localStorage.removeItem(ACCESS_CODE_KEY);
      const error = new Error("invalid_app_code");
      error.code = "invalid_app_code";
      throw error;
    }

    if (!response.ok || typeof data?.reply !== "string" || !data.reply.trim()) {
      const error = new Error(String(data?.error || `http_${response.status}`));
      error.code =
        response.status === 429 ? "rate_limited" :
        [500,502,503,504].includes(response.status) ? "temporary_error" :
        response.status === 403 ? "origin_not_allowed" :
        "api_error";
      throw error;
    }

    return {
      reply: data.reply.trim(),
      memoryCandidates: Array.isArray(data.memoryCandidates) ? data.memoryCandidates : []
    };
  } finally {
    clearTimeout(timeout);
    appState.currentRequestController = null;
  }
}

async function callChat(characterId, accessCode, apiEndpoint) {
  let lastError;

  for (let attempt = 0; attempt < 2; attempt += 1) {
    try {
      return await callChatOnce(characterId, accessCode, apiEndpoint);
    } catch (error) {
      lastError = error;
      const retryable =
        error?.name === "AbortError" ||
        error instanceof TypeError ||
        error?.code === "temporary_error" ||
        error?.code === "rate_limited";

      if (!retryable || attempt === 1) throw error;
      await warmBackend(apiEndpoint);
      await sleep(1800);
    }
  }

  throw lastError;
}

async function sendUserMessage() {
  const character = activeCharacter();
  const text = messageInput.value.trim();

  if (!character || !text || appState.isReplying) return;

  addMessage(character.id, "mashiro", text, {
    readByCharacter: false,
    seenByUser: true,
    source: "user"
  });

  messageInput.value = "";
  autosizeInput();

  appState.isReplying = true;
  sendButton.disabled = true;

  await sleep(350);
  markOutgoingRead(character.id);
  setTyping(true, character.id);

  let apiEndpoint = getApiEndpoint();
  if (!apiEndpoint) {
    setTyping(false, character.id);
    appState.isReplying = false;
    autosizeInput();
    showToast("AIバックエンドURLが設定されていません");
    return;
  }

  let accessCode = getAccessCode();
  if (!accessCode) accessCode = await askForAccessCode();

  if (!accessCode) {
    setTyping(false, character.id);
    appState.isReplying = false;
    autosizeInput();
    return;
  }

  await warmBackend(apiEndpoint);

  const typingStart = Date.now();

  try {
    const result = await callChat(character.id, accessCode, apiEndpoint);
    const remaining = Math.max(0, 900 - (Date.now() - typingStart));
    if (remaining) await sleep(remaining);

    setTyping(false, character.id);
    addMessage(character.id, character.id, result.reply, {
      source: "ai",
      seenByUser: true
    });
    mergeMemoryCandidates(character.id, result.memoryCandidates);
    scheduleProactive(character.id, "normal");
  } catch (error) {
    setTyping(false, character.id);

    if (error?.code === "invalid_app_code") {
      showToast("接続コードが違います。もう一度入力してください");
      await askForAccessCode();
    } else {
      showToast("AIに接続できませんでした。少し待ってもう一度試してください");
    }
  } finally {
    appState.isReplying = false;
    autosizeInput();
  }
}

function dateKey(date = new Date()) {
  return `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;
}

function randomBetween(min, max) {
  return min + Math.random() * (max - min);
}

function loadProactiveState(characterId) {
  const character = characterById(characterId);
  const now = Date.now();

  try {
    const raw = localStorage.getItem(proactiveKey(characterId));
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        if (parsed.dailyDate !== dateKey()) {
          parsed.dailyDate = dateKey();
          parsed.dailyCount = 0;
        }

        if (!Number.isFinite(Number(parsed.nextDueAt))) {
          parsed.nextDueAt = now + randomBetween(
            character.proactive.normalMinMs,
            character.proactive.normalMaxMs
          );
        }

        return {
          nextDueAt: Number(parsed.nextDueAt),
          lastSentAt: Number(parsed.lastSentAt || 0),
          dailyDate: parsed.dailyDate || dateKey(),
          dailyCount: Number(parsed.dailyCount || 0)
        };
      }
    }
  } catch {}

  return {
    nextDueAt: now + randomBetween(character.proactive.normalMinMs, character.proactive.normalMaxMs),
    lastSentAt: 0,
    dailyDate: dateKey(),
    dailyCount: 0
  };
}

function saveProactiveState(characterId, state) {
  localStorage.setItem(proactiveKey(characterId), JSON.stringify(state));
}

function isQuietTime(date = new Date()) {
  const hour = date.getHours() + date.getMinutes()/60;
  return hour >= 22.5 || hour < 7;
}

function nextMorningTimestamp() {
  const target = new Date();
  target.setDate(target.getDate() + (target.getHours() >= 22 ? 1 : 0));
  target.setHours(7, 15 + Math.floor(Math.random()*45), 0, 0);
  return target.getTime();
}

function scheduleProactive(characterId, mode = "normal") {
  const character = characterById(characterId);
  const state = loadProactiveState(characterId);
  const now = Date.now();

  if (isQuietTime()) {
    state.nextDueAt = nextMorningTimestamp();
  } else if (mode === "retry") {
    state.nextDueAt = now + randomBetween(12*60*1000, 25*60*1000);
  } else {
    state.nextDueAt = now + randomBetween(
      character.proactive.normalMinMs,
      character.proactive.normalMaxMs
    );
  }

  saveProactiveState(characterId, state);
}

function latestMessage(characterId, senderId = null) {
  const messages = loadMessages(characterId);

  for (let index = messages.length - 1; index >= 0; index -= 1) {
    if (!senderId || messages[index].senderId === senderId) return messages[index];
  }

  return null;
}

async function callProactiveOnce(characterId, accessCode, apiEndpoint) {
  const character = characterById(characterId);
  const state = loadProactiveState(characterId);
  const endpoint = endpointFor(apiEndpoint, "proactive");
  const controller = new AbortController();
  appState.proactiveRequestControllers.set(characterId, controller);
  const timeout = setTimeout(() => controller.abort(), 45000);

  try {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-App-Code": accessCode
      },
      body: JSON.stringify({
        characterId,
        conversationId: character.conversationId,
        messages: recentHistoryForAPI(characterId),
        memories: memoriesForAPI(characterId),
        currentTime: new Date().toLocaleString("ja-JP", { dateStyle: "full", timeStyle: "short" }),
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        proactiveContext: {
          messagesToday: state.dailyCount,
          lastUserActivityAt: latestMessage(characterId, "mashiro")?.createdAt || null,
          lastCharacterMessageAt: latestMessage(characterId, characterId)?.createdAt || null
        }
      }),
      signal: controller.signal,
      cache: "no-store"
    });

    const data = await response.json().catch(() => ({}));

    if (response.status === 401) {
      localStorage.removeItem(ACCESS_CODE_KEY);
      throw Object.assign(new Error("invalid_app_code"), { code: "invalid_app_code" });
    }

    if (!response.ok) {
      throw Object.assign(new Error(String(data?.error || response.status)), {
        code: [500,502,503,504,429].includes(response.status) ? "temporary_error" : "api_error"
      });
    }

    return {
      send: Boolean(data?.send),
      message: typeof data?.message === "string" ? data.message.trim() : ""
    };
  } finally {
    clearTimeout(timeout);
    appState.proactiveRequestControllers.delete(characterId);
  }
}

async function maybeSendProactive(characterId) {
  if (document.visibilityState !== "visible") return;

  const character = characterById(characterId);
  const state = loadProactiveState(characterId);

  if (state.dailyDate !== dateKey()) {
    state.dailyDate = dateKey();
    state.dailyCount = 0;
    saveProactiveState(characterId, state);
  }

  if (Date.now() < Number(state.nextDueAt || 0)) return;

  if (isQuietTime()) {
    scheduleProactive(characterId, "normal");
    return;
  }

  if (state.dailyCount >= character.proactive.dailyMax) {
    state.nextDueAt = nextMorningTimestamp();
    saveProactiveState(characterId, state);
    return;
  }

  if (appState.proactiveRequestControllers.has(characterId)) return;

  const latestUser = latestMessage(characterId, "mashiro");
  const latestCharacter = latestMessage(characterId, characterId);
  const latestAny = latestMessage(characterId);
  const now = Date.now();

  if (
    latestUser &&
    now - Date.parse(latestUser.createdAt) < character.proactive.recentUserCooldownMs
  ) {
    scheduleProactive(characterId, "retry");
    return;
  }

  if (
    latestAny?.senderId === characterId &&
    latestCharacter &&
    now - Date.parse(latestCharacter.createdAt) < character.proactive.recentCharacterCooldownMs
  ) {
    scheduleProactive(characterId, "normal");
    return;
  }

  const apiEndpoint = getApiEndpoint();
  const accessCode = getAccessCode();

  if (!apiEndpoint || !accessCode) {
    scheduleProactive(characterId, "retry");
    return;
  }

  await warmBackend(apiEndpoint);

  const showTyping =
    appState.activeCharacterId === characterId &&
    !chatScreen.hidden;

  if (showTyping) setTyping(true, characterId);

  try {
    let result;
    let lastError;

    for (let attempt = 0; attempt < 2; attempt += 1) {
      try {
        result = await callProactiveOnce(characterId, accessCode, apiEndpoint);
        break;
      } catch (error) {
        lastError = error;
        if (attempt === 1 || error?.code !== "temporary_error") throw error;
        await sleep(1800);
      }
    }

    if (showTyping) {
      await sleep(800);
      setTyping(false, characterId);
    }

    if (result?.send && result.message) {
      addMessage(characterId, characterId, result.message, {
        source: "proactive",
        seenByUser: showTyping
      });

      state.lastSentAt = Date.now();
      state.dailyCount += 1;
      saveProactiveState(characterId, state);
      scheduleProactive(characterId, "normal");
    } else {
      scheduleProactive(characterId, "retry");
    }
  } catch {
    if (showTyping) setTyping(false, characterId);
    scheduleProactive(characterId, "retry");
  }
}

function startProactiveScheduler() {
  clearInterval(appState.proactiveTimer);

  const tick = () => {
    for (const characterId of Object.keys(CHARACTERS)) {
      maybeSendProactive(characterId);
    }
  };

  setTimeout(tick, 1500);
  appState.proactiveTimer = setInterval(tick, 60*1000);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") setTimeout(tick, 700);
  });

  window.addEventListener("focus", () => setTimeout(tick, 700));
}

async function resetActiveConversation(clearMemory) {
  const character = activeCharacter();
  if (!character) return;

  appState.currentRequestController?.abort();
  const proactiveController = appState.proactiveRequestControllers.get(character.id);
  proactiveController?.abort();

  appState.isReplying = false;
  setTyping(false, character.id);

  saveMessages(character.id, character.seed());

  if (clearMemory) {
    localStorage.removeItem(memoryKey(character.id));
  }

  localStorage.removeItem(proactiveKey(character.id));

  resetMemoryCheckbox.checked = false;
  renderMessages();
  renderTalkList();
  autosizeInput();
  setTimeout(() => scrollToBottom("auto"), 0);
}

function showCharacterSettings() {
  const character = activeCharacter();
  if (!character) return;

  characterSettingsTitle.textContent = `${character.displayName}のアイコン`;
  applyAvatar(settingsAvatar, character.id);
  characterDialog.showModal();
}

composer.addEventListener("submit", (event) => {
  event.preventDefault();
  sendUserMessage();
});

messageInput.addEventListener("input", autosizeInput);
messageInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    composer.requestSubmit();
  }
});

backButton.addEventListener("click", () => history.back());

resetButton.addEventListener("click", () => {
  const character = activeCharacter();
  if (!character) return;
  resetTitle.textContent = `${character.displayName}とのトークを初期化`;
  resetDialog.showModal();
});

confirmReset.addEventListener("click", () => {
  resetActiveConversation(resetMemoryCheckbox.checked);
});

avatarButton.addEventListener("click", showCharacterSettings);

chooseAvatarButton.addEventListener("click", () => avatarFileInput.click());

avatarFileInput.addEventListener("change", async () => {
  const character = activeCharacter();
  const file = avatarFileInput.files?.[0];
  avatarFileInput.value = "";

  if (!character || !file) return;

  try {
    const dataUrl = await makeAvatarDataUrl(file);
    setAvatarData(character.id, dataUrl);
    applyAvatar(settingsAvatar, character.id);
    applyAvatar(headerAvatar, character.id);
    applyAvatar(typingAvatar, character.id);
    renderTalkList();
    renderMessages();
    showToast("アイコンを変更しました");
  } catch {
    showToast("画像を読み込めませんでした");
  }
});

resetAvatarButton.addEventListener("click", () => {
  const character = activeCharacter();
  if (!character) return;

  setAvatarData(character.id, "");
  applyAvatar(settingsAvatar, character.id);
  applyAvatar(headerAvatar, character.id);
  applyAvatar(typingAvatar, character.id);
  renderTalkList();
  renderMessages();
  showToast("標準アイコンに戻しました");
});

window.addEventListener("popstate", (event) => {
  const characterId = event.state?.characterId;

  if (characterId && characterById(characterId)) {
    openChat(characterId, false);
  } else {
    showTalkList(false);
  }
});

function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return;

  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./sw.js", { updateViaCache: "none" })
      .then((registration) => registration.update())
      .catch(() => {});
  });
}

migrateLegacyNatsukiData();
history.replaceState({ list: true }, "", location.pathname + location.search);
renderTalkList();
showTalkList(false);
autosizeInput();
registerServiceWorker();
startProactiveScheduler();
</script>
