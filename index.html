async function sendUserPayload({text="",messageType="text",stickerId="",image=null}={}){
  const conversation=activeConversation();
  const cleanText=String(text||"").trim();
  if(!conversation||appState.isReplying)return;
  if(messageType==="text"&&!cleanText)return;
  if(messageType==="image"&&!image)return;
  if(messageType==="sticker"&&!normalizeStickerId(stickerId))return;

  let mediaId="";
  if(messageType==="image"){
    mediaId=`media-${makeId()}`;
    try{
      await putMediaRecord({
        id:mediaId,
        conversationId:conversation.id,
        blob:image.blob,
        mime:image.mime,
        width:image.width,
        height:image.height,
        createdAt:new Date().toISOString()
      });
    }catch(error){console.error(error);showToast("写真を保存できませんでした");return;}
  }

  clearConversationRest(conversation.id,"user_message_resume");
  const storedText=messageType==="sticker"?stickerToken(stickerId):cleanText;
  const replyOptions=pendingReplyOptions(conversation.id);
  const userMessage=addMessage(conversation.id,"mashiro",storedText,{
    readByCharacter:false,
    source:"user",
    messageType,
    stickerId,
    mediaId,
    mediaMime:image?.mime||"",
    mediaWidth:image?.width||0,
    mediaHeight:image?.height||0,
    ...replyOptions
  });

  messageInput.value="";clearPendingImage();clearPendingReply();closeStickerPanel();autosizeInput();appState.isReplying=true;sendButton.disabled=true;

  // Phase 3.2.4: オンライン中の会話ラリーでは、
  // AI生成完了を待たずPWA側で数秒後に既読を付ける。
  if(conversation.type==="dm"){
    scheduleOptimisticDmRead(conversation,userMessage);
  }

  const apiEndpoint=getApiEndpoint();
  if(!apiEndpoint){appState.isReplying=false;autosizeInput();showToast("AIバックエンドURLが設定されていません");return;}
  let accessCode=getAccessCode();if(!accessCode)accessCode=await askForAccessCode();
  if(!accessCode){appState.isReplying=false;autosizeInput();return;}
  await warmBackend(apiEndpoint);

  try{
    if(conversation.type==="dm"){
      const result=await callDmChat(conversation,accessCode,apiEndpoint);
      if(result?.mediaSummary)updateMessageMediaSummary(conversation.id,userMessage.id,result.mediaSummary);
      mergeMemoryCandidates(conversation.characterId,result.memoryCandidates,{sourceType:"dm",sourceConversationId:conversation.id});

      if(result?.replyTiming&&enqueueDelayedDmResult(conversation,userMessage,result)){
        scheduleDmProactive(conversation.characterId,"normal");
      }else{
        await sleep(350);markOutgoingReadThrough(conversation.id,userMessage.createdAt);
        applyBackendReaction(conversation,result,userMessage.id);
        if(!result?.reactionOnly&&!result?.readOnly&&String(result?.reply||"").trim()){
          const sequence=(Array.isArray(result?.replySequence)?result.replySequence:[]).map(v=>String(v||"").trim()).filter(Boolean).slice(0,3);
          if(!sequence.length)sequence.push(String(result.reply||"").trim());
          const timings=Array.isArray(result?.replySequenceTimings)?result.replySequenceTimings:[];
          for(let index=0;index<sequence.length;index+=1){
            const part=sequence[index];
            if(index===0){setTyping(true);await sleep(replyTypingDurationMs(part));setTyping(false);}
            else{
              const gap=Math.max(700,Math.min(2500,Number(timings[index]?.gapMs||900)));
              if(gap>=1000)setTyping(true);
              await sleep(gap);setTyping(false);
            }
            addMessage(conversation.id,conversation.characterId,part,{source:"ai",seenByUser:true,awayUpdate:Number(result?.awayUpdateSequenceIndex)===index?result?.awayUpdate:null,...(index===0?replyQuoteOptions(conversation.id,result?.replyTo):{})});
          }
        }
        scheduleDmProactive(conversation.characterId,"normal");
        if(result?.conversationRestUpdate)applyConversationRestUpdate(result.conversationRestUpdate);
      }
    }else{
      await cancelPendingGroupAutonomous(conversation.groupId);
      await cancelPendingGroupRally(conversation.groupId);
      const result=await callGroupChat(conversation,accessCode,apiEndpoint);
      if(result?.mediaSummary)updateMessageMediaSummary(conversation.id,userMessage.id,result.mediaSummary);

      const groupDelayedQueued=Boolean(result?.groupTiming&&enqueueDelayedGroupResult(conversation,userMessage,result));
      if(groupDelayedQueued){
        // 既読・返信は各キャラの生活モデル時刻に従う。
      }else{
        await sleep(350);markOutgoingRead(conversation.id);
        const replies=Array.isArray(result.replies)?result.replies.slice(0,36):[];
        for(const reply of replies){
          if(!characterById(reply?.speakerId)||!String(reply?.message||"").trim())continue;
          if(normalizeReactionEmoji(reply?.reaction?.emoji)){addReactionToMessage(conversation.id,String(reply.reaction.targetMessageId||userMessage.id),reply.speakerId,reply.reaction.emoji);}
          if(reply?.sequenceContinuation){
            const gap=Math.max(700,Math.min(2500,Number(reply?.sequenceGapMs||900)));
            if(gap>=1000)setTyping(true,reply.speakerId);
            await sleep(gap);setTyping(false);
          }else{
            setTyping(true,reply.speakerId);await sleep(replyTypingDurationMs(reply.message,{group:true}));setTyping(false);
          }
          addMessage(conversation.id,reply.speakerId,String(reply.message).trim(),{source:"group-ai-fallback",seenByUser:true,awayUpdate:reply?.awayUpdate||null,...replyQuoteOptions(conversation.id,reply?.replyTo)});
        }
      }
      mergeGroupMemoryCandidates(conversation.groupId,result.groupMemoryCandidates,{sourceType:"group",sourceConversationId:conversation.id});
      propagateGroupMemoryCandidatesToParticipants(groupById(conversation.groupId),result.groupMemoryCandidates);
      scheduleGroupProactive(conversation.groupId,"normal");
      if(!groupDelayedQueued&&result?.conversationRestUpdate)applyConversationRestUpdate(result.conversationRestUpdate);
    }
  }catch(error){
    setTyping(false);
    if(error?.code==="invalid_app_code"){showToast("接続コードが違います。もう一度入力してください");await askForAccessCode();}
    else{showToast("AIに接続できませんでした。少し待ってもう一度試してください");}
  }finally{appState.isReplying=false;autosizeInput();}
}

function defaultPushSettings(){
  const characterEnabled={};
  for(const id of Object.keys(CHARACTERS)) characterEnabled[id]=true;
  return {
    enabled:false,
    dmEnabled:true,
    groupEnabled:true,
    characterEnabled,
    quietStart:"22:30",
    quietEnd:"07:00"
  };
}

function getPushSettings(){
  try{
    const raw=localStorage.getItem(PUSH_SETTINGS_KEY);
    const parsed=raw?JSON.parse(raw):{};
    const defaults=defaultPushSettings();
    return {
      ...defaults,
      ...parsed,
      characterEnabled:{...defaults.characterEnabled,...(parsed?.characterEnabled||{})}
    };
  }catch{return defaultPushSettings();}
}

function savePushSettings(settings){
  localStorage.setItem(PUSH_SETTINGS_KEY,JSON.stringify(settings));
  schedulePushSync();
}

function getPushDeviceId(){
  let id=localStorage.getItem(PUSH_DEVICE_ID_KEY)||"";
  if(!id){
    id=(crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`);
    localStorage.setItem(PUSH_DEVICE_ID_KEY,id);
  }
  return id;
}

function isStandalonePwa(){
  return window.matchMedia?.("(display-mode: standalone)")?.matches || window.navigator.standalone===true;
}

function pushApiSupported(){
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

function pushNotificationsEnabled(){
  const settings=getPushSettings();
  return Boolean(settings.enabled && pushApiSupported() && Notification.permission==="granted");
}

function base64UrlToUint8Array(base64String){
  const padding="=".repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(ch=>ch.charCodeAt(0)));
}

function pushAuthHeaders(accessCode){
  return {"Content-Type":"application/json","X-App-Code":accessCode};
}

function pushUiLabels(){

function buildPushSnapshot(){
  const dm={};
  for(const id of Object.keys(CHARACTERS)){
    const c=characterById(id);
    dm[id]={
      conversationId:c.conversationId,
      messages:recentHistoryForAPI(c.conversationId),
      memories:memoriesForAPI(id),
      state:loadDmProactiveState(id)
    };
  }

  const group={};
  for(const id of Object.keys(GROUPS)){
    const g=groupById(id);
    group[id]={
      conversationId:g.conversationId,
      messages:recentHistoryForAPI(g.conversationId),
      sharedMemories:groupMemoriesForAPI(id)
    };
  }

  return {version:PUSH_VERSION,ui:pushUiLabels(),characterAway:characterAwayForAPI(),conversationRest:conversationRestForAPI(),scopes:{dm,group}};
}

async function currentPushSubscription(){
  if(!pushApiSupported())return null;
  const registration=await navigator.serviceWorker.ready;
  return registration.pushManager.getSubscription();
}

async function ensurePushSubscription(accessCode,apiEndpoint){
  const registration=await navigator.serviceWorker.ready;
  let subscription=await registration.pushManager.getSubscription();
  if(subscription)return subscription;

  const keyResult=await fetchJsonWithRetry(endpointFor(apiEndpoint,"pushPublicKey"),{
    method:"GET",
    headers:{"X-App-Code":accessCode}
  });

  const publicKey=String(keyResult?.publicKey||"");
  if(!publicKey)throw new Error("push_public_key_missing");

  subscription=await registration.pushManager.subscribe({
    userVisibleOnly:true,
    applicationServerKey:base64UrlToUint8Array(publicKey)
  });
  return subscription;
}

async function registerPushDevice(accessCode,apiEndpoint,subscription){
  const settings=getPushSettings();
  return fetchJsonWithRetry(endpointFor(apiEndpoint,"pushRegister"),{
    method:"POST",
    headers:pushAuthHeaders(accessCode),
    body:JSON.stringify({
      deviceId:getPushDeviceId(),
      subscription:subscription.toJSON(),
      timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
      settings,
      snapshot:buildPushSnapshot()
    })
  });
}

async function enablePushNotifications(){
  if(!pushApiSupported()){
    showToast("この環境はWeb通知に対応していません");
    return;
  }
  if(!isStandalonePwa()){
    showToast("通知はホーム画面のましろLINEから有効にしてください",5000);
    return;
  }

  const apiEndpoint=getApiEndpoint();
  if(!apiEndpoint){showToast("AIバックエンドURLが設定されていません");return;}
  let accessCode=getAccessCode();
  if(!accessCode)accessCode=await askForAccessCode();
  if(!accessCode)return;

  const permission=await Notification.requestPermission();
  if(permission!=="granted"){
    showToast("通知が許可されませんでした");
    renderSettingsScreen();
    return;
  }

  try{
    await warmBackend(apiEndpoint);
    const subscription=await ensurePushSubscription(accessCode,apiEndpoint);
    const settings=getPushSettings();
    settings.enabled=true;
    localStorage.setItem(PUSH_SETTINGS_KEY,JSON.stringify(settings));
    await registerPushDevice(accessCode,apiEndpoint,subscription);
    await pullPendingPushMessages();
    await syncPushSnapshotNow();
    renderSettingsScreen();
    updateAppBadgeFromLocal();
    showToast("通知を有効にしました");
  }catch(error){
    console.error(error);
    showToast(error?.message==="Push database is not configured"?"Replitのデータベース設定が必要です":"通知を有効にできませんでした",5000);
  }
}

async function disablePushNotifications(){
  const settings=getPushSettings();
  settings.enabled=false;
  localStorage.setItem(PUSH_SETTINGS_KEY,JSON.stringify(settings));

  const apiEndpoint=getApiEndpoint();
  const accessCode=getAccessCode();
  try{
    const sub=await currentPushSubscription();
    if(apiEndpoint&&accessCode){
      await fetchJsonWithRetry(endpointFor(apiEndpoint,"pushUnregister"),{
        method:"POST",
        headers:pushAuthHeaders(accessCode),
        body:JSON.stringify({deviceId:getPushDeviceId()})
      },0);
    }
    await sub?.unsubscribe?.();
  }catch{}
  renderSettingsScreen();
  updateAppBadgeFromLocal();
  showToast("通知をオフにしました");
}

function formatDiagnosticTime(iso){
  if(!iso)return "なし";
  try{
    return new Date(iso).toLocaleString("ja-JP",{
      month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"
    });
  }catch{return String(iso);}
}

function formatDiagnosticDuration(ms){
  const value=Math.max(0,Number(ms||0));
  if(value<1000)return "0秒";
  const minutes=Math.floor(value/60000);
  const hours=Math.floor(minutes/60);
  const remainMinutes=minutes%60;
  if(hours>0)return `${hours}時間${remainMinutes}分`;
  return `${minutes}分`;
}

async function fetchPushDiagnostics({render=true}={}){
  if(!pushNotificationsEnabled()){
    showToast("先に通知を有効にしてください");
    return null;
  }
  if(appState.pushDiagnosticsBusy)return appState.pushDiagnosticsData;

  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode)return null;

  appState.pushDiagnosticsBusy=true;
  if(render)renderSettingsScreen();

  try{
    const url=`${endpointFor(apiEndpoint,"pushDiagnostics")}?deviceId=${encodeURIComponent(getPushDeviceId())}&characterId=${encodeURIComponent(appState.pushDiagnosticsCharacterId||"natsuki")}`;
    const data=await fetchJsonWithRetry(url,{
      method:"GET",
      headers:{"X-App-Code":accessCode}
    },0);
    appState.pushDiagnosticsData=data;
  }catch(error){
    appState.pushDiagnosticsData={error:String(error?.message||"診断に失敗しました")};
  }finally{
    appState.pushDiagnosticsBusy=false;
    if(render)renderSettingsScreen();
  }

  return appState.pushDiagnosticsData;
}

async function runSchedulerDiagnosticOnce(){
  if(!pushNotificationsEnabled()){
    showToast("先に通知を有効にしてください");
    return;
  }
  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode)return;

  try{
    showToast("通常スケジューラを1回実行しています…",3000);
    const result=await fetchJsonWithRetry(endpointFor(apiEndpoint,"pushRunDue"),{
      method:"POST",
      headers:pushAuthHeaders(accessCode),
      body:JSON.stringify({source:"diagnostic-button"})
    },0);

    await sleep(500);
    await pullPendingPushMessages();
    const data=await fetchPushDiagnostics({render:false});
    if(data){
      data.manualRunResult=result;
      appState.pushDiagnosticsData=data;
    }
    renderSettingsScreen();

    if(Number(result?.sent||0)>0){
      showToast("通常スケジューラから通知を送信しました",4000);
    }else{
      showToast("通常スケジューラを実行しました。診断結果を確認してください",4500);
    }
  }catch(error){
    appState.pushDiagnosticsData={error:String(error?.message||"スケジューラ実行に失敗しました")};
    renderSettingsScreen();
    showToast("通常スケジューラの実行に失敗しました",4500);
  }
}

function buildPushDiagnosticsBlock(){
  const wrap=document.createElement("div");
  wrap.className="notification-diagnostics-wrap";

  const selector=document.createElement("select");
  selector.className="notification-diagnostic-select";
  [
    ["natsuki","夏樹"],
    ["shiki","四季"],
    ["ichi","イチ"],
    ["bunji","ブンジ"],
    ["sosuke","ソウスケ"]
  ].forEach(([value,label])=>{
    const option=document.createElement("option");
    option.value=value;
    option.textContent=`診断対象：${label}`;
    option.selected=(appState.pushDiagnosticsCharacterId===value);
    selector.appendChild(option);
  });
  selector.disabled=!pushNotificationsEnabled()||appState.pushDiagnosticsBusy;
  selector.addEventListener("change",()=>{
    appState.pushDiagnosticsCharacterId=selector.value;
    appState.pushDiagnosticsData=null;
    renderSettingsScreen();
  });
  wrap.appendChild(selector);

  const actions=document.createElement("div");
  actions.className="notification-diagnostics-actions";

  const check=document.createElement("button");
  check.type="button";
  check.className="notification-diagnostic-button";
  check.textContent=appState.pushDiagnosticsBusy?"診断中…":"状態を診断";
  check.disabled=!pushNotificationsEnabled()||appState.pushDiagnosticsBusy;
  check.addEventListener("click",()=>fetchPushDiagnostics());

  const run=document.createElement("button");
  run.type="button";
  run.className="notification-diagnostic-button primary";
  run.textContent="通常判定を1回実行";
  run.disabled=!pushNotificationsEnabled()||appState.pushDiagnosticsBusy;
  run.addEventListener("click",runSchedulerDiagnosticOnce);

  actions.append(check,run);

  const panel=document.createElement("div");
  const data=appState.pushDiagnosticsData;
  const eligible=Boolean(data?.character?.eligible);
  const hasError=Boolean(data?.error||data?.registered===false);
  panel.className=`notification-diagnostics-panel${hasError?" error":eligible?" good":data?" warn":""}`;
  panel.textContent=pushDiagnosticsText(data);

  wrap.append(actions,panel);
  return wrap;
}

async function syncPushSnapshotNow(){
  if(!pushNotificationsEnabled())return;
  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode)return;
  try{
    const result=await fetchJsonWithRetry(
      endpointFor(apiEndpoint,"pushSync"),
      {
        method:"POST",
        headers:pushAuthHeaders(accessCode),
        body:JSON.stringify({
          deviceId:getPushDeviceId(),
          timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
          settings:getPushSettings(),
          snapshot:buildPushSnapshot()
        })
      },
      0
    );
    if(Number.isFinite(Number(result?.badgeCount))){
      applyServerBadgeState(
        result.badgeCount,
        result?.badgeRevision
      );
    }
  }catch(error){
    if(error?.message==="Push device not registered"){
      try{
        const subscription=await ensurePushSubscription(accessCode,apiEndpoint);
        await registerPushDevice(accessCode,apiEndpoint,subscription);
      }catch{}
    }
  }
}

function schedulePushSync(){
  if(!pushNotificationsEnabled())return;
  clearTimeout(appState.pushSyncTimer);
  appState.pushSyncTimer=setTimeout(()=>syncPushSnapshotNow(),1300);
}

async function pullPendingPushMessages(){
  if(!pushNotificationsEnabled())return;
  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode)return;

  try{
    const url=`${endpointFor(apiEndpoint,"pushPending")}?deviceId=${encodeURIComponent(getPushDeviceId())}`;
    const result=await fetchJsonWithRetry(url,{method:"GET",headers:{"X-App-Code":accessCode}},0);
    const events=Array.isArray(result?.events)?result.events:[];
    const ackIds=[];

    for(const event of events){
      const conversation=conversationById(event?.conversationId);
      const imageAssetId=String(event?.meta?.imageAssetId||"").trim();
      const generatedImageId=String(event?.meta?.generatedImageId||"").trim();
      const isImage=event?.meta?.messageType==="image"&&Boolean(generatedImageId||proactiveImageAsset(imageAssetId));
      const pushStickerId=normalizeStickerId(event?.meta?.stickerId)||stickerIdFromText(event?.message);
      const isSticker=event?.meta?.messageType==="sticker"&&Boolean(pushStickerId);
      const reactionEmoji=normalizeReactionEmoji(event?.meta?.reactionEmoji);
      const isReaction=event?.meta?.messageType==="reaction"||Boolean(reactionEmoji);
      const messageText=String(event?.message||"").trim();
      if(!conversation||!event?.eventId||(!messageText&&!isImage&&!isSticker&&!isReaction))continue;
      const messageId=`push-${event.eventId}`;
      const existing=loadConversationMessages(conversation.id).some(m=>m.id===messageId||m.pushEventId===event.eventId);
      if(isReaction&&reactionEmoji){
        addReactionToMessage(conversation.id,String(event?.meta?.reactionTargetMessageId||""),event.speakerId,reactionEmoji,event.createdAt||"");
      }
      if(!existing&&event?.meta?.messageType!=="reaction"&&(messageText||isImage||isSticker)){
        addMessage(conversation.id,event.speakerId,messageText,{
          id:messageId,
          pushEventId:event.eventId,
          createdAt:event.createdAt||new Date().toISOString(),
          source:"push-proactive",
          messageType:isImage?"image":isSticker?"sticker":"text",
          stickerId:isSticker?pushStickerId:"",
          imageAssetId:isImage?imageAssetId:"",
          generatedImageId:isImage?generatedImageId:"",
          mediaWidth:isImage&&generatedImageId?1024:0,
          mediaHeight:isImage&&generatedImageId?1024:0,
          mediaSummary:isImage?String(event?.meta?.mediaSummary||"").slice(0,300):"",
          awayUpdate:event?.meta?.awayUpdate||null,
          seenByUser:appState.activeConversationId===conversation.id&&!chatScreen.hidden&&document.visibilityState==="visible",
          ...replyQuoteOptions(conversation.id,{messageId:event?.meta?.replyToMessageId,senderId:event?.meta?.replyToSenderId,excerpt:event?.meta?.replyToText})
        });
      }
      if(event?.meta?.conversationRestUpdate)applyConversationRestUpdate(event.meta.conversationRestUpdate);
      if(conversation.type==="dm"&&event?.meta?.followUpMemoryKey&&characterById(event.speakerId)){
        markFollowUpMemoryRecovered(event.speakerId,event.meta.followUpMemoryKey);
      }
      clearDelayedReplyByEventId(event.eventId);
      clearDelayedGroupReplyByEventId(event.eventId);
      ackIds.push(event.eventId);
    }

    if(ackIds.length){
      await fetchJsonWithRetry(endpointFor(apiEndpoint,"pushAck"),{
        method:"POST",
        headers:pushAuthHeaders(accessCode),
        body:JSON.stringify({deviceId:getPushDeviceId(),eventIds:ackIds})
      },0);
      await syncPushSnapshotNow();
    }

    renderTalkList();
    if(appState.activeConversationId)renderMessages();
    updateAppBadgeFromLocal();
  }catch{}
}

      registration?.active||
      registration?.waiting||
      registration?.installing;
    if(worker){
      worker.postMessage({
        type:"badge-state-sync",
        badgeCount:Math.max(0,Number(badgeCount||0)),
        badgeRevision:Math.max(0,Number(badgeRevision||0))
      });
    }
  }catch{}

      navigator.setAppBadge(count);
    }else if("clearAppBadge" in navigator){
      navigator.clearAppBadge();
    }

}

function dateKey(date=new Date()){return `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;}
function randomBetween(min,max){return min+Math.random()*(max-min);}
function isQuietTime(date=new Date()){const h=date.getHours()+date.getMinutes()/60;return h>=22.5||h<7;}
function nextMorningTimestamp(){const t=new Date();t.setDate(t.getDate()+(t.getHours()>=22?1:0));t.setHours(7,15+Math.floor(Math.random()*45),0,0);return t.getTime();}

function normalizeDmContinuityEvent(raw,now=Date.now()){
  if(!raw||typeof raw!=="object")return null;
  const key=String(raw.key||"").trim().slice(0,120),summary=String(raw.summary||"").trim().slice(0,300);
  const startedAt=Number(raw.startedAt||0),lastStageAt=Number(raw.lastStageAt||startedAt||0),nextDueAt=Number(raw.nextDueAt||0),expiresAt=Number(raw.expiresAt||0);
  const stageCount=Math.max(1,Math.min(PROACTIVE_CONTINUITY_MAX_STAGES,Number(raw.stageCount||1)));
  if(!key||!summary||!startedAt||!nextDueAt||!expiresAt||expiresAt<=now||stageCount>=PROACTIVE_CONTINUITY_MAX_STAGES)return null;
  return{key,summary,startedAt,lastStageAt,nextDueAt,expiresAt,stageCount};
}
function dmContinuityDue(state,now=Date.now()){const e=normalizeDmContinuityEvent(state?.activeContinuityEvent,now);return Boolean(e&&e.nextDueAt<=now);}
function dmContinuityStartAllowed(characterId,state){
  if(!PROACTIVE_CONTINUITY_CHARACTERS.has(characterId)||normalizeDmContinuityEvent(state?.activeContinuityEvent))return false;
  const c=characterById(characterId);if(!c||Number(state?.dailyCount||0)>=Number(c.proactive.dailyMax||0))return false;
  return Math.random()<Number(PROACTIVE_CONTINUITY_START_CHANCE[characterId]||0);
}
function dmContinuityDelayMs(value,fallback=45){const allowed=new Set([15,20,30,45,60,90,120,180]);const m=allowed.has(Number(value))?Number(value):fallback;return m*60*1000;}
function dmContinuityExpiryMs(value,fallback=240){const allowed=new Set([60,120,180,240,360]);const m=allowed.has(Number(value))?Number(value):fallback;return Math.min(6*60*60*1000,m*60*1000);}
function applyDmContinuityResult(state,result,characterId,now=Date.now()){
  if(!PROACTIVE_CONTINUITY_CHARACTERS.has(characterId))return{action:"none",active:null};
  const action=String(result?.continuityAction||"none"),current=normalizeDmContinuityEvent(state.activeContinuityEvent,now);
  const key=String(result?.continuityKey||"").trim().slice(0,120),summary=String(result?.continuitySummary||"").trim().slice(0,300);
  if(action==="start"&&!current&&key&&summary){const e={key,summary,startedAt:now,lastStageAt:now,stageCount:1,nextDueAt:now+dmContinuityDelayMs(result?.continuityNextDelayMinutes,45),expiresAt:now+dmContinuityExpiryMs(result?.continuityExpiresInMinutes,240)};state.activeContinuityEvent=e;state.nextDueAt=e.nextDueAt;return{action:"start",active:e};}
  if(current&&["continue","complete"].includes(action)&&(!key||key===current.key)){const n=current.stageCount+1;if(action==="complete"||n>=PROACTIVE_CONTINUITY_MAX_STAGES){state.activeContinuityEvent=null;return{action:"complete",active:null};}const e={...current,summary:summary||current.summary,stageCount:n,lastStageAt:now,nextDueAt:now+dmContinuityDelayMs(result?.continuityNextDelayMinutes,60)};state.activeContinuityEvent=e;state.nextDueAt=e.nextDueAt;return{action:"continue",active:e};}
  if(!current)state.activeContinuityEvent=null;return{action:"none",active:current};
}

function loadDmProactiveState(characterId){
  const c=characterById(characterId),now=Date.now();

  try{
    const raw=localStorage.getItem(
      proactiveKey(characterId)
    );

    if(raw){
      const p=JSON.parse(raw);

      if(p.dailyDate!==dateKey()){
        p.dailyDate=dateKey();
        p.dailyCount=0;
      }

      if(!Number.isFinite(Number(p.nextDueAt))){
        p.nextDueAt=
          now+randomBetween(
            c.proactive.normalMinMs,
            c.proactive.normalMaxMs
          );
      }

      return{
        nextDueAt:Number(p.nextDueAt),
        lastSentAt:Number(p.lastSentAt||0),
        dailyDate:p.dailyDate||dateKey(),
        dailyCount:Number(p.dailyCount||0),
        recentProactiveHistory:
          Array.isArray(p.recentProactiveHistory)
            ?p.recentProactiveHistory.slice(-12)
            :[],
        activeContinuityEvent:normalizeDmContinuityEvent(p.activeContinuityEvent,now)
      };
    }
  }catch{}

  return{
    nextDueAt:
      now+randomBetween(
        c.proactive.normalMinMs,
        c.proactive.normalMaxMs
      ),
    lastSentAt:0,
    dailyDate:dateKey(),
    dailyCount:0,
    recentProactiveHistory:[],
    activeContinuityEvent:null
  };
}
function saveDmProactiveState(id,state){localStorage.setItem(proactiveKey(id),JSON.stringify(state));schedulePushSync();}
function scheduleDmProactive(id,mode="normal"){const c=characterById(id),s=loadDmProactiveState(id),now=Date.now();if(isQuietTime())s.nextDueAt=nextMorningTimestamp();else if(mode==="retry")s.nextDueAt=now+randomBetween(12*60*1000,25*60*1000);else s.nextDueAt=now+randomBetween(c.proactive.normalMinMs,c.proactive.normalMaxMs);saveDmProactiveState(id,s);}
function latestMessage(conversationId,senderId=null){const messages=loadConversationMessages(conversationId);for(let i=messages.length-1;i>=0;i--){if(!senderId||messages[i].senderId===senderId)return messages[i];}return null;}

function dmProactiveMessagePlan(result){
  const stickerId=normalizeStickerId(result?.stickerId);
  const mode=String(result?.stickerMode||"");
  const text=String(result?.message||"").trim();
  if(stickerId&&["sticker_only","text_then_sticker","sticker_then_text"].includes(mode)){
    const sticker={type:"sticker",text:stickerToken(stickerId),stickerId};
    const textItem={type:"text",text};
    if(mode==="sticker_only")return[sticker];
    return mode==="sticker_then_text"?[sticker,textItem].filter(x=>x.type==="sticker"||x.text):[textItem,sticker].filter(x=>x.type==="sticker"||x.text);
  }
  return text?[{type:"text",text}]:[];
}

async function maybeSendDmProactive(characterId){
  if(document.visibilityState!=="visible")return;

  const c=characterById(characterId);
  const conv=conversationById(c.conversationId);
  const state=loadDmProactiveState(characterId);

  if(Date.now()<state.nextDueAt)return;

  const naturalRest=activeConversationRest(conv.id);
  const restUntil=Date.parse(String(naturalRest?.suppressUntil||""));
  const continuityDueEarly=dmContinuityDue(state);
  if(!continuityDueEarly&&naturalRest&&Number.isFinite(restUntil)&&restUntil>Date.now()){state.nextDueAt=Math.max(Number(state.nextDueAt||0),restUntil);saveDmProactiveState(characterId,state);return;}

  const explicitAway=activeCharacterAway(characterId);
  if(explicitAway){
    const untilMs=Date.parse(explicitAway.until);
    if(Number.isFinite(untilMs)){state.nextDueAt=Math.max(state.nextDueAt,untilMs+Math.round((5+Math.random()*20)*60*1000));saveDmProactiveState(characterId,state);}
    return;
  }

  if(isQuietTime()){
    scheduleDmProactive(characterId);
    return;
  }

  const continuationDue=continuityDueEarly;
  if(!continuationDue&&state.dailyCount>=c.proactive.dailyMax){
    state.nextDueAt=nextMorningTimestamp();
    saveDmProactiveState(characterId,state);
    return;
  }

  const latestUser=latestMessage(conv.id,"mashiro");
  const latestChar=latestMessage(conv.id,characterId);
  const latestAny=latestMessage(conv.id);
  const now=Date.now();

  if(
    latestUser &&
    now-Date.parse(latestUser.createdAt)<
      c.proactive.recentUserCooldownMs
  ){
    scheduleDmProactive(characterId,"retry");
    return;
  }

  if(
    !continuationDue&&
    latestAny?.senderId===characterId &&
    latestChar &&
    now-Date.parse(latestChar.createdAt)<
      c.proactive.recentCharacterCooldownMs
  ){
    scheduleDmProactive(characterId);
    return;
  }

  const apiEndpoint=getApiEndpoint();
  const accessCode=getAccessCode();

  if(!apiEndpoint||!accessCode){
    scheduleDmProactive(characterId,"retry");
    return;
  }

  await warmBackend(apiEndpoint);

  const show=
    appState.activeConversationId===conv.id &&
    !chatScreen.hidden;

  try{
    const result=await callDmProactive(
      characterId,
      accessCode,
      apiEndpoint
    );

    if(result?.send&&result.message){
      const proactivePlan=dmProactiveMessagePlan(result);
      for(let i=0;i<proactivePlan.length;i+=1){
        const item=proactivePlan[i];
        if(i>0)await sleep(550);
        if(show&&item.type!=="sticker"&&String(item.text||"").trim()){
          setTyping(true,characterId);
          await sleep(replyTypingDurationMs(item.text));
          setTyping(false);
        }
        addMessage(
          conv.id,
          characterId,
          item.text,
          {
            source:"proactive",
            seenByUser:show,
            messageType:item.type==="sticker"?"sticker":"text",
            stickerId:item.type==="sticker"?item.stickerId:"",
            awayUpdate:(i===proactivePlan.length-1?result?.awayUpdate:null)
          }
        );
      }

      if(result?.followUpMemoryKey){
        markFollowUpMemoryRecovered(characterId,result.followUpMemoryKey);
      }

      state.lastSentAt=Date.now();
      const continuityTransition=applyDmContinuityResult(state,result,characterId,state.lastSentAt);
      if(!["continue","complete"].includes(continuityTransition.action))state.dailyCount+=1;
      state.recentProactiveHistory=[
        ...(state.recentProactiveHistory||[]),
        {
          at:Date.now(),
          topicKey:
            String(result.topicKey||"").slice(0,160),
          topicOrigin:
            String(result.topicOrigin||"").slice(0,40),
          topicContinuity:
            String(result.topicContinuity||"").slice(0,40),
          text:
            String(result.message||"").slice(0,500)
        }
      ].slice(-12);

      if(activeConversationRest(conv.id))clearConversationRest(conv.id,"proactive_resume_sent");
      saveDmProactiveState(characterId,state);
      if(!continuityTransition.active)scheduleDmProactive(characterId);
    }else{
      scheduleDmProactive(characterId,"retry");
    }
  }catch{
    if(show)setTyping(false);
    scheduleDmProactive(characterId,"retry");
  }
}

      groupId,
      conversationId:g.conversationId,
      messages:recentHistoryForAPI(g.conversationId),
      sharedMemories:groupMemoriesForAPI(groupId),
      currentTime:new Date().toLocaleString("ja-JP",{dateStyle:"full",timeStyle:"short"}),
      timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
      characterAway:characterAwayForAPI(),
      proactiveContext:{
        messagesToday:state.dailyCount,
        lastActivityAt:latestMessage(g.conversationId)?.createdAt||null,
        conversationRest:activeConversationRest(g.conversationId),
        clientVersion:PUSH_VERSION,
        ...extraContext
      }
    })
  });
}

function userIntervenedInGroupSince(conversationId,sinceMs){
  const latest=latestMessage(conversationId);
  if(!latest||latest.senderId!=="mashiro")return false;
  const at=Date.parse(latest.createdAt||"");
  return Number.isFinite(at)&&at>=sinceMs;
}

async function maybeSendGroupProactive(groupId){
  if(document.visibilityState!=="visible")return;

  const g=groupById(groupId),state=loadGroupProactiveState(groupId);
  if(Date.now()<state.nextDueAt)return;
  const naturalRest=activeConversationRest(g.conversationId);
  const restUntil=Date.parse(String(naturalRest?.suppressUntil||""));
  if(naturalRest&&Number.isFinite(restUntil)&&restUntil>Date.now()){state.nextDueAt=Math.max(Number(state.nextDueAt||0),restUntil);saveGroupProactiveState(groupId,state);return;}
  if(isQuietTime()){scheduleGroupProactive(groupId);return;}
  if(state.dailyCount>=g.proactive.dailyMax){
    state.nextDueAt=nextMorningTimestamp();
    saveGroupProactiveState(groupId,state);
    return;
  }

  const latestUser=latestMessage(g.conversationId,"mashiro");
  const latestAny=latestMessage(g.conversationId);
  const now=Date.now();

  if(latestUser&&now-Date.parse(latestUser.createdAt)<g.proactive.recentUserCooldownMs){
    scheduleGroupProactive(groupId,"retry");
    return;
  }

  if(
    latestAny &&
    latestAny.senderId!=="mashiro" &&
    now-Date.parse(latestAny.createdAt)<g.proactive.recentGroupCooldownMs
  ){
    scheduleGroupProactive(groupId);
    return;
  }

  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode){
    scheduleGroupProactive(groupId,"retry");
    return;
  }

  await warmBackend(apiEndpoint);

  const show=
    appState.activeConversationId===g.conversationId &&
    !chatScreen.hidden;
  const sessionRequestedAt=Date.now();

  try{
    const result=await callGroupProactive(groupId,accessCode,apiEndpoint);

    const replies=Array.isArray(result?.replies)?result.replies.slice(0,5):[];
    if(!replies.length){
      scheduleGroupProactive(groupId,"retry");
      return;
    }

    let sentCount=0;

    for(let index=0;index<replies.length;index+=1){
      const reply=replies[index];
      if(!characterById(reply?.speakerId)||!String(reply?.message||"").trim())continue;

      // API待ちや会話途中でましろが入ってきたら、
      // それ以降の自律会話は止める。
      if(userIntervenedInGroupSince(g.conversationId,sessionRequestedAt)){
        break;
      }

      if(index>0){
        await sleep(1800+Math.min(2400,String(reply.message).length*25));
        if(userIntervenedInGroupSince(g.conversationId,sessionRequestedAt)){
          break;
        }
      }

      if(show){
        setTyping(true,reply.speakerId);
        await sleep(replyTypingDurationMs(reply.message,{group:true}));
        setTyping(false);
      }

      addMessage(
        g.conversationId,
        reply.speakerId,
        String(reply.message).trim(),
        {
          source:"group-autonomous",
          seenByUser:show,
          awayUpdate:reply?.awayUpdate||null
        }
      );
      const autonomousStickerId=normalizeStickerId(reply?.stickerId);
      if(autonomousStickerId){
        await sleep(500);
        addMessage(
          g.conversationId,
          reply.speakerId,
          stickerToken(autonomousStickerId),
          {source:"group-autonomous",seenByUser:show,messageType:"sticker",stickerId:autonomousStickerId}
        );
      }
      sentCount+=1;
    }

    if(sentCount>0){
      state.lastSentAt=Date.now();
      state.dailyCount+=1;
      if(activeConversationRest(g.conversationId))clearConversationRest(g.conversationId,"group_proactive_resume_sent");
      saveGroupProactiveState(groupId,state);
      scheduleGroupProactive(groupId);
    }else{
      scheduleGroupProactive(groupId,"retry");
    }
  }catch{
    if(show)setTyping(false);
    scheduleGroupProactive(groupId,"retry");
  }
}

async function proactiveTick(){if(pushNotificationsEnabled())return;if(appState.proactiveBusy||document.visibilityState!=="visible")return;appState.proactiveBusy=true;try{const due=[];for(const id of Object.keys(CHARACTERS)){const s=loadDmProactiveState(id);if(Date.now()>=s.nextDueAt)due.push({type:"dm",id,due:s.nextDueAt});}for(const id of Object.keys(GROUPS)){const s=loadGroupProactiveState(id);if(Date.now()>=s.nextDueAt)due.push({type:"group",id,due:s.nextDueAt});}due.sort((a,b)=>a.due-b.due);const next=due[0];if(next){if(next.type==="dm")await maybeSendDmProactive(next.id);else await maybeSendGroupProactive(next.id);}}finally{appState.proactiveBusy=false;}}
function startProactiveScheduler(){clearInterval(appState.proactiveTimer);setTimeout(proactiveTick,1500);appState.proactiveTimer=setInterval(proactiveTick,60*1000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(proactiveTick,700);});window.addEventListener("focus",()=>setTimeout(proactiveTick,700));}

async function resetActiveConversation(clearMemory){const conversation=activeConversation();if(!conversation)return;appState.currentRequestController?.abort();appState.isReplying=false;setTyping(false);removeDelayedDmForConversation(conversation.id);removeDelayedGroupForConversation(conversation.id);clearConversationRest(conversation.id,"conversation_reset");await deleteMediaForConversation(conversation.id);clearPendingImage();clearPendingReply();closeStickerPanel();saveConversationMessages(conversation.id,conversationSeed(conversation));if(conversation.type==="dm"){if(clearMemory)localStorage.removeItem(memoryKey(conversation.characterId));localStorage.removeItem(proactiveKey(conversation.characterId));}else{if(clearMemory)localStorage.removeItem(groupMemoryKey(conversation.groupId));localStorage.removeItem(groupProactiveKey(conversation.groupId));}resetMemoryCheckbox.checked=false;renderMessages();renderTalkList();autosizeInput();setTimeout(()=>scrollToBottom("auto"),0);}

    const state=messageLongPressState;
