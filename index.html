<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f7f7f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ましろLINE" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
:root {
  color-scheme: light;
  --bg: #eef1f5;
  --panel: #f8f8fa;
  --text: #1c1c1e;
  --subtext: #73777f;
  --line: rgba(60, 60, 67, 0.16);
  --incoming: #ffffff;
  --outgoing: #d9f7be;
  --accent: #4d8f5b;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}

body {
  overscroll-behavior: none;
}

button, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-shell {
  min-height: 100dvh;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  background:
    linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.16)),
    var(--bg);
  overflow: hidden;
}

.topbar {
  min-height: 62px;
  padding: calc(7px + env(safe-area-inset-top)) 12px 7px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  background: rgba(248, 248, 250, .92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 5;
}

.topbar-side--left {
  font-size: 36px;
  line-height: 1;
  color: #9a9aa0;
  padding-left: 6px;
}

.profile-heading {
  display: flex;
  gap: 9px;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.profile-heading h1 {
  margin: 0;
  font-size: 16px;
  line-height: 1.15;
  font-weight: 700;
}

.status-text {
  margin: 2px 0 0;
  font-size: 10px;
  color: var(--subtext);
  text-align: left;
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 14px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}

.avatar--natsuki {
  background: #f3d99c;
  color: #6f5124;
}

.avatar--mini {
  width: 28px;
  height: 28px;
  font-size: 11px;
  flex: 0 0 auto;
}

.icon-button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #62656b;
  font-size: 22px;
  cursor: pointer;
}

.icon-button:active { background: rgba(0,0,0,.06); }

.message-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 18px;
  scroll-behavior: smooth;
}

.day-divider {
  display: flex;
  justify-content: center;
  margin: 8px 0 14px;
}

.day-divider span {
  font-size: 11px;
  color: #73777f;
  background: rgba(255, 255, 255, .62);
  border-radius: 999px;
  padding: 4px 9px;
}

.message-row {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  margin: 0 0 10px;
}

.message-row--outgoing { justify-content: flex-end; }

.message-stack {
  display: flex;
  flex-direction: column;
  max-width: min(76%, 520px);
}

.message-row--outgoing .message-stack { align-items: flex-end; }
.message-row--incoming .message-stack { align-items: flex-start; }

.bubble {
  position: relative;
  padding: 9px 12px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: var(--shadow);
}

.bubble--incoming {
  background: var(--incoming);
  border-bottom-left-radius: 5px;
}

.bubble--outgoing {
  background: var(--outgoing);
  border-bottom-right-radius: 5px;
}

.message-meta {
  min-height: 15px;
  margin-top: 3px;
  font-size: 10px;
  line-height: 1.2;
  color: #74777d;
  display: flex;
  gap: 5px;
}

.read-label { color: #777b82; }

.typing-row {
  min-height: 46px;
  display: none;
  align-items: center;
  gap: 7px;
  padding: 4px 12px 8px;
}

/* 表示状態は hidden 属性ではなく専用クラスで明示的に制御する */
.typing-row.is-visible {
  display: flex;
}

.typing-bubble {
  height: 32px;
  min-width: 54px;
  padding: 0 11px;
  background: #fff;
  border-radius: 16px 16px 16px 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: var(--shadow);
}

.typing-bubble span {
  width: 6px;
  height: 6px;
  background: #9b9ea4;
  border-radius: 50%;
  animation: typing 1.05s infinite ease-in-out;
}
.typing-bubble span:nth-child(2) { animation-delay: .12s; }
.typing-bubble span:nth-child(3) { animation-delay: .24s; }

.typing-label {
  font-size: 11px;
  color: var(--subtext);
}

@keyframes typing {
  0%, 55%, 100% { transform: translateY(0); opacity: .45; }
  25% { transform: translateY(-3px); opacity: 1; }
}

.composer {
  display: grid;
  grid-template-columns: 1fr 42px;
  gap: 8px;
  align-items: end;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: rgba(248, 248, 250, .96);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

#messageInput {
  width: 100%;
  max-height: 120px;
  resize: none;
  border: 1px solid rgba(60, 60, 67, .18);
  outline: none;
  border-radius: 20px;
  padding: 9px 13px;
  background: #fff;
  color: var(--text);
  font-size: 15px;
  line-height: 1.35;
  overflow-y: auto;
}

#messageInput:focus { border-color: rgba(77, 143, 91, .45); }

.send-button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 16px;
  cursor: pointer;
  padding-left: 4px;
}

.send-button:disabled {
  opacity: .35;
  cursor: default;
}

.dialog {
  border: 0;
  padding: 0;
  background: transparent;
  max-width: calc(100vw - 32px);
}

.dialog::backdrop { background: rgba(0,0,0,.28); }

.dialog-card {
  width: min(360px, calc(100vw - 32px));
  background: #fff;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 18px 60px rgba(0,0,0,.2);
}

.dialog-card h2 {
  font-size: 17px;
  margin: 0 0 8px;
}

.dialog-card p {
  font-size: 13px;
  line-height: 1.55;
  color: var(--subtext);
  margin: 0 0 18px;
}

.dialog-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.dialog-actions button {
  border: 0;
  border-radius: 10px;
  padding: 11px;
  font-weight: 600;
}

.dialog-secondary { background: #eceef1; }
.dialog-danger { background: #d94c4c; color: #fff; }

.reset-memory-option {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: -4px 0 16px;
  color: #565a61;
  font-size: 13px;
  line-height: 1.4;
}

.reset-memory-option input {
  width: 18px;
  height: 18px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@media (min-width: 700px) {
  body { display: grid; place-items: center; padding: 24px; }
  .app-shell {
    width: min(430px, 100%);
    min-height: min(860px, calc(100dvh - 48px));
    height: min(860px, calc(100dvh - 48px));
    border-radius: 28px;
    box-shadow: 0 20px 80px rgba(0,0,0,.16);
  }
  .topbar { padding-top: 9px; border-radius: 28px 28px 0 0; }
}


.toast {
  position: absolute;
  left: 50%;
  bottom: calc(78px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(8px);
  max-width: calc(100% - 32px);
  padding: 9px 13px;
  border-radius: 12px;
  background: rgba(30, 30, 32, .92);
  color: #fff;
  font-size: 12px;
  line-height: 1.4;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  z-index: 20;
  text-align: center;
}
.toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.access-input {
  width: 100%;
  border: 1px solid rgba(60, 60, 67, .20);
  border-radius: 12px;
  padding: 11px 12px;
  font: inherit;
  font-size: 15px;
  outline: none;
  margin-bottom: 14px;
}
.access-input:focus { border-color: rgba(77, 143, 91, .55); }

</style>

<body>
  <main class="app-shell" aria-label="夏樹とのトーク">
    <header class="topbar">
      <div class="topbar-side topbar-side--left" aria-hidden="true">‹</div>
      <div class="profile-heading">
        <div class="avatar avatar--natsuki" aria-hidden="true">夏</div>
        <div>
          <h1>夏樹</h1>
          <p id="statusText" class="status-text">オンライン</p>
        </div>
      </div>
      <button id="resetButton" class="icon-button" type="button" aria-label="トーク履歴を初期化">↻</button>
    </header>

    <section id="messageList" class="message-list" aria-live="polite" aria-label="メッセージ履歴"></section>

    <div id="typingRow" class="typing-row" aria-hidden="true">
      <div class="avatar avatar--mini avatar--natsuki" aria-hidden="true">夏</div>
      <div class="typing-bubble" aria-label="夏樹が入力中">
        <span></span><span></span><span></span>
      </div>
      <span class="typing-label">夏樹が入力中…</span>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="messageInput">メッセージ</label>
      <textarea id="messageInput" rows="1" maxlength="500" placeholder="メッセージ" enterkeyhint="send"></textarea>
      <button id="sendButton" class="send-button" type="submit" disabled aria-label="送信">➤</button>
    </form>
  </main>

  <dialog id="resetDialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <h2>トークを初期化しますか？</h2>
      <p>保存されている夏樹との履歴を削除して、最初の状態に戻します。</p>
      <label class="reset-memory-option">
        <input id="resetMemoryCheckbox" type="checkbox" />
        <span>長期記憶も削除する</span>
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="dialog-secondary">キャンセル</button>
        <button id="confirmReset" value="default" class="dialog-danger">初期化</button>
      </div>
    </form>
  </dialog>

  <dialog id="accessDialog" class="dialog">
    <form id="accessForm" class="dialog-card">
      <h2>AI接続コード</h2>
      <p>バックエンドに設定した接続コードを入力してください。コードはこのiPhone内にだけ保存されます。</p>
      <input id="accessCodeInput" class="access-input" type="password" autocomplete="off" maxlength="120" placeholder="接続コード" />
      <div class="dialog-actions">
        <button id="accessCancel" type="button" class="dialog-secondary">キャンセル</button>
        <button type="submit" class="send-button" style="width:auto;height:auto;border-radius:10px;padding:11px;font-weight:600;">保存</button>
      </div>
    </form>
  </dialog>


  <dialog id="backendDialog" class="dialog">
    <form id="backendForm" class="dialog-card">
      <h2>AIバックエンドURL</h2>
      <p>Replitで公開したバックエンドのURLを入力してください。AIが生成する夏樹のメッセージは創作シミュレーション用で、本編の正式設定には自動反映されません。</p>
      <input id="backendUrlInput" class="access-input" type="url" inputmode="url" autocomplete="off" maxlength="240" placeholder="https://xxxxx.replit.app" />
      <div class="dialog-actions">
        <button id="backendCancel" type="button" class="dialog-secondary">キャンセル</button>
        <button type="submit" class="send-button" style="width:auto;height:auto;border-radius:10px;padding:11px;font-weight:600;">保存</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script>
const STORAGE_KEY = "mashiroLine.phase1.natsuki.messages.v1";
const ACCESS_CODE_KEY = "mashiroLine.phase1_5.accessCode.v1";
const BACKEND_URL_KEY = "mashiroLine.phase1_5.backendUrl.v1";
const MEMORY_STORAGE_KEY = "mashiroLine.phase1_6.natsuki.memories.v1";
const MAX_LONG_TERM_MEMORIES = 40;
const MAX_MEMORIES_SENT_TO_AI = 24;
const PROACTIVE_STATE_KEY = "mashiroLine.phase1_7.natsuki.proactive.v1";
const PROACTIVE_DAILY_MAX = 4;
const PROACTIVE_FIRST_MIN_MS = 2 * 60 * 1000;
const PROACTIVE_FIRST_MAX_MS = 5 * 60 * 1000;
const PROACTIVE_NORMAL_MIN_MS = 90 * 60 * 1000;
const PROACTIVE_NORMAL_MAX_MS = 240 * 60 * 1000;
const PROACTIVE_RETRY_MIN_MS = 12 * 60 * 1000;
const PROACTIVE_RETRY_MAX_MS = 25 * 60 * 1000;
const PROACTIVE_RECENT_USER_COOLDOWN_MS = 20 * 60 * 1000;
const PROACTIVE_RECENT_NATSUKI_COOLDOWN_MS = 3 * 60 * 60 * 1000;
const CONFIGURED_API_ENDPOINT = window.MASHIROLINE_API_ENDPOINT || "";

const messageList = document.getElementById("messageList");
const composer = document.getElementById("composer");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const typingRow = document.getElementById("typingRow");
const statusText = document.getElementById("statusText");
const resetButton = document.getElementById("resetButton");
const resetDialog = document.getElementById("resetDialog");
const confirmReset = document.getElementById("confirmReset");
const resetMemoryCheckbox = document.getElementById("resetMemoryCheckbox");
const toast = document.getElementById("toast");
const accessDialog = document.getElementById("accessDialog");
const accessForm = document.getElementById("accessForm");
const accessCodeInput = document.getElementById("accessCodeInput");
const accessCancel = document.getElementById("accessCancel");
const backendDialog = document.getElementById("backendDialog");
const backendForm = document.getElementById("backendForm");
const backendUrlInput = document.getElementById("backendUrlInput");
const backendCancel = document.getElementById("backendCancel");

let messages = loadMessages();
let longTermMemories = loadLongTermMemories();
let isReplying = false;
let currentRequestController = null;
let proactiveRequestController = null;
let proactiveCheckTimer = null;
let proactiveState = loadProactiveState();
let toastTimer = null;

function makeId() {
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function seedMessages() {
  const now = new Date();
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  yesterday.setHours(21, 18, 0, 0);

  return [
    {
      id: makeId(),
      sender: "natsuki",
      text: "じゃ、また明日",
      createdAt: yesterday.toISOString(),
      read: true
    }
  ];
}

function loadMessages() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const seeded = seedMessages();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
      return seeded;
    }
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : seedMessages();
  } catch {
    return seedMessages();
  }
}

function saveMessages() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
}


function loadLongTermMemories() {
  try {
    const raw = localStorage.getItem(MEMORY_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    const list = Array.isArray(parsed) ? parsed : [];
    return pruneLongTermMemories(list);
  } catch {
    return [];
  }
}

function saveLongTermMemories() {
  longTermMemories = pruneLongTermMemories(longTermMemories);
  localStorage.setItem(MEMORY_STORAGE_KEY, JSON.stringify(longTermMemories));
}

function pruneLongTermMemories(list) {
  const now = Date.now();

  const valid = (Array.isArray(list) ? list : []).filter((memory) => {
    if (!memory || typeof memory.text !== "string" || !memory.text.trim()) return false;
    if (!memory.expiresAt) return true;
    const expires = Date.parse(memory.expiresAt);
    return Number.isNaN(expires) || expires > now;
  });

  valid.sort((a, b) => {
    const importanceDiff = Number(b.importance || 1) - Number(a.importance || 1);
    if (importanceDiff !== 0) return importanceDiff;
    return Date.parse(b.updatedAt || b.createdAt || 0) - Date.parse(a.updatedAt || a.createdAt || 0);
  });

  return valid.slice(0, MAX_LONG_TERM_MEMORIES);
}

function normalizeMemoryText(text) {
  return String(text || "")
    .trim()
    .replace(/\s+/g, " ")
    .replace(/[。．.]+$/g, "")
    .toLowerCase();
}

function memoryExpiryFromTTL(ttlDays) {
  const days = Number(ttlDays);
  if (!Number.isFinite(days) || days >= 3650) return null;
  const date = new Date();
  date.setDate(date.getDate() + Math.max(1, days));
  return date.toISOString();
}

function mergeMemoryCandidates(candidates) {
  if (!Array.isArray(candidates) || candidates.length === 0) return;

  const nowIso = new Date().toISOString();

  for (const candidate of candidates.slice(0, 2)) {
    const text = String(candidate?.text || "").trim().slice(0, 240);
    if (!text) continue;

    const key = String(candidate?.key || "")
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]+/g, "_")
      .replace(/^_+|_+$/g, "")
      .slice(0, 80);

    const category = ["event", "preference", "habit", "promise", "relationship", "school", "other"]
      .includes(candidate?.category)
      ? candidate.category
      : "other";

    const importance = [1, 2, 3].includes(Number(candidate?.importance))
      ? Number(candidate.importance)
      : 1;

    const expiresAt = memoryExpiryFromTTL(candidate?.ttlDays);
    const normalized = normalizeMemoryText(text);

    let existing = null;

    if (key) {
      existing = longTermMemories.find((memory) => memory.key === key) || null;
    }

    if (!existing) {
      existing = longTermMemories.find(
        (memory) => normalizeMemoryText(memory.text) === normalized
      ) || null;
    }

    if (existing) {
      existing.key = key || existing.key || `memory_${makeId().replace(/[^a-z0-9]/gi, "_")}`;
      existing.text = text;
      existing.category = category;
      existing.importance = Math.max(Number(existing.importance || 1), importance);
      existing.updatedAt = nowIso;
      existing.expiresAt = expiresAt;
    } else {
      longTermMemories.push({
        id: makeId(),
        key: key || `memory_${Date.now()}_${Math.random().toString(16).slice(2, 8)}`,
        text,
        category,
        importance,
        createdAt: nowIso,
        updatedAt: nowIso,
        expiresAt
      });
    }
  }

  saveLongTermMemories();
}

function memoriesForAPI() {
  longTermMemories = pruneLongTermMemories(longTermMemories);
  saveLongTermMemories();

  return longTermMemories
    .slice(0, MAX_MEMORIES_SENT_TO_AI)
    .map((memory) => ({
      id: memory.id,
      key: memory.key,
      text: memory.text,
      category: memory.category,
      importance: memory.importance,
      createdAt: memory.createdAt,
      updatedAt: memory.updatedAt,
      expiresAt: memory.expiresAt
    }));
}


function randomBetween(min, max) {
  return min + Math.random() * (max - min);
}

function proactiveDateKey(date = new Date()) {
  return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
}

function loadProactiveState() {
  const now = Date.now();

  try {
    const raw = localStorage.getItem(PROACTIVE_STATE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        const todayKey = proactiveDateKey();
        if (parsed.dailyDate !== todayKey) {
          parsed.dailyDate = todayKey;
          parsed.dailyCount = 0;
        }

        if (!Number.isFinite(Number(parsed.nextDueAt))) {
          parsed.nextDueAt = now + randomBetween(PROACTIVE_FIRST_MIN_MS, PROACTIVE_FIRST_MAX_MS);
        }

        return {
          nextDueAt: Number(parsed.nextDueAt),
          lastSentAt: Number(parsed.lastSentAt || 0),
          dailyDate: parsed.dailyDate || todayKey,
          dailyCount: Number(parsed.dailyCount || 0),
          firstRunDone: Boolean(parsed.firstRunDone)
        };
      }
    }
  } catch {}

  const initial = {
    nextDueAt: now + randomBetween(PROACTIVE_FIRST_MIN_MS, PROACTIVE_FIRST_MAX_MS),
    lastSentAt: 0,
    dailyDate: proactiveDateKey(),
    dailyCount: 0,
    firstRunDone: false
  };

  localStorage.setItem(PROACTIVE_STATE_KEY, JSON.stringify(initial));
  return initial;
}

function saveProactiveState() {
  localStorage.setItem(PROACTIVE_STATE_KEY, JSON.stringify(proactiveState));
}

function refreshProactiveDay() {
  const todayKey = proactiveDateKey();
  if (proactiveState.dailyDate !== todayKey) {
    proactiveState.dailyDate = todayKey;
    proactiveState.dailyCount = 0;
    saveProactiveState();
  }
}

function nextAllowedMorningTimestamp(now = new Date()) {
  const target = new Date(now);
  const hour = now.getHours() + now.getMinutes() / 60;

  if (hour >= 22.5) {
    target.setDate(target.getDate() + 1);
    target.setHours(7, 15 + Math.floor(Math.random() * 45), 0, 0);
    return target.getTime();
  }

  if (hour < 7) {
    target.setHours(7, 15 + Math.floor(Math.random() * 45), 0, 0);
    return target.getTime();
  }

  return null;
}

function isProactiveQuietTime(date = new Date()) {
  const hour = date.getHours() + date.getMinutes() / 60;
  return hour >= 22.5 || hour < 7;
}

function scheduleNextProactive(mode = "normal") {
  const now = Date.now();
  const quietTarget = nextAllowedMorningTimestamp(new Date());

  if (quietTarget) {
    proactiveState.nextDueAt = quietTarget;
  } else if (mode === "retry") {
    proactiveState.nextDueAt = now + randomBetween(PROACTIVE_RETRY_MIN_MS, PROACTIVE_RETRY_MAX_MS);
  } else if (mode === "first") {
    proactiveState.nextDueAt = now + randomBetween(PROACTIVE_FIRST_MIN_MS, PROACTIVE_FIRST_MAX_MS);
  } else {
    proactiveState.nextDueAt = now + randomBetween(PROACTIVE_NORMAL_MIN_MS, PROACTIVE_NORMAL_MAX_MS);
  }

  saveProactiveState();
}

function noteUserActivityForProactive() {
  proactiveState.firstRunDone = true;
  scheduleNextProactive("normal");
}

function getLatestMessageBySender(sender) {
  for (let index = messages.length - 1; index >= 0; index -= 1) {
    if (messages[index]?.sender === sender) return messages[index];
  }
  return null;
}

function getLastUserActivityTimestamp() {
  const message = getLatestMessageBySender("mashiro");
  return message ? Date.parse(message.createdAt) || 0 : 0;
}

function getLastNatsukiTimestamp() {
  const message = getLatestMessageBySender("natsuki");
  return message ? Date.parse(message.createdAt) || 0 : 0;
}

function proactiveEndpointFor(apiEndpoint) {
  return String(apiEndpoint || "").replace(/\/api\/chat(?:\?.*)?$/, "/api/proactive");
}

async function callProactiveAIOnce(accessCode, apiEndpoint) {
  const endpoint = proactiveEndpointFor(apiEndpoint);
  if (!endpoint || endpoint === apiEndpoint) {
    const error = new Error("invalid_proactive_endpoint");
    error.code = "invalid_proactive_endpoint";
    throw error;
  }

  proactiveRequestController = new AbortController();
  const timeout = setTimeout(() => proactiveRequestController.abort(), 45000);

  try {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-App-Code": accessCode
      },
      body: JSON.stringify({
        messages: recentHistoryForAPI(),
        memories: memoriesForAPI(),
        currentTime: new Date().toLocaleString("ja-JP", { dateStyle: "full", timeStyle: "short" }),
        localTime: new Date().toLocaleString("ja-JP", { dateStyle: "full", timeStyle: "short" }),
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        proactiveContext: {
          lastUserActivityAt: getLastUserActivityTimestamp()
            ? new Date(getLastUserActivityTimestamp()).toISOString()
            : null,
          lastNatsukiMessageAt: getLastNatsukiTimestamp()
            ? new Date(getLastNatsukiTimestamp()).toISOString()
            : null,
          messagesToday: proactiveState.dailyCount
        }
      }),
      signal: proactiveRequestController.signal,
      cache: "no-store"
    });

    let data = {};
    try { data = await response.json(); } catch {}

    if (response.status === 401) {
      const error = new Error("invalid_app_code");
      error.code = "invalid_app_code";
      throw error;
    }

    if (!response.ok) {
      const error = new Error(String(data?.error || `http_${response.status}`));
      error.status = response.status;
      if (response.status === 429) error.code = "rate_limited";
      else if ([500, 502, 503, 504].includes(response.status)) error.code = "temporary_error";
      else error.code = "api_error";
      throw error;
    }

    return {
      send: Boolean(data?.send),
      message: typeof data?.message === "string" ? data.message.trim() : ""
    };
  } finally {
    clearTimeout(timeout);
    proactiveRequestController = null;
  }
}

async function callProactiveAI(accessCode, apiEndpoint) {
  let lastError;

  for (let attempt = 0; attempt < 2; attempt += 1) {
    try {
      return await callProactiveAIOnce(accessCode, apiEndpoint);
    } catch (error) {
      lastError = error;
      const retryable =
        error?.name === "AbortError" ||
        error instanceof TypeError ||
        error?.code === "temporary_error" ||
        error?.code === "rate_limited";

      if (!retryable || attempt === 1) throw error;

      await warmBackend(apiEndpoint);
      await sleep(1800);
    }
  }

  throw lastError;
}

function addProactiveMessage(text) {
  const message = {
    id: makeId(),
    sender: "natsuki",
    text,
    createdAt: new Date().toISOString(),
    read: true,
    proactive: true
  };

  messages.push(message);
  saveMessages();
  renderMessages();
  scrollToBottom();
  return message;
}

async function maybeSendProactiveMessage() {
  refreshProactiveDay();

  if (document.visibilityState !== "visible") return;
  if (isReplying || proactiveRequestController) return;
  if (messageInput.value.trim()) return;
  if (Date.now() < Number(proactiveState.nextDueAt || 0)) return;

  if (isProactiveQuietTime()) {
    scheduleNextProactive("normal");
    return;
  }

  if (proactiveState.dailyCount >= PROACTIVE_DAILY_MAX) {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(7, 30 + Math.floor(Math.random() * 60), 0, 0);
    proactiveState.nextDueAt = tomorrow.getTime();
    saveProactiveState();
    return;
  }

  const now = Date.now();
  const lastUserAt = getLastUserActivityTimestamp();
  const lastNatsukiAt = getLastNatsukiTimestamp();
  const lastMessage = messages[messages.length - 1];

  if (lastUserAt && now - lastUserAt < PROACTIVE_RECENT_USER_COOLDOWN_MS) {
    scheduleNextProactive("retry");
    return;
  }

  if (
    lastMessage?.sender === "natsuki" &&
    lastNatsukiAt &&
    now - lastNatsukiAt < PROACTIVE_RECENT_NATSUKI_COOLDOWN_MS
  ) {
    scheduleNextProactive("normal");
    return;
  }

  const apiEndpoint = getApiEndpoint();
  const accessCode = getAccessCode();

  // 自発メッセージのためだけに設定ダイアログを突然出さない。
  if (!apiEndpoint || !accessCode) {
    scheduleNextProactive("retry");
    return;
  }

  await warmBackend(apiEndpoint);

  setTyping(true);
  const typingStartedAt = Date.now();

  try {
    const result = await callProactiveAI(accessCode, apiEndpoint);
    const remaining = Math.max(0, 850 - (Date.now() - typingStartedAt));
    if (remaining) await sleep(remaining);
    setTyping(false);

    if (result.send && result.message) {
      addProactiveMessage(result.message);
      proactiveState.lastSentAt = Date.now();
      proactiveState.dailyCount += 1;
      proactiveState.firstRunDone = true;
      scheduleNextProactive("normal");
    } else {
      scheduleNextProactive("retry");
    }
  } catch {
    setTyping(false);
    // 自発メッセージ失敗はユーザー操作を邪魔しないよう、トーストを出さず静かに再試行。
    scheduleNextProactive("retry");
  }
}

function startProactiveScheduler() {
  if (proactiveCheckTimer) clearInterval(proactiveCheckTimer);

  setTimeout(() => {
    maybeSendProactiveMessage();
  }, 1200);

  proactiveCheckTimer = setInterval(() => {
    maybeSendProactiveMessage();
  }, 60 * 1000);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      setTimeout(() => maybeSendProactiveMessage(), 700);
    }
  });

  window.addEventListener("focus", () => {
    setTimeout(() => maybeSendProactiveMessage(), 700);
  });
}

function formatTime(iso) {
  return new Intl.DateTimeFormat("ja-JP", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(new Date(iso));
}

function dayKey(date) {
  return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
}

function dayLabel(date) {
  const today = new Date();
  const y = new Date(today);
  y.setDate(today.getDate() - 1);

  if (dayKey(date) === dayKey(today)) return "今日";
  if (dayKey(date) === dayKey(y)) return "昨日";

  return new Intl.DateTimeFormat("ja-JP", {
    month: "numeric",
    day: "numeric",
    weekday: "short"
  }).format(date);
}

function renderMessages() {
  messageList.innerHTML = "";
  let previousDay = null;

  for (const message of messages) {
    const date = new Date(message.createdAt);
    const currentDay = dayKey(date);

    if (currentDay !== previousDay) {
      const divider = document.createElement("div");
      divider.className = "day-divider";
      const label = document.createElement("span");
      label.textContent = dayLabel(date);
      divider.appendChild(label);
      messageList.appendChild(divider);
      previousDay = currentDay;
    }

    const outgoing = message.sender === "mashiro";
    const row = document.createElement("article");
    row.className = `message-row ${outgoing ? "message-row--outgoing" : "message-row--incoming"}`;
    row.dataset.messageId = message.id;

    if (!outgoing) {
      const avatar = document.createElement("div");
      avatar.className = "avatar avatar--mini avatar--natsuki";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = "夏";
      row.appendChild(avatar);
    }

    const stack = document.createElement("div");
    stack.className = "message-stack";

    const bubble = document.createElement("div");
    bubble.className = `bubble ${outgoing ? "bubble--outgoing" : "bubble--incoming"}`;
    bubble.textContent = message.text;

    const meta = document.createElement("div");
    meta.className = "message-meta";

    if (outgoing && message.read) {
      const read = document.createElement("span");
      read.className = "read-label";
      read.textContent = "既読";
      meta.appendChild(read);
    }

    const time = document.createElement("time");
    time.dateTime = message.createdAt;
    time.textContent = formatTime(message.createdAt);
    meta.appendChild(time);

    stack.appendChild(bubble);
    stack.appendChild(meta);
    row.appendChild(stack);
    messageList.appendChild(row);
  }
}

function scrollToBottom(behavior = "smooth") {
  requestAnimationFrame(() => {
    messageList.scrollTo({ top: messageList.scrollHeight, behavior });
  });
}

function setTyping(visible) {
  typingRow.classList.toggle("is-visible", visible);
  typingRow.setAttribute("aria-hidden", visible ? "false" : "true");
  statusText.textContent = visible ? "入力中…" : "オンライン";
  if (visible) scrollToBottom();
}

function showToast(text, duration = 3200) {
  clearTimeout(toastTimer);
  toast.textContent = text;
  toast.classList.add("is-visible");
  toastTimer = setTimeout(() => toast.classList.remove("is-visible"), duration);
}

function autosizeInput() {
  messageInput.style.height = "auto";
  messageInput.style.height = `${Math.min(messageInput.scrollHeight, 120)}px`;
  sendButton.disabled = messageInput.value.trim().length === 0 || isReplying;
}

function addMessage(sender, text, read = false) {
  const message = {
    id: makeId(),
    sender,
    text,
    createdAt: new Date().toISOString(),
    read
  };
  messages.push(message);
  saveMessages();
  renderMessages();
  scrollToBottom();
  return message;
}

function markOutgoingAsRead() {
  let changed = false;
  for (const message of messages) {
    if (message.sender === "mashiro" && !message.read) {
      message.read = true;
      changed = true;
    }
  }
  if (changed) {
    saveMessages();
    renderMessages();
    scrollToBottom("auto");
  }
}

function getAccessCode() {
  return localStorage.getItem(ACCESS_CODE_KEY) || "";
}

function askForAccessCode() {
  return new Promise((resolve) => {
    const existing = getAccessCode();
    accessCodeInput.value = existing;

    const cleanup = () => {
      accessForm.removeEventListener("submit", onSubmit);
      accessCancel.removeEventListener("click", onCancel);
      accessDialog.removeEventListener("cancel", onCancel);
    };

    const onSubmit = (event) => {
      event.preventDefault();
      const code = accessCodeInput.value.trim();
      if (!code) {
        showToast("接続コードを入力してください");
        return;
      }
      localStorage.setItem(ACCESS_CODE_KEY, code);
      cleanup();
      accessDialog.close();
      resolve(code);
    };

    const onCancel = (event) => {
      event?.preventDefault?.();
      cleanup();
      accessDialog.close();
      resolve("");
    };

    accessForm.addEventListener("submit", onSubmit);
    accessCancel.addEventListener("click", onCancel);
    accessDialog.addEventListener("cancel", onCancel);
    accessDialog.showModal();
    setTimeout(() => accessCodeInput.focus(), 50);
  });
}


function normalizeBackendUrl(value) {
  let url = String(value || "").trim().replace(/\/+$/, "");
  if (!/^https:\/\//i.test(url)) return "";
  return `${url}/api/chat`;
}

function getApiEndpoint() {
  // 配布済みの設定URLを最優先する。過去バージョンで保存された古いURLが
  // localStorageに残っていても、現在のバックエンドへ接続する。
  if (CONFIGURED_API_ENDPOINT) return CONFIGURED_API_ENDPOINT;
  const saved = localStorage.getItem(BACKEND_URL_KEY) || "";
  if (saved) return normalizeBackendUrl(saved);
  return "";
}

function askForBackendUrl() {
  return new Promise((resolve) => {
    const existing = localStorage.getItem(BACKEND_URL_KEY) || "";
    backendUrlInput.value = existing;

    const cleanup = () => {
      backendForm.removeEventListener("submit", onSubmit);
      backendCancel.removeEventListener("click", onCancel);
      backendDialog.removeEventListener("cancel", onCancel);
    };

    const onSubmit = (event) => {
      event.preventDefault();
      const raw = backendUrlInput.value.trim();
      if (!normalizeBackendUrl(raw)) {
        showToast("https:// から始まる公開URLを入力してください");
        return;
      }
      localStorage.setItem(BACKEND_URL_KEY, raw.replace(/\/+$/, ""));
      cleanup();
      backendDialog.close();
      resolve(normalizeBackendUrl(raw));
    };

    const onCancel = (event) => {
      event?.preventDefault?.();
      cleanup();
      backendDialog.close();
      resolve("");
    };

    backendForm.addEventListener("submit", onSubmit);
    backendCancel.addEventListener("click", onCancel);
    backendDialog.addEventListener("cancel", onCancel);
    backendDialog.showModal();
    setTimeout(() => backendUrlInput.focus(), 50);
  });
}

function recentHistoryForAPI() {
  return messages.slice(-30).map((message) => ({
    sender: message.sender,
    text: message.text,
    createdAt: message.createdAt
  }));
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function healthEndpointFor(apiEndpoint) {
  return String(apiEndpoint || "").replace(/\/api\/chat(?:\?.*)?$/, "/health");
}

async function warmBackend(apiEndpoint) {
  const healthEndpoint = healthEndpointFor(apiEndpoint);
  if (!healthEndpoint || healthEndpoint === apiEndpoint) return;

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    await fetch(healthEndpoint, {
      method: "GET",
      cache: "no-store",
      signal: controller.signal
    });
  } catch {
    // Replit がスリープ復帰中でも、次の本リクエスト側で再試行する。
  } finally {
    clearTimeout(timeout);
  }
}

async function callNatsukiAIOnce(accessCode, apiEndpoint) {
  currentRequestController = new AbortController();
  const timeout = setTimeout(() => currentRequestController.abort(), 45000);

  try {
    const response = await fetch(apiEndpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-App-Code": accessCode
      },
      body: JSON.stringify({
        messages: recentHistoryForAPI(),
        memories: memoriesForAPI(),
        currentTime: new Date().toLocaleString("ja-JP", { dateStyle: "full", timeStyle: "short" }),
        localTime: new Date().toLocaleString("ja-JP", { dateStyle: "full", timeStyle: "short" }),
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
      }),
      signal: currentRequestController.signal,
      cache: "no-store"
    });

    let data = {};
    try { data = await response.json(); } catch {}

    if (response.status === 401) {
      localStorage.removeItem(ACCESS_CODE_KEY);
      const error = new Error("invalid_app_code");
      error.code = "invalid_app_code";
      throw error;
    }

    if (!response.ok || typeof data?.reply !== "string" || !data.reply.trim()) {
      const rawError = String(data?.error || `http_${response.status}`);
      const normalized = rawError.toLowerCase();
      let code = "api_error";
      if (response.status === 403 || normalized.includes("origin")) code = "origin_not_allowed";
      else if (normalized.includes("configured")) code = "server_not_configured";
      else if (response.status === 429 || normalized.includes("rate")) code = "rate_limited";
      else if ([500, 502, 503, 504].includes(response.status)) code = "temporary_error";
      const error = new Error(rawError);
      error.code = code;
      error.status = response.status;
      throw error;
    }

    return {
      reply: data.reply.trim(),
      memoryCandidates: Array.isArray(data.memoryCandidates) ? data.memoryCandidates : []
    };
  } finally {
    clearTimeout(timeout);
    currentRequestController = null;
  }
}

async function callNatsukiAI(accessCode, apiEndpoint) {
  let lastError;

  for (let attempt = 0; attempt < 2; attempt += 1) {
    try {
      return await callNatsukiAIOnce(accessCode, apiEndpoint);
    } catch (error) {
      lastError = error;
      const retryable =
        error?.name === "AbortError" ||
        error instanceof TypeError ||
        error?.code === "temporary_error" ||
        error?.code === "rate_limited";

      if (!retryable || attempt === 1) throw error;

      // Autoscale の起動直後や一時的なゲートウェイエラーに備えて一度だけ再試行する。
      await warmBackend(apiEndpoint);
      await sleep(1800);
    }
  }

  throw lastError;
}

async function scheduleAIReply() {
  isReplying = true;
  autosizeInput();

  let apiEndpoint = getApiEndpoint();
  if (!apiEndpoint) {
    apiEndpoint = await askForBackendUrl();
    if (!apiEndpoint) {
      isReplying = false;
      autosizeInput();
      showToast("AIバックエンド設定をキャンセルしました");
      return;
    }
  }

  let accessCode = getAccessCode();
  if (!accessCode) {
    accessCode = await askForAccessCode();
    if (!accessCode) {
      isReplying = false;
      autosizeInput();
      showToast("AI接続をキャンセルしました");
      return;
    }
  }

  // Replit Autoscale が休止していた場合に備えて、先に軽い health check で起こす。
  await warmBackend(apiEndpoint);

  const readDelay = 450 + Math.random() * 450;
  await new Promise((resolve) => setTimeout(resolve, readDelay));
  markOutgoingAsRead();

  const typingDelay = 350 + Math.random() * 550;
  await new Promise((resolve) => setTimeout(resolve, typingDelay));
  setTyping(true);

  const minimumTypingMs = 900;
  const typingStart = Date.now();

  try {
    const result = await callNatsukiAI(accessCode, apiEndpoint);
    const remaining = Math.max(0, minimumTypingMs - (Date.now() - typingStart));
    if (remaining) await new Promise((resolve) => setTimeout(resolve, remaining));
    setTyping(false);
    addMessage("natsuki", result.reply, true);
    mergeMemoryCandidates(result.memoryCandidates);
  } catch (error) {
    setTyping(false);

    if (error?.code === "invalid_app_code") {
      showToast("接続コードが違います。もう一度入力してください", 4200);
      setTimeout(() => askForAccessCode(), 250);
    } else if (error?.name === "AbortError" || error?.code === "temporary_error") {
      showToast("一時的に接続が不安定でした。少し待ってもう一度試してください", 4200);
    } else if (error?.code === "server_not_configured") {
      showToast("AIバックエンドの設定がまだ完了していません", 4200);
    } else if (error?.code === "origin_not_allowed") {
      showToast("バックエンド側の接続元設定を確認してください", 4200);
    } else if (error?.code === "rate_limited") {
      showToast("少し送信が多いみたい。少し待ってもう一度試してください", 4200);
    } else {
      showToast("AIに接続できませんでした。少し待ってもう一度試してください", 4200);
    }
  } finally {
    isReplying = false;
    autosizeInput();
  }
}

composer.addEventListener("submit", (event) => {
  event.preventDefault();
  if (isReplying) return;

  const text = messageInput.value.trim();
  if (!text) return;

  addMessage("mashiro", text, false);
  noteUserActivityForProactive();
  messageInput.value = "";
  autosizeInput();
  scheduleAIReply();
});

messageInput.addEventListener("input", autosizeInput);
messageInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    composer.requestSubmit();
  }
});

resetButton.addEventListener("click", () => {
  if (typeof resetDialog.showModal === "function") {
    resetDialog.showModal();
  } else if (window.confirm("トーク履歴を初期化しますか？")) {
    resetConversation(false);
  }
});

confirmReset.addEventListener("click", () => {
  resetConversation(resetMemoryCheckbox.checked);
  resetMemoryCheckbox.checked = false;
});

function resetConversation(clearMemory = false) {
  currentRequestController?.abort();
  proactiveRequestController?.abort();
  currentRequestController = null;
  proactiveRequestController = null;
  isReplying = false;
  setTyping(false);
  messages = seedMessages();
  saveMessages();
  if (clearMemory) {
    longTermMemories = [];
    localStorage.removeItem(MEMORY_STORAGE_KEY);
  }
  proactiveState = {
    nextDueAt: Date.now() + randomBetween(PROACTIVE_FIRST_MIN_MS, PROACTIVE_FIRST_MAX_MS),
    lastSentAt: 0,
    dailyDate: proactiveDateKey(),
    dailyCount: 0,
    firstRunDone: false
  };
  saveProactiveState();

  renderMessages();
  autosizeInput();
  setTimeout(() => scrollToBottom("auto"), 0);
}

function registerServiceWorker() {
  if ("serviceWorker" in navigator) {
    let reloadingForUpdate = false;

    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloadingForUpdate) return;
      reloadingForUpdate = true;
      window.location.reload();
    });

    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js", { updateViaCache: "none" })
        .then((registration) => registration.update())
        .catch(() => {});
    });
  }
}

setTyping(false);
renderMessages();
autosizeInput();
setTimeout(() => scrollToBottom("auto"), 0);
registerServiceWorker();
startProactiveScheduler();

</script>
