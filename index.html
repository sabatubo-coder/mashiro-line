<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f7f7f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ましろLINE" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>ましろLINE（仮） Phase 3.2.6</title>
  <style>
:root {
  color-scheme: light;
  --bg: #eef1f5;
  --panel: #f8f8fa;
  --panel-strong: #ffffff;
  --text: #1c1c1e;
  --subtext: #74777d;
  --line: rgba(60, 60, 67, 0.15);
  --incoming: #ffffff;
  --outgoing: #d9f7be;
  --accent: #4d8f5b;
  --danger: #b84242;
  --shadow: 0 1px 3px rgba(0,0,0,.07);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

button, textarea, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app {
  position: fixed;
  left: 0;
  right: 0;
  top: var(--app-viewport-top, 0px);
  width: 100%;
  height: var(--app-viewport-height, 100dvh);
  overflow: hidden;
  background: var(--bg);
}

.screen {
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: hidden;
}

.screen[hidden] { display: none !important; }

.list-screen {
  display: grid;
  grid-template-rows: auto 1fr;
}

.list-header {
  padding: calc(12px + env(safe-area-inset-top)) 14px 13px 18px;
  background: rgba(248,248,250,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.list-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.list-header-copy { min-width: 0; }

.list-header h1 {
  margin: 0;
  font-size: 25px;
  line-height: 1.2;
  letter-spacing: -.02em;
}

.list-header p {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--subtext);
}

.settings-entry-button {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(116,119,125,.10);
  color: #5d6168;
  font-size: 21px;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.settings-entry-button:active { background: rgba(116,119,125,.18); }

.talk-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
}

.talk-item {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: #fff;
  display: grid;
  grid-template-columns: 54px 1fr auto;
  gap: 12px;
  align-items: center;
  text-align: left;
  padding: 12px 15px;
  cursor: pointer;
  touch-action: pan-y;
}

.talk-item:active { background: #f2f3f5; }

.talk-avatar,
.avatar {
  position: relative;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}

.talk-avatar {
  width: 54px;
  height: 54px;
  font-size: 17px;
}

.avatar {
  width: 38px;
  height: 38px;
  font-size: 14px;
}

.talk-avatar img,
.avatar img,
.settings-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.avatar-natsuki {
  background: #f3d99c;
  color: #6f5124;
}

.avatar-shiki {
  background: #d9d1ef;
  color: #51456d;
}

.avatar-ichi {
  background: #d9eef5;
  color: #315e6e;
}

.avatar-bunji {
  background: #efd8b7;
  color: #694b25;
}

.avatar-sosuke {
  background: #d7dde5;
  color: #3e4855;
}

.avatar-chiaki {
  background: #d9e8d2;
  color: #405a39;
}

.avatar-saku {
  background: #e3d8cf;
  color: #5c493d;
}

.avatar-yuna {
  background: #f0dfea;
  color: #704d63;
}

.avatar-mashiro {
  background: #d9e3ea;
  color: #475b68;
}

.talk-main { min-width: 0; }

.talk-topline {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.talk-name {
  font-size: 16px;
  font-weight: 700;
  min-width: 0;
}

.talk-preview {
  margin-top: 5px;
  color: #70747b;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.talk-side {
  min-width: 48px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
}

.talk-time {
  color: #8b8e94;
  font-size: 10px;
  white-space: nowrap;
}

.unread-badge {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: #e04b52;
  color: white;
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

.chat-screen {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  min-height: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

.topbar {
  min-height: 63px;
  padding: calc(7px + env(safe-area-inset-top)) 10px 7px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  background: rgba(248,248,250,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 5;
}

.icon-button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #62656b;
  font-size: 22px;
  cursor: pointer;
}

.icon-button:active { background: rgba(0,0,0,.06); }

.profile-heading {
  display: flex;
  gap: 9px;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.avatar-button {
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

.profile-text { min-width: 0; }

.profile-text h2 {
  margin: 0;
  font-size: 16px;
  line-height: 1.15;
}

.status-text {
  margin: 2px 0 0;
  font-size: 10px;
  color: var(--subtext);
}

.message-list {
  min-height: 0;
  max-height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  overflow-anchor: none;
  padding: 14px 12px 18px;
  scroll-behavior: auto;
  touch-action: pan-y;
}

/* Phase 3.2.12a: 初期位置合わせ中の先頭フラッシュを見せない。 */
.chat-screen.initializing .message-list {
  visibility: hidden;
}

.day-divider {
  display: flex;
  justify-content: center;
  margin: 8px 0 14px;
}

.day-divider span {
  font-size: 11px;
  color: #74777d;
  background: rgba(255,255,255,.66);
  border-radius: 999px;
  padding: 4px 9px;
}

.message-row {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  margin-bottom: 10px;
}

.message-row.outgoing { justify-content: flex-end; }

.mini-avatar {
  width: 29px;
  height: 29px;
  font-size: 11px;
}

.message-stack {
  display: flex;
  flex-direction: column;
  max-width: min(76%, 540px);
}

.outgoing .message-stack { align-items: flex-end; }
.incoming .message-stack { align-items: flex-start; }

.bubble {
  padding: 9px 12px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: var(--shadow);
}

.incoming .bubble {
  background: var(--incoming);
  border-bottom-left-radius: 5px;
}

.outgoing .bubble {
  background: var(--outgoing);
  border-bottom-right-radius: 5px;
}

.message-meta {
  min-height: 15px;
  margin-top: 3px;
  color: #777b82;
  font-size: 10px;
  display: flex;
  gap: 5px;
}

/* Phase 3.2.14: quoted replies and message reactions. */
.reply-quote {
  width: min(100%, 360px);
  margin-bottom: 5px;
  padding: 6px 9px 6px 10px;
  border-left: 3px solid rgba(67,126,84,.55);
  border-radius: 8px;
  background: rgba(255,255,255,.58);
  color: #62666d;
  font-size: 11px;
  line-height: 1.3;
  overflow: hidden;
}
.outgoing .reply-quote { background: rgba(255,255,255,.42); }
.reply-quote-sender {
  margin-bottom: 2px;
  color: #397049;
  font-weight: 700;
  white-space: nowrap;
}
.reply-quote-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.message-reactions {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: -1px;
  margin-bottom: 1px;
}
.outgoing .message-reactions { justify-content: flex-end; }
.incoming .message-reactions { justify-content: flex-start; }
.message-reaction-chip {
  min-width: 27px;
  height: 24px;
  padding: 1px 7px;
  border: 1px solid rgba(60,60,67,.13);
  border-radius: 999px;
  background: rgba(255,255,255,.94);
  box-shadow: 0 1px 2px rgba(0,0,0,.07);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 15px;
  line-height: 1;
}
.message-reaction-count { color: #6f747a; font-size: 9px; }
.message-reaction-chip.mine {
  border-color: rgba(57,112,73,.36);
  background: rgba(240,249,242,.97);
}
.message-row.incoming .bubble,
.message-row.incoming .media-message,
.message-row.incoming .sticker-message,
.message-row.incoming .sticker-message-mini {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* Phase 3.2.17: ましろ側リアクション・引用返信 */
.reply-composer-preview {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 7px 4px;
  padding: 7px 8px 7px 10px;
  max-width: min(420px, calc(100vw - 28px));
  border-left: 3px solid rgba(67,126,84,.62);
  border-radius: 10px;
  background: rgba(255,255,255,.94);
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
}
.reply-composer-preview[hidden] { display: none; }
.reply-composer-copy { flex: 1; min-width: 0; }
.reply-composer-sender { color: #397049; font-size: 11px; font-weight: 800; }
.reply-composer-text {
  margin-top: 2px;
  color: #666b72;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.reply-composer-remove {
  width: 27px;
  height: 27px;
  border: 0;
  border-radius: 50%;
  background: #eef0f2;
  color: #555b62;
  font-size: 16px;
}
.message-action-dialog {
  border: 0;
  padding: 0;
  width: min(92vw, 390px);
  margin: auto auto max(16px, env(safe-area-inset-bottom));
  background: transparent;
}
.message-action-dialog::backdrop {
  background: rgba(0,0,0,.28);
  backdrop-filter: blur(1px);
}
.message-action-card {
  overflow: hidden;
  border-radius: 20px;
  background: rgba(250,250,252,.98);
  box-shadow: 0 12px 34px rgba(0,0,0,.18);
}
.message-action-context {
  padding: 12px 14px 9px;
  border-bottom: 1px solid rgba(60,60,67,.10);
}
.message-action-sender { color: #397049; font-size: 11px; font-weight: 800; }
.message-action-text {
  margin-top: 3px;
  color: #555b62;
  font-size: 12px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.message-reaction-choices {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  padding: 11px 10px 9px;
}
.message-reaction-choice {
  height: 42px;
  border: 1px solid rgba(60,60,67,.10);
  border-radius: 14px;
  background: white;
  font-size: 22px;
}
.message-reaction-choice.selected {
  border-color: rgba(57,112,73,.55);
  background: rgba(77,143,91,.12);
  box-shadow: inset 0 0 0 1px rgba(57,112,73,.14);
}
.message-action-button {
  width: 100%;
  min-height: 46px;
  border: 0;
  border-top: 1px solid rgba(60,60,67,.10);
  background: white;
  color: #292b2f;
  font-size: 14px;
  font-weight: 700;
}
.message-action-button.cancel { color: #71767d; font-weight: 600; }

.typing-row {
  min-height: 46px;
  display: none;
  align-items: center;
  gap: 7px;
  padding: 4px 12px 8px;
}

.typing-row.visible { display: flex; }

.typing-bubble {
  min-width: 54px;
  height: 32px;
  padding: 0 11px;
  background: white;
  border-radius: 16px 16px 16px 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: var(--shadow);
}

.typing-bubble span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #9b9ea4;
  animation: typing 1.05s infinite ease-in-out;
}

.typing-bubble span:nth-child(2) { animation-delay: .12s; }
.typing-bubble span:nth-child(3) { animation-delay: .24s; }

.typing-label {
  color: var(--subtext);
  font-size: 11px;
}

@keyframes typing {
  0%, 55%, 100% { transform: translateY(0); opacity: .45; }
  25% { transform: translateY(-3px); opacity: 1; }
}

.composer {
  position: relative;
  z-index: 8;
  display: block;
  width: 100%;
  min-width: 0;
  padding: 7px 10px calc(8px + env(safe-area-inset-bottom));
  background: rgba(248,248,250,.97);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.composer-main {
  display: grid;
  grid-template-columns: 38px 38px 1fr 42px;
  gap: 6px;
  align-items: end;
}

.composer-tool-button {
  width: 38px;
  height: 42px;
  border: 0;
  border-radius: 18px;
  background: transparent;
  color: #687078;
  font-size: 25px;
  line-height: 1;
  display: grid;
  place-items: center;
}

.composer-tool-button:active { background: rgba(0,0,0,.055); }

.attachment-preview {
  display: flex;
  gap: 9px;
  align-items: center;
  margin: 0 0 7px 4px;
  padding: 7px;
  max-width: 250px;
  border-radius: 13px;
  background: white;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.attachment-preview[hidden] { display: none; }
.attachment-preview img {
  width: 62px;
  height: 62px;
  object-fit: cover;
  border-radius: 9px;
  background: #e8eaed;
}
.attachment-preview-copy { flex: 1; min-width: 0; }
.attachment-preview-title { font-size: 12px; font-weight: 700; }
.attachment-preview-sub { margin-top: 2px; color: #777b82; font-size: 10px; }
.attachment-remove {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: #eef0f2;
  color: #555b62;
  font-size: 16px;
}

.sticker-panel {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  max-height: 210px;
  overflow: auto;
  padding: 8px 2px 10px;
}
.sticker-panel[hidden] { display: none; }
.sticker-choice {
  border: 0;
  border-radius: 14px;
  padding: 8px 4px 6px;
  background: white;
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
  color: #292b2f;
}
.sticker-choice-image {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
}
.sticker-mini-preview {
  display: grid;
  place-items: center;
  align-content: center;
  gap: 2px;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  background: linear-gradient(180deg,#fffdf8,#f4f6f8);
  border: 1px solid rgba(38,43,47,.07);
}
.sticker-mini-preview-emoji { font-size: 28px; line-height: 1; }
.sticker-mini-preview-text {
  max-width: 100%;
  padding: 0 3px;
  font-size: 9px;
  line-height: 1.15;
  font-weight: 800;
  text-align: center;
  color: #25282c;
  overflow-wrap: anywhere;
}
.sticker-choice-label { display: block; margin-top: 2px; font-size: 9px; }
.sticker-message-mini {
  display: inline-grid;
  min-width: 112px;
  max-width: 170px;
  min-height: 88px;
  place-items: center;
  align-content: center;
  gap: 7px;
  padding: 13px 16px;
  border-radius: 22px;
  background: linear-gradient(180deg,#fffefb,#f4f6f8);
  border: 2px solid rgba(255,255,255,.95);
  box-shadow: var(--shadow);
}
.sticker-message-mini-emoji { font-size: 42px; line-height: 1; }
.sticker-message-mini-text {
  font-size: 17px;
  line-height: 1.15;
  font-weight: 900;
  letter-spacing: .01em;
  color: #26292d;
  text-align: center;
}

.media-message {
  overflow: hidden;
  border-radius: 16px;
  background: white;
  box-shadow: var(--shadow);
  max-width: 260px;
}
.media-image-holder {
  display: grid;
  place-items: center;
  width: 100%;
  min-height: 120px;
  color: #777b82;
  font-size: 12px;
  background: #e7e9ec;
  overflow: hidden;
}
.media-message img {
  display: block;
  width: 100%;
  max-height: 340px;
  object-fit: contain;
  background: #e7e9ec;
}
.media-caption {
  padding: 8px 10px 9px;
  font-size: 14px;
  line-height: 1.4;
  white-space: pre-wrap;
}
.outgoing .media-caption { background: var(--outgoing); }
.media-image-missing {
  min-width: 180px;
  min-height: 120px;
  display: grid;
  place-items: center;
  color: #777b82;
  font-size: 12px;
  background: #e7e9ec;
}

.sticker-message {
  width: min(220px, 54vw);
  min-height: 128px;
  padding: 0;
  background: transparent;
  box-shadow: none;
  text-align: center;
}
.sticker-message-image {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}
.sticker-message-label {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.message-input {
  width: 100%;
  min-height: 42px;
  max-height: 120px;
  resize: none;
  border: 1px solid rgba(60,60,67,.2);
  border-radius: 22px;
  padding: 10px 15px;
  background: white;
  outline: none;
  font-size: 15px;
}

.message-input:focus { border-color: rgba(77,143,91,.55); }

.send-button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 0;
  background: #b6d2be;
  color: white;
  font-weight: 800;
  font-size: 17px;
}

.send-button:not(:disabled) {
  background: var(--accent);
  cursor: pointer;
}

.send-button:disabled { opacity: .65; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(82px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  max-width: calc(100% - 48px);
  padding: 10px 15px;
  border-radius: 14px;
  background: rgba(28,28,30,.92);
  color: white;
  font-size: 12px;
  line-height: 1.45;
  opacity: 0;
  pointer-events: none;
  transition: .18s ease;
  z-index: 30;
}

.toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

.dialog {
  border: 0;
  border-radius: 18px;
  padding: 0;
  width: min(90vw, 420px);
  background: transparent;
}

.dialog::backdrop {
  background: rgba(0,0,0,.34);
  backdrop-filter: blur(1px);
}

.dialog-card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 16px 50px rgba(0,0,0,.18);
}

.dialog-card h3 {
  margin: 0 0 8px;
  font-size: 19px;
}

.dialog-card p {
  margin: 0 0 16px;
  color: #666a71;
  font-size: 13px;
  line-height: 1.5;
}

.dialog-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 16px;
}

.dialog-button {
  min-height: 44px;
  border: 0;

.notification-diagnostics-panel.good {

}

.notification-diagnostics-panel.warn {

  color: #795721;
}

.notification-diagnostics-panel.error {
  background: #fdecec;
  color: #8b3f3f;

.notification-setting-row {

  grid-template-columns: 1fr auto;

.notification-setting-row:last-child {

.notification-setting-label {

}

.notification-setting-sub {

}

.notification-toggle {
  width: 46px;
  height: 28px;
  border: 0;
  border-radius: 999px;
  position: relative;
  background: #d6d9dd;
  cursor: pointer;
  transition: background .15s ease;
}

.notification-toggle::after {
  content: "";
  position: absolute;
  width: 24px;
  height: 24px;
  left: 2px;
  top: 2px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.18);
  transition: transform .15s ease;
}

.notification-toggle.on {
  background: #55a66b;
}

.notification-toggle.on::after {
  transform: translateX(18px);
}

.notification-toggle:disabled {
  opacity: .45;
}

.notification-time-grid {

  gap: 8px;

}

.notification-time-input {

.notification-character-list {

@media (min-width: 780px) {
  .app {
    max-width: 620px;
    margin: 0 auto;

  }
}

<div class="app">
  <section id="listScreen" class="screen list-screen">
    <header class="list-header">
      <div class="list-header-row">
        <div class="list-header-copy">
          <h1>トーク</h1>
          <p>ましろLINE（仮）</p>
        </div>
        <button id="settingsButton" class="settings-entry-button" type="button" aria-label="設定">⚙︎</button>
      </div>
    </header>
    <main id="talkList" class="talk-list" aria-label="トーク一覧"></main>
  </section>

  <section id="chatScreen" class="screen chat-screen" hidden>
    <header class="topbar">
      <button id="backButton" class="icon-button" type="button" aria-label="トーク一覧へ戻る">‹</button>

      <div class="profile-heading">
        <button id="avatarButton" class="avatar-button" type="button" aria-label="アイコン設定">
          <div id="headerAvatar" class="avatar"></div>
        </button>
        <div class="profile-text">
          <h2 id="chatTitle">夏樹</h2>
          <p id="statusText" class="status-text">オンライン</p>
        </div>
      </div>

      <button id="resetButton" class="icon-button" type="button" aria-label="トーク初期化">↻</button>
    </header>

    <main id="messageList" class="message-list"></main>

    <div id="typingRow" class="typing-row" aria-hidden="true">
      <div id="typingAvatar" class="avatar mini-avatar"></div>
      <div class="typing-bubble"><span></span><span></span><span></span></div>
      <div id="typingLabel" class="typing-label">入力中…</div>
    </div>

    <form id="composer" class="composer">
      <div id="replyComposerPreview" class="reply-composer-preview" hidden>
        <div class="reply-composer-copy">
          <div id="replyComposerSender" class="reply-composer-sender"></div>
          <div id="replyComposerText" class="reply-composer-text"></div>

        <img id="attachmentPreviewImage" alt="送信する写真のプレビュー" />

          <div class="attachment-preview-title">写真を送信</div>
          <div class="attachment-preview-sub">メッセージ欄に添え文も追加できます</div>
        </div>
        <button id="attachmentRemoveButton" class="attachment-remove" type="button" aria-label="写真を取り消す">×</button>
      </div>
      <div id="stickerPanel" class="sticker-panel" hidden></div>
      <div class="composer-main">
        <button id="photoButton" class="composer-tool-button" type="button" aria-label="写真を送る">＋</button>
        <button id="stickerButton" class="composer-tool-button" type="button" aria-label="スタンプを送る">☺︎</button>
        <textarea id="messageInput" class="message-input" rows="1" maxlength="1200" placeholder="メッセージ"></textarea>
        <button id="sendButton" class="send-button" type="submit" disabled>➤</button>
      </div>
      <input id="chatImageInput" type="file" accept="image/*" hidden />
    </form>
  </section>

  <section id="settingsScreen" class="screen settings-screen" hidden>
    <header class="settings-topbar">
      <button id="settingsBackButton" class="icon-button" type="button" aria-label="戻る">‹</button>
      <h2>設定</h2>
      <span></span>
    </header>
    <main id="settingsContent" class="settings-scroll"></main>
  </section>

  <section id="profileScreen" class="screen profile-screen" hidden>
    <header class="settings-topbar">
      <button id="profileBackButton" class="icon-button" type="button" aria-label="戻る">‹</button>
      <h2 id="profileScreenTitle">プロフィール編集</h2>
      <span></span>
    </header>
    <main class="profile-editor-scroll">
      <div class="profile-editor-card">
        <div id="profileEditorAvatar" class="profile-editor-avatar"></div>
        <button id="profileChooseAvatarButton" class="profile-photo-button" type="button">写真を変更</button>
        <input id="profileAvatarFileInput" type="file" accept="image/*" hidden />

        <div class="profile-form-card">
          <div class="profile-field">
            <label id="profileNameLabel" for="profileNameInput">表示名</label>
            <input id="profileNameInput" type="text" maxlength="40" autocomplete="off" />
          </div>
          <div id="profileOfficialRow" class="profile-field">

            <div id="profileOfficialValue" class="profile-readonly-value"></div>

          <button id="profileResetAvatarButton" class="profile-action-button" type="button">標準アイコンに戻す</button>
          <button id="profileResetAllButton" class="profile-action-button danger" type="button">初期設定に戻す</button>
        </div>
      </div>
    </main>
  </section>
</div>

<div id="toast" class="toast"></div>

<dialog id="messageActionDialog" class="message-action-dialog">
  <div class="message-action-card">
    <div class="message-action-context">
      <div id="messageActionSender" class="message-action-sender"></div>
      <div id="messageActionText" class="message-action-text"></div>
    </div>
    <div id="messageReactionChoices" class="message-reaction-choices">
      <button class="message-reaction-choice" type="button" data-reaction="👍" aria-label="いいね">👍</button>
      <button class="message-reaction-choice" type="button" data-reaction="😂" aria-label="笑った">😂</button>
      <button class="message-reaction-choice" type="button" data-reaction="😊" aria-label="うれしい">😊</button>
      <button class="message-reaction-choice" type="button" data-reaction="😮" aria-label="びっくり">😮</button>
      <button class="message-reaction-choice" type="button" data-reaction="🙏" aria-label="ありがとう・お願い">🙏</button>

</dialog>

<dialog id="accessDialog" class="dialog">
  <form id="accessForm" class="dialog-card">
    <h3>AI接続コード</h3>

      <button id="accessCancel" class="dialog-button" type="button">キャンセル</button>
      <button class="dialog-button primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<dialog id="resetDialog" class="dialog">
  <form method="dialog" class="dialog-card">
    <h3 id="resetTitle">トークを初期化</h3>

      <button class="dialog-button" value="cancel">キャンセル</button>
      <button id="confirmReset" class="dialog-button danger" value="default">初期化</button>
    </div>
  </form>
</dialog>

function normalizeStickerId(value){const id=String(value||"").trim().toLowerCase();return STICKERS[id]?id:"";}
function stickerToken(id){const value=normalizeStickerId(id);return value?`[[STAMP:${value}]]`:"";}
function stickerIdFromText(value){const match=String(value||"").trim().match(/^\[\[STAMP:([a-z0-9_-]+)\]\]$/i);return normalizeStickerId(match?.[1]);}
function normalizeReactionEmoji(value){const emoji=String(value||"").trim();return MESSAGE_REACTION_EMOJIS.includes(emoji)?emoji:"";}
function normalizeMessageReactions(raw){
  if(!Array.isArray(raw))return[];
  const byReactor=new Map();
  for(const item of raw){
    const emoji=normalizeReactionEmoji(item?.emoji);
    const reactorId=String(item?.reactorId||"").trim();
    if(!emoji||!reactorId)continue;
    byReactor.set(reactorId,{reactorId,emoji,createdAt:String(item?.createdAt||"")});
  }
  return [...byReactor.values()].slice(-8);
}
function messagePreviewText(message){
  const type=messageTypeOf(message);
  if(type==="image")return String(message?.text||"").trim()||"写真";
  if(type==="sticker")return `スタンプ「${STICKERS[messageStickerId(message)]?.label||"スタンプ"}」`;
  return String(message?.text||"").replace(/\s+/g," ").trim().slice(0,80);
}
function addReactionToMessage(conversationId,targetMessageId,reactorId,emoji,createdAt=""){
  const normalizedEmoji=normalizeReactionEmoji(emoji);
  if(!conversationId||!targetMessageId||!reactorId||!normalizedEmoji)return false;
  const messages=loadConversationMessages(conversationId);
  const target=messages.find(message=>String(message?.id||"")===String(targetMessageId));
  if(!target)return false;
  const reactions=normalizeMessageReactions(target.reactions);
  const next=reactions.filter(item=>item.reactorId!==reactorId);
  next.push({reactorId,emoji:normalizedEmoji,createdAt:createdAt||new Date().toISOString()});
  target.reactions=next;
  saveConversationMessages(conversationId,messages);
  const visible=isConversationActuallyVisible(conversationId);
  if(visible)renderMessages({scrollMode:messageListNearBottom()?"bottom":"preserve"});
  renderTalkList();
  return true;
}
function removeReactionFromMessage(conversationId,targetMessageId,reactorId){
  if(!conversationId||!targetMessageId||!reactorId)return false;
  const messages=loadConversationMessages(conversationId);
  const target=messages.find(message=>String(message?.id||"")===String(targetMessageId));
  if(!target)return false;
  const reactions=normalizeMessageReactions(target.reactions);
  const next=reactions.filter(item=>item.reactorId!==reactorId);
  if(next.length===reactions.length)return false;
  target.reactions=next;
  saveConversationMessages(conversationId,messages);
  if(isConversationActuallyVisible(conversationId))renderMessages({scrollMode:messageListNearBottom()?"bottom":"preserve"});
  renderTalkList();
  return true;
}
function toggleMashiroReaction(conversationId,targetMessageId,emoji){
  const normalizedEmoji=normalizeReactionEmoji(emoji);
  if(!normalizedEmoji)return false;
  const target=loadConversationMessages(conversationId).find(message=>String(message?.id||"")===String(targetMessageId));

function openMediaDb(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(MEDIA_DB_NAME,1);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains(MEDIA_DB_STORE)){
        const store=db.createObjectStore(MEDIA_DB_STORE,{keyPath:"id"});
        store.createIndex("conversationId","conversationId",{unique:false});
      }
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error("media_db_open_failed"));
  });
}

async function putMediaRecord(record){
  const db=await openMediaDb();
  try{
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(MEDIA_DB_STORE,"readwrite");
      tx.objectStore(MEDIA_DB_STORE).put(record);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
    });
  }finally{db.close();}
}

async function getMediaRecord(id){
  if(!id)return null;
  const db=await openMediaDb();
  try{
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(MEDIA_DB_STORE,"readonly");
      const request=tx.objectStore(MEDIA_DB_STORE).get(id);
      request.onsuccess=()=>resolve(request.result||null);
      request.onerror=()=>reject(request.error);
    });
  }finally{db.close();}
}

async function deleteMediaForConversation(conversationId){
  const db=await openMediaDb();
  try{
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(MEDIA_DB_STORE,"readwrite");
      const store=tx.objectStore(MEDIA_DB_STORE);
      const index=store.index("conversationId");
      const request=index.openCursor(IDBKeyRange.only(conversationId));
      request.onsuccess=()=>{const cursor=request.result;if(cursor){cursor.delete();cursor.continue();}};
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
    });
  }catch{}finally{db.close();}
}

function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||""));reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});}

function loadImageElementFromFile(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("image_load_failed"));};
    img.src=url;
  });
}

function canvasToBlob(canvas,quality){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("image_encode_failed")),"image/jpeg",quality));}

async function prepareChatImage(file){
  if(!file||!String(file.type||"").startsWith("image/"))throw new Error("not_image");
  const img=await loadImageElementFromFile(file);
  let maxSide=1280;let quality=.8;let latest=null;
  for(let attempt=0;attempt<7;attempt+=1){
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    const width=Math.max(1,Math.round(img.naturalWidth*scale));
    const height=Math.max(1,Math.round(img.naturalHeight*scale));
    const canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,width,height);ctx.drawImage(img,0,0,width,height);
    const blob=await canvasToBlob(canvas,quality);latest={blob,width,height,mime:"image/jpeg"};
    if(blob.size<=CHAT_IMAGE_MAX_BYTES)return latest;
    maxSide=Math.max(720,Math.round(maxSide*.84));quality=Math.max(.52,quality-.06);
  }
  return latest;
}

async function fetchGeneratedImageBlob(id){

function pruneMemories(list) {
  const now = Date.now();
  const valid = (Array.isArray(list)?list:[]).filter(m => {
    if (!m || typeof m.text !== "string" || !m.text.trim()) return false;
    if (!m.expiresAt) return true;
    const t = Date.parse(m.expiresAt); return Number.isNaN(t) || t > now;
  });
  valid.sort((a,b) => Number(b.importance||1)-Number(a.importance||1) || Date.parse(b.updatedAt||b.createdAt||0)-Date.parse(a.updatedAt||a.createdAt||0));
  return valid.slice(0, MAX_LONG_TERM_MEMORIES);
}

function normalizeMemoryText(text) { return String(text||"").trim().replace(/\s+/g," ").replace(/[。．.]+$/g,"").toLowerCase(); }
function memoryExpiryFromTTL(ttlDays) { const d=Number(ttlDays); if(!Number.isFinite(d)||d>=3650)return null; const x=new Date();x.setDate(x.getDate()+Math.max(1,d));return x.toISOString(); }

function followUpUntilFromDays(days) {
  const d = Number(days);
  if (!Number.isFinite(d) || d <= 0) return "";
  return new Date(Date.now() + Math.min(14, Math.max(1, d)) * 24 * 60 * 60 * 1000).toISOString();
}

function mergeCandidatesIntoList(existingList, candidates, context = {}) {
  if (!Array.isArray(candidates) || !candidates.length) return pruneMemories(existingList);
  const memories = pruneMemories(existingList);
  const nowIso = new Date().toISOString();
  const sourceType = ["dm","group","legacy"].includes(context?.sourceType) ? context.sourceType : "legacy";
  const sourceConversationId = String(context?.sourceConversationId || "").slice(0,160);
  const knownBy = String(context?.knownBy || "").slice(0,80);

  for (const candidate of candidates.slice(0,3)) {
    const text=String(candidate?.text||"").trim().slice(0,240); if(!text)continue;
    const key=String(candidate?.key||"").trim().toLowerCase().replace(/[^a-z0-9_]+/g,"_").replace(/^_+|_+$/g,"").slice(0,80);
    const category=["event","preference","habit","promise","relationship","school","other"].includes(candidate?.category)?candidate.category:"other";
    const importance=[1,2,3].includes(Number(candidate?.importance))?Number(candidate.importance):1;
    const followUpStatus=["none","open","resolved"].includes(candidate?.followUpStatus)?candidate.followUpStatus:"none";
    const followUpUntil = followUpStatus === "open"
      ? followUpUntilFromDays(candidate?.followUpUntilDays || 3)
      : "";
    const normalized=normalizeMemoryText(text);
    let existing=key?memories.find(m=>m.key===key):null;
    if(!existing) existing=memories.find(m=>normalizeMemoryText(m.text)===normalized)||null;

    if(existing){
      existing.key=key||existing.key;
      existing.text=text;
      existing.category=category;
      existing.importance=Math.max(Number(existing.importance||1),importance);
      existing.updatedAt=nowIso;
      existing.expiresAt=memoryExpiryFromTTL(candidate?.ttlDays);
      existing.learnedAt=existing.learnedAt||nowIso;
      existing.sourceType=sourceType||existing.sourceType||"legacy";
      existing.sourceConversationId=sourceConversationId||existing.sourceConversationId||"";
      existing.knownBy=knownBy||existing.knownBy||"";
      existing.followUpStatus=followUpStatus;
      if(followUpStatus==="open") existing.followUpUntil=followUpUntil||existing.followUpUntil||"";
      if(followUpStatus==="resolved") {
        existing.followUpUntil="";
        existing.updatedAt=nowIso;
      }
      if(!Number.isFinite(Number(existing.recallCount))) existing.recallCount=0;
    } else {
      memories.push({
        id:makeId(),
        key:key||`memory_${Date.now()}`,
        text,
        category,
        importance,
        createdAt:nowIso,
        updatedAt:nowIso,
        learnedAt:nowIso,
        expiresAt:memoryExpiryFromTTL(candidate?.ttlDays),
        sourceType,
        sourceConversationId,
        knownBy,
        followUpStatus,
        followUpUntil,
        followUpRecoveredAt:"",
        lastRecalledAt:"",
        recallCount:0
      });
    }
  }
  return pruneMemories(memories);
}

function characterImageMemoryCandidate(conversation,message){

  const builtIn=proactiveImageAsset(message.imageAssetId);

  const caption=String(message.text||"").trim().replace(/\s+/g," ").slice(0,100);
  const createdAt=message.createdAt||new Date().toISOString();
  const minute=Math.floor((Date.parse(createdAt)||Date.now())/60000);

  const scopeLabel=conversation.type==="group"?`グループ「${getGroupName(conversation.groupId)}」`:`ましろとの個別LINE`;
  const text=`${imageMemoryDateLabel(createdAt)}ごろ、${sender.displayName}が${scopeLabel}に「${summary}」の写真を送った。ましろもその写真を見ている。${caption?`添え文は「${caption}」。`:""}`;
  return{
    key:`sent_image_${message.senderId}_${assetKey}_${minute}`,
    text,
    category:"event",
    importance:1,
    ttlDays:7,
    followUpStatus:"none",
    followUpUntilDays:0

}

function dayLabel(iso){const d=new Date(iso),t=new Date(),y=new Date(t);y.setDate(t.getDate()-1);const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();if(same(d,t))return"今日";if(same(d,y))return"昨日";return new Intl.DateTimeFormat("ja-JP",{month:"numeric",day:"numeric",weekday:"short"}).format(d);}

function messageCreatedAtMs(message){
  const ms=Date.parse(message?.createdAt||"");
  return Number.isFinite(ms)?ms:0;
}

function latestConversationMessage(messages){
  let latest=null;
  let latestAt=0;
  let latestIndex=-1;

  for(let index=0;index<messages.length;index+=1){
    const message=messages[index];
    const at=messageCreatedAtMs(message);

    // createdAtが同一の場合は、後から保存された方を最新として安定させる。
    if(!latest||at>latestAt||(at===latestAt&&index>latestIndex)){
      latest=message;
      latestAt=at;
      latestIndex=index;
    }
  }

  return {message:latest,createdAtMs:latestAt};
}

function sortedTalkListEntries(){
  return CONVERSATIONS.map((conversation,fixedIndex)=>{
    const messages=loadConversationMessages(conversation.id);
    const latest=latestConversationMessage(messages);
    return {
      conversation,
      messages,
      last:latest.message,
      lastCreatedAtMs:latest.createdAtMs,
      fixedIndex
    };
  }).sort((a,b)=>{
    // メッセージがあるトークを最新時刻の降順で表示。
    if(b.lastCreatedAtMs!==a.lastCreatedAtMs){
      return b.lastCreatedAtMs-a.lastCreatedAtMs;
    }

    // 同時刻・メッセージなしの場合は従来の固定順を使い、
    // 再描画のたびに順番が揺れないようにする。
    return a.fixedIndex-b.fixedIndex;
  });
}

function renderTalkList(){
  talkList.replaceChildren();

  for(const entry of sortedTalkListEntries()){
    const {conversation,messages,last}=entry;
    const unread=messages.filter(m=>m.senderId!=="mashiro"&&!m.seenByUser).length;
    const item=document.createElement("button");item.type="button";item.className="talk-item";item.dataset.conversationId=conversation.id;

const TALK_TAP_MOVE_THRESHOLD_PX=12;
let talkPointerState=null;
let lastTalkPointerActivationAt=0;

function talkItemFromEventTarget(target){
  if(!(target instanceof Element))return null;
  const item=target.closest('.talk-item[data-conversation-id]');
  return item&&talkList.contains(item)?item:null;
}
function activateTalkItem(item){
  const conversationId=String(item?.dataset?.conversationId||'');
  if(conversationId&&conversationById(conversationId))openConversation(conversationId);
}

talkList.addEventListener('pointerdown',event=>{
  const item=talkItemFromEventTarget(event.target);
  if(!item||event.pointerType==='mouse')return;
  talkPointerState={
    pointerId:event.pointerId,
    item,
    x:event.clientX,
    y:event.clientY
  };
},{passive:true});

talkList.addEventListener('pointercancel',()=>{talkPointerState=null;},{passive:true});
talkList.addEventListener('pointerup',event=>{
  const state=talkPointerState;talkPointerState=null;
  if(!state||state.pointerId!==event.pointerId)return;
  const dx=event.clientX-state.x,dy=event.clientY-state.y;
  if(Math.hypot(dx,dy)>TALK_TAP_MOVE_THRESHOLD_PX)return;
  const item=talkItemFromEventTarget(event.target);
  if(!item||item!==state.item)return;
  event.preventDefault();
  lastTalkPointerActivationAt=Date.now();
  activateTalkItem(item);
},{passive:false});

talkList.addEventListener('click',event=>{
  const item=talkItemFromEventTarget(event.target);
  if(!item)return;
  // pointerupで処理済みの合成clickは二重遷移させない。
  if(Date.now()-lastTalkPointerActivationAt<700){event.preventDefault();return;}
  activateTalkItem(item);
});

function latestCharacterLineActivityAt(characterId){
  let latestMs=0;

  for(const conversation of CONVERSATIONS){
    if(
      conversation.type==="dm" &&
      conversation.characterId!==characterId
    ){
      continue;
    }

    if(conversation.type==="group"){
      const group=groupById(conversation.groupId);
      if(!groupAiParticipantIds(group).includes(characterId)){
        continue;
      }
    }

    const messages=loadConversationMessages(conversation.id);

    for(const message of messages){
      let candidate="";

      if(message.senderId===characterId){
        candidate=message.createdAt||"";
      }else if(message.senderId==="mashiro"){
        if(conversation.type==="dm"){
          if(message.readByCharacter&&message.readAt){
            candidate=message.readAt;
          }
        }else{
          const perCharacter=
            message.readAtByCharacter &&
            typeof message.readAtByCharacter==="object"
              ?message.readAtByCharacter[characterId]
              :"";

          if(perCharacter){
            candidate=perCharacter;
          }else if(message.readByCharacter&&message.readAt){
            candidate=message.readAt;
          }
        }
      }

      const ms=Date.parse(candidate||"");
      if(Number.isFinite(ms)&&ms>latestMs){
        latestMs=ms;
      }
    }
  }

  return latestMs
    ?new Date(latestMs).toISOString()
    :"";
}

function characterActivityAtForAPI(){
  const result={};

  for(const characterId of PRESENCE_SUPPORTED_CHARACTERS){
    const at=latestCharacterLineActivityAt(characterId);
    if(at)result[characterId]=at;
  }

  return result;
}

function latestDmCharacterActivityAt(conversationId,characterId){
  const messages=loadConversationMessages(conversationId);
  let latestMs=0;

  for(const message of messages){
    let candidate="";

    if(message.senderId===characterId){
      candidate=message.createdAt||"";
    }else if(
      message.senderId==="mashiro" &&
      message.readByCharacter &&
      message.readAt
    ){
      candidate=message.readAt;
    }

    const ms=Date.parse(candidate||"");
    if(Number.isFinite(ms)&&ms>latestMs)latestMs=ms;
  }

  return latestMs?new Date(latestMs).toISOString():"";
}

function setPresenceStatusText(value){

async function refreshPresenceStatus({force=false}={}){
  const conversation=activeConversation();

  if(
    !conversation ||
    conversation.type!=="dm" ||
    chatScreen.hidden ||
    document.visibilityState!=="visible"
  ){
    return;
  }

  if(typingRow.classList.contains("visible"))return;

  const explicitAway=activeCharacterAway(conversation.characterId);
  if(explicitAway){setPresenceStatusText(explicitAway.label);return;}

  if(!presenceSupportedConversation(conversation)){
    setPresenceStatusText("オンライン");
    return;
  }

  if(appState.presenceBusy&&!force)return;

  const apiEndpoint=getApiEndpoint();
  const accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode){
    setPresenceStatusText("");
    return;
  }

  const requestSeq=++appState.presenceRequestSeq;
  appState.presenceBusy=true;

  try{
    const data=await fetchJsonWithRetry(
      endpointFor(apiEndpoint,"presenceStatus"),
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "X-App-Code":accessCode
        },
        body:JSON.stringify({
          characterId:conversation.characterId,
          timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
          characterAway:characterAwayForAPI(),
          latestActivityAt:
            latestCharacterLineActivityAt(
              conversation.characterId
            ) ||
            latestDmCharacterActivityAt(
              conversation.id,
              conversation.characterId
            )
        })
      },
      0
    );

    if(requestSeq!==appState.presenceRequestSeq)return;

    const current=activeConversation();
    if(
      !current ||
      current.id!==conversation.id ||
      chatScreen.hidden ||
      document.visibilityState!=="visible" ||
      typingRow.classList.contains("visible")
    ){
      return;
    }

    setPresenceStatusText(data?.supported&&data?.online?"オンライン":"");
  }catch{
    if(requestSeq===appState.presenceRequestSeq)setPresenceStatusText("");
  }finally{
    if(requestSeq===appState.presenceRequestSeq)appState.presenceBusy=false;
  }
}

function schedulePresenceRefresh(delay=100){
  setTimeout(()=>refreshPresenceStatus({force:true}),delay);
}

function groupAiParticipantIds(group){
  return (Array.isArray(group?.participants)?group.participants:[])
    .filter(id=>id!=="mashiro"&&characterById(id));
}

function groupReadCount(message,group){
  const valid=new Set(groupAiParticipantIds(group));
  if(Array.isArray(message?.readByCharacters)){
    return new Set(
      message.readByCharacters.filter(id=>valid.has(id))
    ).size;
  }

  // Phase 3.2以前の既存グループ送信メッセージとの互換。
  if(message?.readByCharacter)return valid.size;
  return 0;
}

function markGroupOutgoingReadThrough(
  conversationId,
  characterId,
  throughCreatedAt,
  readAtOverride=""
){
  const conversation=conversationById(conversationId);
  if(!conversation||conversation.type!=="group"||!characterById(characterId))return false;

  const group=groupById(conversation.groupId);
  if(!groupAiParticipantIds(group).includes(characterId))return false;

  const throughMs=Date.parse(throughCreatedAt||"");
  const messages=loadConversationMessages(conversationId);
  const readAt=
    Number.isFinite(Date.parse(readAtOverride||""))
      ?new Date(Date.parse(readAtOverride)).toISOString()
      :new Date().toISOString();

  let changed=false;

  for(const message of messages){
    if(message.senderId!=="mashiro")continue;

    // Phase 3.2: 旧方式で既に全員既読なら、その状態を維持する。
    if(message.readByCharacter===true){
      const allReaders=groupAiParticipantIds(group);
      const current=Array.isArray(message.readByCharacters)
        ?message.readByCharacters
        :[];
      const merged=[...new Set([...allReaders,...current])];

      if(
        !Array.isArray(message.readByCharacters) ||
        merged.length!==current.length
      ){
        message.readByCharacters=merged;
        message.readAtByCharacter={
          ...(message.readAtByCharacter&&typeof message.readAtByCharacter==="object"
            ?message.readAtByCharacter
            :{})
        };
        for(const readerId of allReaders){
          if(!message.readAtByCharacter[readerId]){
            message.readAtByCharacter[readerId]=message.readAt||readAt;
          }
        }
        changed=true;
      }
      continue;
    }

    const createdMs=Date.parse(message.createdAt||"");
    if(
      Number.isFinite(throughMs)&&
      Number.isFinite(createdMs)&&
      createdMs>throughMs
    ){
      continue;
    }

    const readers=Array.isArray(message.readByCharacters)
      ?[...message.readByCharacters]
      :[];

    if(!readers.includes(characterId)){
      readers.push(characterId);
      message.readByCharacters=readers;
      message.readAtByCharacter={
        ...(message.readAtByCharacter&&typeof message.readAtByCharacter==="object"
          ?message.readAtByCharacter
          :{}),
        [characterId]:readAt
      };

      if(readers.length>=groupAiParticipantIds(group).length){
        message.readByCharacter=true;
        message.readAt=message.readAt||readAt;
      }

      changed=true;
    }
  }

  if(changed){
    saveConversationMessages(conversationId,messages);
    if(appState.activeConversationId===conversationId)renderMessages();
    renderTalkList();
  }

  return changed;
}


function migrateLegacyGroupReadState(conversationId){
  const conversation=conversationById(conversationId);
  if(!conversation||conversation.type!=="group")return false;

  const group=groupById(conversation.groupId);
  const allReaders=groupAiParticipantIds(group);
  const messages=loadConversationMessages(conversationId);
  let changed=false;

  for(const message of messages){
    if(message.senderId!=="mashiro"||message.readByCharacter!==true)continue;

    const current=Array.isArray(message.readByCharacters)
      ?message.readByCharacters
      :[];
    const merged=[...new Set([...allReaders,...current])];

    if(
      !Array.isArray(message.readByCharacters) ||
      merged.length!==current.length
    ){
      message.readByCharacters=merged;
      message.readAtByCharacter={
        ...(message.readAtByCharacter&&typeof message.readAtByCharacter==="object"
          ?message.readAtByCharacter
          :{})
      };
      for(const readerId of allReaders){
        if(!message.readAtByCharacter[readerId]){
          message.readAtByCharacter[readerId]=
            message.readAt||
            message.createdAt||
            new Date().toISOString();
        }
      }
      changed=true;
    }
  }

  if(changed)saveConversationMessages(conversationId,messages);
  return changed;
}


const MESSAGE_BOTTOM_THRESHOLD_PX=56;

function captureMessageScrollState(){

function restoreMessageScrollState(state,{forceBottom=false,settle=true}={}){
  if(!state)return;
  const token=++appState.messageScrollRestoreToken;
  const generation=state.userGeneration;
  const apply=()=>{
    if(token!==appState.messageScrollRestoreToken)return;
    if(generation!==appState.messageScrollUserGeneration)return;
    if(state.conversationId&&state.conversationId!==appState.activeConversationId)return;
    if(forceBottom||state.pinned){
      setMessageScrollTop(messageList.scrollHeight);
      return;
    }
    if(state.anchorId){
      const safeId=(window.CSS&&CSS.escape)?CSS.escape(state.anchorId):state.anchorId.replace(/["\\]/g,'\\$&');
      const anchor=messageList.querySelector(`.message-row[data-message-id="${safeId}"]`);
      if(anchor){
        const listRect=messageList.getBoundingClientRect();
        const currentOffset=anchor.getBoundingClientRect().top-listRect.top;
        setMessageScrollTop(messageList.scrollTop+(currentOffset-state.anchorOffset));
        return;
      }
    }
    setMessageScrollTop(state.scrollTop);
  };
  apply();
  requestAnimationFrame(()=>requestAnimationFrame(apply));
  if(settle&&(forceBottom||state.pinned)){
    [80,260,900].forEach(delay=>setTimeout(apply,delay));
  }
}

  const shouldKeepBottom=activeVisible?messageListNearBottom():false;

    stickerId:normalizeStickerId(options.stickerId)||stickerIdFromText(text)||"",
    mediaId:String(options.mediaId||""),
    imageAssetId:String(options.imageAssetId||""),
    generatedImageId:String(options.generatedImageId||""),
    mediaMime:String(options.mediaMime||""),

    mediaSummary:String(options.mediaSummary||"").slice(0,300),
    replyToId:String(options.replyToId||"").trim(),
    replyToSenderId:String(options.replyToSenderId||"").trim(),
    replyToText:String(options.replyToText||"").slice(0,120),
    reactions:normalizeMessageReactions(options.reactions),
    createdAt:options.createdAt||new Date().toISOString(),
    readByCharacter:senderId==="mashiro"?Boolean(options.readByCharacter):true,
    readByCharacters:
      senderId==="mashiro"&&conversation?.type==="group"
        ?(
            Array.isArray(options.readByCharacters)
              ?[...new Set(options.readByCharacters.filter(id=>characterById(id)))]
              :[]
          )
        :undefined,
    readAtByCharacter:
      senderId==="mashiro"&&conversation?.type==="group"
        ?(
            options.readAtByCharacter&&typeof options.readAtByCharacter==="object"
              ?{...options.readAtByCharacter}
              :{}
          )
        :undefined,
    seenByUser:senderId!=="mashiro"?(options.seenByUser??activeVisible):true,
    source:options.source||"ai"
  };

  messages.push(message);
  saveConversationMessages(conversationId,messages);
  if(senderId!=="mashiro"&&options?.awayUpdate)applyCharacterAwayUpdate(options.awayUpdate);

    conversation.type==="dm" &&

function markOutgoingRead(conversationId){
  const messages=loadConversationMessages(conversationId);
  let changed=false;
  const readAt=new Date().toISOString();
  for(const m of messages){
    if(m.senderId==="mashiro"&&!m.readByCharacter){
      m.readByCharacter=true;
      m.readAt=m.readAt||readAt;
      changed=true;
    }
  }
  if(changed){
    saveConversationMessages(conversationId,messages);
    if(appState.activeConversationId===conversationId)renderMessages();
    renderTalkList();
    schedulePresenceRefresh(50);
  }
}


function markOutgoingReadThrough(conversationId,throughCreatedAt,readAtOverride=""){
  const throughMs=Date.parse(throughCreatedAt||"");
  const messages=loadConversationMessages(conversationId);
  let changed=false;
  const readAt=
    Number.isFinite(Date.parse(readAtOverride||""))
      ?new Date(Date.parse(readAtOverride)).toISOString()
      :new Date().toISOString();

  for(const message of messages){
    if(message.senderId!=="mashiro"||message.readByCharacter)continue;
    const createdMs=Date.parse(message.createdAt||"");
    if(!Number.isFinite(throughMs)||!Number.isFinite(createdMs)||createdMs<=throughMs){
      message.readByCharacter=true;
      message.readAt=message.readAt||readAt;
      changed=true;
    }
  }

  if(changed){
    saveConversationMessages(conversationId,messages);
    if(appState.activeConversationId===conversationId)renderMessages();
    renderTalkList();
    schedulePresenceRefresh(50);
  }
}

const LOCAL_ACTIVE_SESSION_WINDOWS_MS={
  natsuki:6*60*1000,
  shiki:5*60*1000,
  ichi:5*60*1000,
  bunji:5*60*1000,
  sosuke:4*60*1000
};
const LOCAL_ACTIVE_READ_RANGES_SECONDS={
  natsuki:[1,4],
  shiki:[1,6],
  ichi:[1,5],
  bunji:[2,7],
  sosuke:[2,9]
};

function localDmActiveSessionPreview(conversation,userMessage){
  if(
    !conversation ||
    conversation.type!=="dm" ||
    !userMessage ||
    statusText.textContent.trim()!=="オンライン"
  )return null;

  const activityAt=latestCharacterLineActivityAt(
    conversation.characterId
  );
  const activityMs=Date.parse(activityAt||"");
  const userAt=Date.parse(userMessage.createdAt||"");
  const windowMs=
    LOCAL_ACTIVE_SESSION_WINDOWS_MS[
      conversation.characterId
    ]||0;

  if(
    !Number.isFinite(activityMs) ||
    !Number.isFinite(userAt) ||
    windowMs<=0 ||
    Math.max(0,userAt-activityMs)>windowMs
  )return null;

  return {
    active:true,
    characterId:conversation.characterId,
    latestCharacterLineActivityAt:activityAt,
    userAt,
    windowMs,
    crossChannel:true
  };
}

function scheduleOptimisticDmRead(conversation,userMessage){
  if(activeCharacterAway(conversation?.characterId))return null;
  const session=localDmActiveSessionPreview(conversation,userMessage);
  if(!session)return null;

  const range=
    LOCAL_ACTIVE_READ_RANGES_SECONDS[conversation.characterId]||
    [1,8];
  const delayMs=Math.round(
    (range[0]+Math.random()*(range[1]-range[0]))*1000
  );

  setTimeout(()=>{
    const current=loadConversationMessages(conversation.id)
      .find(message=>message.id===userMessage.id);
    if(!current||current.readByCharacter)return;

    markOutgoingReadThrough(
      conversation.id,
      userMessage.createdAt,
      new Date().toISOString()
    );
  },delayMs);

  return {
    ...session,
    optimisticReadDelayMs:delayMs
  };
}

// Phase 3.2.15b: 入力中表示を返信予定時刻の直前へ連携する。
// API生成時間そのものではなく、「実際に文字を打っている」ように見える短い時間だけ表示する。
function replyTypingDurationMs(text,{group=false}={}){
  const length=Array.from(String(text||"").trim()).length;
  if(!length)return 0;
  const minimum=group?850:950;
  const maximum=group?3000:3400;
  const base=group?700:800;
  const perCharacter=group?31:35;
  const jitter=Math.round(120+Math.random()*300);
  return Math.round(Math.max(minimum,Math.min(maximum,base+length*perCharacter+jitter)));
}

function typingStartIso(replyAt,durationMs,notBeforeAt=""){
  const due=Date.parse(replyAt||"");
  if(!Number.isFinite(due)||!Number.isFinite(Number(durationMs))||Number(durationMs)<=0)return"";
  const floor=Date.parse(notBeforeAt||"");
  if(Number.isFinite(floor)&&floor>=due)return"";
  const start=Number.isFinite(floor)?Math.max(due-Number(durationMs),floor):due-Number(durationMs);
  return new Date(start).toISOString();
}

function delayedReplyHasTypedText(item){
  return item?.reactionOnly!==true&&Boolean(String(item?.reply||"").trim());
}

function delayedReplyTypingStartMs(item){
  if(!delayedReplyHasTypedText(item))return NaN;
  const explicit=Date.parse(item?.typingStartAt||"");
  if(Number.isFinite(explicit))return explicit;
  const due=Date.parse(item?.replyAt||"");
  let duration=Number(item?.typingDurationMs||0);
  if(!Number.isFinite(due))return NaN;
  // 3.2.15a以前に予約済みだった返信にも、更新後は入力中表示を復元する。
  if(!Number.isFinite(duration)||duration<=0){
    const length=Array.from(String(item?.reply||"").trim()).length;
    if(!length)return NaN;
    duration=Math.max(950,Math.min(3400,980+length*35));
  }
  return due-duration;
}

function delayedReplyNextTriggerMs(item,now=Date.now()){
  const due=Date.parse(item?.replyAt||"");
  if(!Number.isFinite(due))return NaN;
  const start=delayedReplyTypingStartMs(item);
  if(Number.isFinite(start)&&start>now)return start;
  return due;
}

function scheduledTypingToken(kind,item){
  return `${kind}:${String(item?.token||item?.localMessageId||item?.eventId||"")}`;
}

function showScheduledTyping(kind,item){
  if(!item||!isConversationActuallyVisible(item.conversationId))return false;
  const token=scheduledTypingToken(kind,item);
  if(appState.delayedTypingToken===token)return true;
  appState.delayedTypingToken=token;
  setTyping(true,kind==="group"?item.characterId:null);
  return true;
}

function clearScheduledTyping(token=null){
  if(!appState.delayedTypingToken)return;
  if(token&&appState.delayedTypingToken!==token)return;
  appState.delayedTypingToken=null;
  setTyping(false);
}

function activeScheduledTypingCandidate(now=Date.now()){
  const conversationId=appState.activeConversationId;
  if(!conversationId||!isConversationActuallyVisible(conversationId))return null;
  const candidates=[];
  for(const item of loadDelayedDmState().replies){
    const due=Date.parse(item?.replyAt||"");
    const start=delayedReplyTypingStartMs(item);
    if(item?.conversationId===conversationId&&Number.isFinite(due)&&Number.isFinite(start)&&start<=now&&now<due){
      candidates.push({kind:"dm",item,due});
    }
  }
  for(const item of loadDelayedGroupState().replies){
    const due=Date.parse(item?.replyAt||"");
    const start=delayedReplyTypingStartMs(item);
    if(item?.conversationId===conversationId&&Number.isFinite(due)&&Number.isFinite(start)&&start<=now&&now<due){
      candidates.push({kind:"group",item,due});
    }
  }
  candidates.sort((a,b)=>a.due-b.due);
  return candidates[0]||null;
}

function refreshScheduledTypingForActiveConversation(){
  const candidate=activeScheduledTypingCandidate();
  if(candidate){
    showScheduledTyping(candidate.kind,candidate.item);
    return;
  }
  if(appState.delayedTypingToken)clearScheduledTyping();
}

function loadDelayedDmState(){
  try{
    const raw=localStorage.getItem(DELAYED_DM_STATE_KEY);
    const parsed=raw?JSON.parse(raw):{};
    return {
      reads:Array.isArray(parsed.reads)?parsed.reads:[],
      replies:Array.isArray(parsed.replies)?parsed.replies:[]
    };
  }catch{
    return {reads:[],replies:[]};
  }
}

function saveDelayedDmState(state){
  localStorage.setItem(DELAYED_DM_STATE_KEY,JSON.stringify({
    reads:Array.isArray(state?.reads)?state.reads.slice(-100):[],
    replies:Array.isArray(state?.replies)?state.replies.slice(-100):[]
  }));
}

async function ackDelayedReplyEvent(eventId){
  if(!eventId||!pushNotificationsEnabled())return;
  const apiEndpoint=getApiEndpoint(),accessCode=getAccessCode();
  if(!apiEndpoint||!accessCode)return;
  try{
    await fetchJsonWithRetry(endpointFor(apiEndpoint,"pushAck"),{
      method:"POST",
      headers:pushAuthHeaders(accessCode),
      body:JSON.stringify({
        deviceId:getPushDeviceId(),
        eventIds:[eventId]
      })
    },0);
  }catch{}
}

function clearDelayedReplyByEventId(eventId){
  if(!eventId)return;
  const state=loadDelayedDmState();
  const before=state.replies.length;
  state.replies=state.replies.filter(item=>item?.eventId!==eventId);
  if(state.replies.length!==before)saveDelayedDmState(state);
}

function scheduleDelayedDmTimer(){
  clearTimeout(appState.delayedDmTimer);
  const state=loadDelayedDmState();
  const now=Date.now();
  const times=[
    ...state.reads.map(item=>Date.parse(item?.readAt||"")),
    ...state.replies.map(item=>delayedReplyNextTriggerMs(item,now))
  ].filter(Number.isFinite);

  if(!times.length)return;
  const next=Math.min(...times);
  const delay=Math.max(250,Math.min(60*1000,next-Date.now()));
  appState.delayedDmTimer=setTimeout(processDelayedDmState,delay);
}

async function processDelayedDmState(){
  const state=loadDelayedDmState();
  const now=Date.now();
  let changed=false;

  const remainingReads=[];
  for(const item of state.reads){
    const due=Date.parse(item?.readAt||"");
    if(Number.isFinite(due)&&due<=now){
      markOutgoingReadThrough(
        item.conversationId,
        item.throughCreatedAt,
        item.readAt
      );
      if(item.conversationRestUpdate)applyConversationRestUpdate(item.conversationRestUpdate);
      changed=true;
    }else remainingReads.push(item);
  }
  state.reads=remainingReads;

  // 返信予定の直前にだけ「入力中…」を表示する。
  const dmTypingCandidate=state.replies
    .filter(item=>{
      const due=Date.parse(item?.replyAt||"");
      const start=delayedReplyTypingStartMs(item);
      return item?.conversationId===appState.activeConversationId&&Number.isFinite(due)&&Number.isFinite(start)&&start<=now&&now<due;
    })
    .sort((a,b)=>Date.parse(a.replyAt)-Date.parse(b.replyAt))[0];
  if(dmTypingCandidate)showScheduledTyping("dm",dmTypingCandidate);

  const remainingReplies=[];
  for(const item of state.replies){
    const due=Date.parse(item?.replyAt||"");
    if(!Number.isFinite(due)||due>now){
      remainingReplies.push(item);
      continue;
    }

    const conversation=conversationById(item.conversationId);
    if(!conversation){
      changed=true;
      continue;
    }

    const existing=loadConversationMessages(item.conversationId)
      .some(message=>
        (item.eventId&&message.pushEventId===item.eventId)||
        message.id===item.localMessageId
      );

    clearScheduledTyping(scheduledTypingToken("dm",item));

    if(item.reaction?.emoji){
      addReactionToMessage(item.conversationId,item.reaction.targetMessageId,item.characterId,item.reaction.emoji,item.replyAt);
    }
    if(!existing&&!item.reactionOnly&&String(item.reply||"").trim()){
      addMessage(
        item.conversationId,
        item.characterId,
        String(item.reply).trim(),
        {
          id:item.localMessageId,
          pushEventId:item.eventId||null,
          createdAt:item.replyAt,
          source:item.eventId?"scheduled-reply-local":"delayed-reply-local",
          seenByUser:
            appState.activeConversationId===item.conversationId&&
            !chatScreen.hidden&&
            document.visibilityState==="visible",
          awayUpdate:item.awayUpdate||null,
          ...replyQuoteOptions(item.conversationId,item.replyTo)
        }
      );
    }

    if(item.conversationRestUpdate)applyConversationRestUpdate(item.conversationRestUpdate);
    if(item.eventId)ackDelayedReplyEvent(item.eventId);
    changed=true;
  }
  state.replies=remainingReplies;

  if(changed)saveDelayedDmState(state);
  scheduleDelayedDmTimer();
  refreshScheduledTypingForActiveConversation();
}

function enqueueDelayedDmResult(conversation,userMessage,result){
  const timing=result?.replyTiming;
  const hasReaction=Boolean(normalizeReactionEmoji(result?.reaction?.emoji));
  const sequence=(Array.isArray(result?.replySequence)?result.replySequence:[]).map(v=>String(v||"").trim()).filter(Boolean).slice(0,3);
  if(!sequence.length&&String(result?.reply||"").trim()&&result?.reactionOnly!==true)sequence.push(String(result.reply).trim());
  const readOnly=result?.readOnly===true;
  if(!timing?.readAt||!timing?.replyAt||(!sequence.length&&!hasReaction&&!readOnly))return false;

  const state=loadDelayedDmState();
  const tokenBase=`${conversation.id}-${userMessage.id}`;
  if(String(timing?.reason||"").startsWith("explicit_away_")){
    state.reads=state.reads.filter(item=>item?.conversationId!==conversation.id);
    state.replies=state.replies.filter(item=>item?.conversationId!==conversation.id);
  }
  state.reads=state.reads.filter(item=>item?.token!==tokenBase);
  state.reads.push({token:tokenBase,conversationId:conversation.id,throughCreatedAt:userMessage.createdAt,readAt:timing.readAt,conversationRestUpdate:readOnly?(result?.conversationRestUpdate||null):null});
  state.replies=state.replies.filter(item=>!String(item?.token||"").startsWith(`${tokenBase}-reply-`)&&item?.token!==tokenBase);

  const sequenceTimings=Array.isArray(result?.replySequenceTimings)?result.replySequenceTimings:[];
  const scheduledSequence=Array.isArray(result?.scheduledReply?.sequence)?result.scheduledReply.sequence:[];
  if(result?.reactionOnly===true){
    const eventId=result?.scheduledReply?.eventId||null;
    state.replies.push({
      token:tokenBase,conversationId:conversation.id,characterId:conversation.characterId,reply:"",typingDurationMs:0,typingStartAt:"",
      reaction:hasReaction?{emoji:normalizeReactionEmoji(result.reaction.emoji),targetMessageId:String(result.reaction.targetMessageId||userMessage.id)}:null,
      reactionOnly:true,replyTo:null,readAt:timing.readAt,replyAt:timing.replyAt,eventId,conversationRestUpdate:result?.conversationRestUpdate||null,localMessageId:eventId?`push-${eventId}`:`delayed-${tokenBase}`
    });
  }else{
    for(let index=0;index<sequence.length;index+=1){
      const part=sequence[index];
      const seqTiming=sequenceTimings[index]||{};
      const scheduled=scheduledSequence[index]||{};
      const replyAt=seqTiming.replyAt||scheduled.replyAt||timing.replyAt;
      const sequenceGapMs=Number(seqTiming.gapMs||scheduled.gapMs||0);
      const typingDurationMs=index===0?replyTypingDurationMs(part):(sequenceGapMs>=1000?Math.max(0,Math.min(replyTypingDurationMs(part),sequenceGapMs-180)):0);
      const typingStartAt=index===0
        ? String(seqTiming.typingStartAt||scheduled.typingStartAt||typingStartIso(replyAt,typingDurationMs,timing.readAt))
        : (sequenceGapMs>=1000?String(seqTiming.typingStartAt||scheduled.typingStartAt||typingStartIso(replyAt,typingDurationMs,timing.readAt)):"");
      const eventId=scheduled.eventId||(index===0?result?.scheduledReply?.eventId:null)||null;
      state.replies.push({
        token:`${tokenBase}-reply-${index}`,conversationId:conversation.id,characterId:conversation.characterId,reply:part,
        typingDurationMs,typingStartAt,
        reaction:index===0&&hasReaction?{emoji:normalizeReactionEmoji(result.reaction.emoji),targetMessageId:String(result.reaction.targetMessageId||userMessage.id)}:null,
        reactionOnly:false,replyTo:index===0?(result?.replyTo||null):null,readAt:timing.readAt,replyAt,eventId,
        awayUpdate:(scheduled?.awayUpdate||(Number(result?.awayUpdateSequenceIndex)===index?result?.awayUpdate:null)||null),
        conversationRestUpdate:index===sequence.length-1?(result?.conversationRestUpdate||null):null,
        localMessageId:eventId?`push-${eventId}`:`delayed-${tokenBase}-${index}`
      });
    }
  }
  saveDelayedDmState(state);processDelayedDmState();return true;
}

function removeDelayedDmForConversation(conversationId){
  const state=loadDelayedDmState();
  state.reads=state.reads.filter(item=>item?.conversationId!==conversationId);
  state.replies=state.replies.filter(item=>item?.conversationId!==conversationId);
  saveDelayedDmState(state);
  scheduleDelayedDmTimer();
}

  try{
    const raw=localStorage.getItem(DELAYED_GROUP_STATE_KEY);
    const parsed=raw?JSON.parse(raw):{};
    return {
      reads:Array.isArray(parsed.reads)?parsed.reads:[],
      replies:Array.isArray(parsed.replies)?parsed.replies:[]
    };

  }
}

function saveDelayedGroupState(state){
  localStorage.setItem(
    DELAYED_GROUP_STATE_KEY,
    JSON.stringify({
      reads:Array.isArray(state?.reads)?state.reads.slice(-300):[],
      replies:Array.isArray(state?.replies)?state.replies.slice(-150):[]
    })

function clearDelayedGroupReplyByEventId(eventId){
  if(!eventId)return;
  const state=loadDelayedGroupState();
  const before=state.replies.length;
  state.replies=state.replies.filter(item=>item?.eventId!==eventId);
  if(state.replies.length!==before)saveDelayedGroupState(state);
}

function scheduleDelayedGroupTimer(){
  clearTimeout(appState.delayedGroupTimer);

  const state=loadDelayedGroupState();
  const now=Date.now();
  const times=[
    ...state.reads.map(item=>Date.parse(item?.readAt||"")),
    ...state.replies.map(item=>delayedReplyNextTriggerMs(item,now))
  ].filter(Number.isFinite);

  if(!times.length)return;

  const next=Math.min(...times);
  const delay=Math.max(250,Math.min(60*1000,next-Date.now()));
  appState.delayedGroupTimer=setTimeout(processDelayedGroupState,delay);
}

async function processDelayedGroupState(){
  const state=loadDelayedGroupState();
  const now=Date.now();
  let changed=false;

  // 既読は各人物ごとに独立して増える。
  const remainingReads=[];
  for(const item of state.reads){
    const due=Date.parse(item?.readAt||"");

    if(Number.isFinite(due)&&due<=now){
      markGroupOutgoingReadThrough(
        item.conversationId,
        item.characterId,
        item.throughCreatedAt,
        item.readAt
      );
      changed=true;
    }else{
      remainingReads.push(item);
    }
  }
  state.reads=remainingReads;

  // グループも各人物の返信予定直前だけ、その人物名で入力中表示する。
  const groupTypingCandidate=state.replies
    .filter(item=>{
      const due=Date.parse(item?.replyAt||"");
      const start=delayedReplyTypingStartMs(item);
      return item?.conversationId===appState.activeConversationId&&Number.isFinite(due)&&Number.isFinite(start)&&start<=now&&now<due;
    })
    .sort((a,b)=>Date.parse(a.replyAt)-Date.parse(b.replyAt))[0];
  if(groupTypingCandidate)showScheduledTyping("group",groupTypingCandidate);

  // 返信は、その人物の既読を必ず付けてから表示する。
  const sortedReplies=[...state.replies].sort(
    (a,b)=>Date.parse(a?.replyAt||"")-Date.parse(b?.replyAt||"")
  );
  const remainingReplies=[];

  for(const item of sortedReplies){
    const due=Date.parse(item?.replyAt||"");

    if(!Number.isFinite(due)||due>now){
      remainingReplies.push(item);
      continue;
    }

    const conversation=conversationById(item.conversationId);
    if(!conversation||conversation.type!=="group"){
      changed=true;
      continue;
    }

    markGroupOutgoingReadThrough(
      item.conversationId,
      item.characterId,
      item.throughCreatedAt,
      item.readAt||item.replyAt
    );

    const existing=loadConversationMessages(item.conversationId)
      .some(message=>
        (item.eventId&&message.pushEventId===item.eventId)||
        message.id===item.localMessageId
      );

    if(item.reaction?.emoji){
      addReactionToMessage(item.conversationId,item.reaction.targetMessageId,item.characterId,item.reaction.emoji,item.replyAt);
    }
    if(!existing&&String(item.reply||"").trim()){
      const visible=
        appState.activeConversationId===item.conversationId&&
        !chatScreen.hidden&&
        document.visibilityState==="visible";

      clearScheduledTyping(scheduledTypingToken("group",item));

      addMessage(
        item.conversationId,
        item.characterId,
        String(item.reply).trim(),
        {
          id:item.localMessageId,
          pushEventId:item.eventId||null,
          createdAt:item.replyAt,
          source:item.eventId
            ?"scheduled-group-reply-local"
            :"delayed-group-reply-local",
          seenByUser:visible,
          awayUpdate:item.awayUpdate||null,
          ...replyQuoteOptions(item.conversationId,item.replyTo)
        }
      );
    }

    if(item.conversationRestUpdate)applyConversationRestUpdate(item.conversationRestUpdate);
    if(item.eventId)ackDelayedReplyEvent(item.eventId);
    changed=true;
  }

  state.replies=remainingReplies;

  if(changed)saveDelayedGroupState(state);
  scheduleDelayedGroupTimer();
  refreshScheduledTypingForActiveConversation();
}

function enqueueDelayedGroupResult(conversation,userMessage,result){
  const groupTiming=result?.groupTiming;
  const replies=Array.isArray(result?.replies)?result.replies.slice(0,36):[];

  if(
    !groupTiming?.enabled ||
    !Array.isArray(groupTiming.readTimings) ||
    !replies.length
  ){
    return false;
  }

  const state=loadDelayedGroupState();
  const tokenBase=`${conversation.id}-${userMessage.id}`;

  // 同じユーザーメッセージに対する古い予約だけ除去。
  state.reads=state.reads.filter(
    item=>!String(item?.token||"").startsWith(`${tokenBase}-`)
  );
  state.replies=state.replies.filter(
    item=>!String(item?.token||"").startsWith(`${tokenBase}-`)
  );

  for(const timing of groupTiming.readTimings){
    if(
      !characterById(timing?.characterId) ||
      !timing?.readAt
    )continue;

    state.reads.push({
      token:`${tokenBase}-read-${timing.characterId}`,
      conversationId:conversation.id,
      characterId:timing.characterId,
      throughCreatedAt:userMessage.createdAt,
      readAt:timing.readAt
    });
  }

  for(let index=0;index<replies.length;index+=1){
    const reply=replies[index];
    const timing=reply?.replyTiming;
    if(
      !characterById(reply?.speakerId) ||
      !String(reply?.message||"").trim() ||
      !timing?.replyAt
    )continue;

    const eventId=reply?.scheduledReply?.eventId||null;
    const token=`${tokenBase}-reply-${index}-${reply.speakerId}`;
    const groupReplyText=String(reply.message).trim();
    const sequenceGapMs=Number(reply?.sequenceGapMs||0);
    const groupTypingDurationMs=reply?.sequenceContinuation
      ? (sequenceGapMs>=1000?Math.max(0,Math.min(replyTypingDurationMs(groupReplyText,{group:true}),sequenceGapMs-180)):0)
      : replyTypingDurationMs(groupReplyText,{group:true});

    state.replies.push({
      token,
      conversationId:conversation.id,
      characterId:reply.speakerId,
      throughCreatedAt:userMessage.createdAt,
      reply:groupReplyText,
      typingDurationMs:groupTypingDurationMs,
      typingStartAt:reply?.sequenceContinuation&&sequenceGapMs<1000?"":String(timing.typingStartAt||typingStartIso(timing.replyAt,groupTypingDurationMs,timing.readAt)),
      reaction:normalizeReactionEmoji(reply?.reaction?.emoji)?{emoji:normalizeReactionEmoji(reply.reaction.emoji),targetMessageId:String(reply.reaction.targetMessageId||userMessage.id)}:null,
      replyTo:reply?.replyTo||null,
      readAt:timing.readAt||"",
      replyAt:timing.replyAt,
      eventId,
      awayUpdate:reply?.scheduledReply?.awayUpdate||reply?.awayUpdate||null,
      conversationRestUpdate:reply?.conversationRestUpdate||(index===replies.length-1?result?.conversationRestUpdate:null),
      localMessageId:eventId
        ?`push-${eventId}`
        :`delayed-group-${token}`
    });
  }

  saveDelayedGroupState(state);
  processDelayedGroupState();
  return true;
}

function removeDelayedGroupForConversation(conversationId){
  const state=loadDelayedGroupState();
  state.reads=state.reads.filter(item=>item?.conversationId!==conversationId);
  state.replies=state.replies.filter(item=>item?.conversationId!==conversationId);

}

async function recentHistoryWithLatestImageForAPI(conversationId){
  const source=loadConversationMessages(conversationId).slice(-40);
  const out=recentHistoryForAPI(conversationId);
  let latestIndex=-1;
  for(let i=source.length-1;i>=0;i-=1){if(source[i]?.senderId==="mashiro"&&messageTypeOf(source[i])==="image"&&source[i]?.mediaId){latestIndex=i;break;}}
  if(latestIndex<0)return out;
  // 画像の直後に別のましろ発言がある場合は、古い画像を毎回再送しない。
  for(let i=latestIndex+1;i<source.length;i+=1){if(source[i]?.senderId==="mashiro")return out;}
  try{
    const record=await getMediaRecord(source[latestIndex].mediaId);if(record?.blob){out[latestIndex].imageDataUrl=await blobToDataUrl(record.blob);}
  }catch{}
  return out;
}

async function fetchJsonWithRetry(endpoint,options,retries=1){let lastError;for(let attempt=0;attempt<=retries;attempt++){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),60000);try{const response=await fetch(endpoint,{...options,signal:controller.signal,cache:"no-store"});const data=await response.json().catch(()=>({}));if(response.status===401){localStorage.removeItem(ACCESS_CODE_KEY);throw Object.assign(new Error("invalid_app_code"),{code:"invalid_app_code"});}if(!response.ok){const e=Object.assign(new Error(String(data?.error||`http_${response.status}`)),{code:[429,500,502,503,504].includes(response.status)?"temporary_error":response.status===403?"origin_not_allowed":"api_error"});throw e;}return data;}catch(error){lastError=error;const retryable=error?.name==="AbortError"||error instanceof TypeError||error?.code==="temporary_error";if(!retryable||attempt===retries)throw error;await sleep(1800);}finally{clearTimeout(timeout);}}throw lastError;}

async function callDmChat(conversation,accessCode,apiEndpoint){const c=characterById(conversation.characterId);const messages=await recentHistoryWithLatestImageForAPI(conversation.id);return fetchJsonWithRetry(apiEndpoint,{method:"POST",headers:{"Content-Type":"application/json","X-App-Code":accessCode},body:JSON.stringify({characterId:c.id,conversationId:conversation.id,messages,memories:memoriesForAPI(c.id),currentTime:new Date().toLocaleString("ja-JP",{dateStyle:"full",timeStyle:"short"}),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,characterActivityAt:characterActivityAtForAPI(),characterAway:characterAwayForAPI(),conversationRest:conversationRestForAPI(),deviceId:pushNotificationsEnabled()?getPushDeviceId():"",scheduleDelayedReply:true,clientVersion:PUSH_VERSION})});}
function privateMemoriesForGroup(group){const map={};for(const id of group.participants){if(id!=="mashiro"&&characterById(id))map[id]=memoriesForAPI(id);}return map;}
