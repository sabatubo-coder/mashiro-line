<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f7f7f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ましろLINE" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
:root {
  color-scheme: light;
  --bg: #eef1f5;
  --panel: #f8f8fa;
  --text: #1c1c1e;
  --subtext: #73777f;
  --line: rgba(60, 60, 67, 0.16);
  --incoming: #ffffff;
  --outgoing: #d9f7be;
  --accent: #4d8f5b;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}

body {
  overscroll-behavior: none;
}

button, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-shell {
  min-height: 100dvh;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  background:
    linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.16)),
    var(--bg);
  overflow: hidden;
}

.topbar {
  min-height: 62px;
  padding: calc(7px + env(safe-area-inset-top)) 12px 7px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  background: rgba(248, 248, 250, .92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 5;
}

.topbar-side--left {
  font-size: 36px;
  line-height: 1;
  color: #9a9aa0;
  padding-left: 6px;
}

.profile-heading {
  display: flex;
  gap: 9px;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.profile-heading h1 {
  margin: 0;
  font-size: 16px;
  line-height: 1.15;
  font-weight: 700;
}

.status-text {
  margin: 2px 0 0;
  font-size: 10px;
  color: var(--subtext);
  text-align: left;
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 14px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}

.avatar--natsuki {
  background: #f3d99c;
  color: #6f5124;
}

.avatar--mini {
  width: 28px;
  height: 28px;
  font-size: 11px;
  flex: 0 0 auto;
}

.icon-button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #62656b;
  font-size: 22px;
  cursor: pointer;
}

.icon-button:active { background: rgba(0,0,0,.06); }

.message-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 18px;
  scroll-behavior: smooth;
}

.day-divider {
  display: flex;
  justify-content: center;
  margin: 8px 0 14px;
}

.day-divider span {
  font-size: 11px;
  color: #73777f;
  background: rgba(255, 255, 255, .62);
  border-radius: 999px;
  padding: 4px 9px;
}

.message-row {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  margin: 0 0 10px;
}

.message-row--outgoing { justify-content: flex-end; }

.message-stack {
  display: flex;
  flex-direction: column;
  max-width: min(76%, 520px);
}

.message-row--outgoing .message-stack { align-items: flex-end; }
.message-row--incoming .message-stack { align-items: flex-start; }

.bubble {
  position: relative;
  padding: 9px 12px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: var(--shadow);
}

.bubble--incoming {
  background: var(--incoming);
  border-bottom-left-radius: 5px;
}

.bubble--outgoing {
  background: var(--outgoing);
  border-bottom-right-radius: 5px;
}

.message-meta {
  min-height: 15px;
  margin-top: 3px;
  font-size: 10px;
  line-height: 1.2;
  color: #74777d;
  display: flex;
  gap: 5px;
}

.read-label { color: #777b82; }

.typing-row {
  min-height: 46px;
  display: none;
  align-items: center;
  gap: 7px;
  padding: 4px 12px 8px;
}

/* 表示状態は hidden 属性ではなく専用クラスで明示的に制御する */
.typing-row.is-visible {
  display: flex;
}

.typing-bubble {
  height: 32px;
  min-width: 54px;
  padding: 0 11px;
  background: #fff;
  border-radius: 16px 16px 16px 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: var(--shadow);
}

.typing-bubble span {
  width: 6px;
  height: 6px;
  background: #9b9ea4;
  border-radius: 50%;
  animation: typing 1.05s infinite ease-in-out;
}
.typing-bubble span:nth-child(2) { animation-delay: .12s; }
.typing-bubble span:nth-child(3) { animation-delay: .24s; }

.typing-label {
  font-size: 11px;
  color: var(--subtext);
}

@keyframes typing {
  0%, 55%, 100% { transform: translateY(0); opacity: .45; }
  25% { transform: translateY(-3px); opacity: 1; }
}

.composer {
  display: grid;
  grid-template-columns: 1fr 42px;
  gap: 8px;
  align-items: end;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: rgba(248, 248, 250, .96);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

#messageInput {
  width: 100%;
  max-height: 120px;
  resize: none;
  border: 1px solid rgba(60, 60, 67, .18);
  outline: none;
  border-radius: 20px;
  padding: 9px 13px;
  background: #fff;
  color: var(--text);
  font-size: 15px;
  line-height: 1.35;
  overflow-y: auto;
}

#messageInput:focus { border-color: rgba(77, 143, 91, .45); }

.send-button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 16px;
  cursor: pointer;
  padding-left: 4px;
}

.send-button:disabled {
  opacity: .35;
  cursor: default;
}

.dialog {
  border: 0;
  padding: 0;
  background: transparent;
  max-width: calc(100vw - 32px);
}

.dialog::backdrop { background: rgba(0,0,0,.28); }

.dialog-card {
  width: min(360px, calc(100vw - 32px));
  background: #fff;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 18px 60px rgba(0,0,0,.2);
}

.dialog-card h2 {
  font-size: 17px;
  margin: 0 0 8px;
}

.dialog-card p {
  font-size: 13px;
  line-height: 1.55;
  color: var(--subtext);
  margin: 0 0 18px;
}

.dialog-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.dialog-actions button {
  border: 0;
  border-radius: 10px;
  padding: 11px;
  font-weight: 600;
}

.dialog-secondary { background: #eceef1; }
.dialog-danger { background: #d94c4c; color: #fff; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@media (min-width: 700px) {
  body { display: grid; place-items: center; padding: 24px; }
  .app-shell {
    width: min(430px, 100%);
    min-height: min(860px, calc(100dvh - 48px));
    height: min(860px, calc(100dvh - 48px));
    border-radius: 28px;
    box-shadow: 0 20px 80px rgba(0,0,0,.16);
  }
  .topbar { padding-top: 9px; border-radius: 28px 28px 0 0; }
}

</style>
  <title>ましろLINE（仮）</title>
</head>
<body>
  <main class="app-shell" aria-label="夏樹とのトーク">
    <header class="topbar">
      <div class="topbar-side topbar-side--left" aria-hidden="true">‹</div>
      <div class="profile-heading">
        <div class="avatar avatar--natsuki" aria-hidden="true">夏</div>
        <div>
          <h1>夏樹</h1>
          <p id="statusText" class="status-text">オンライン</p>
        </div>
      </div>
      <button id="resetButton" class="icon-button" type="button" aria-label="トーク履歴を初期化">↻</button>
    </header>

    <section id="messageList" class="message-list" aria-live="polite" aria-label="メッセージ履歴"></section>

    <div id="typingRow" class="typing-row" aria-hidden="true">
      <div class="avatar avatar--mini avatar--natsuki" aria-hidden="true">夏</div>
      <div class="typing-bubble" aria-label="夏樹が入力中">
        <span></span><span></span><span></span>
      </div>
      <span class="typing-label">夏樹が入力中…</span>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="messageInput">メッセージ</label>
      <textarea id="messageInput" rows="1" maxlength="500" placeholder="メッセージ" enterkeyhint="send"></textarea>
      <button id="sendButton" class="send-button" type="submit" disabled aria-label="送信">➤</button>
    </form>
  </main>

  <dialog id="resetDialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <h2>トークを初期化しますか？</h2>
      <p>保存されている夏樹との履歴を削除して、最初の状態に戻します。</p>
      <div class="dialog-actions">
        <button value="cancel" class="dialog-secondary">キャンセル</button>
        <button id="confirmReset" value="default" class="dialog-danger">初期化</button>
      </div>
    </form>
  </dialog>

  <script>
const STORAGE_KEY = "mashiroLine.phase1.natsuki.messages.v1";

const messageList = document.getElementById("messageList");
const composer = document.getElementById("composer");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const typingRow = document.getElementById("typingRow");
const statusText = document.getElementById("statusText");
const resetButton = document.getElementById("resetButton");
const resetDialog = document.getElementById("resetDialog");
const confirmReset = document.getElementById("confirmReset");

let messages = loadMessages();
let isReplying = false;
let replyTimerIds = [];

function makeId() {
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function seedMessages() {
  const now = new Date();
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  yesterday.setHours(21, 18, 0, 0);

  return [
    {
      id: makeId(),
      sender: "natsuki",
      text: "じゃ、また明日",
      createdAt: yesterday.toISOString(),
      read: true
    }
  ];
}

function loadMessages() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const seeded = seedMessages();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
      return seeded;
    }
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : seedMessages();
  } catch {
    return seedMessages();
  }
}

function saveMessages() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
}

function formatTime(iso) {
  return new Intl.DateTimeFormat("ja-JP", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(new Date(iso));
}

function dayKey(date) {
  return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
}

function dayLabel(date) {
  const today = new Date();
  const y = new Date(today);
  y.setDate(today.getDate() - 1);

  if (dayKey(date) === dayKey(today)) return "今日";
  if (dayKey(date) === dayKey(y)) return "昨日";

  return new Intl.DateTimeFormat("ja-JP", {
    month: "numeric",
    day: "numeric",
    weekday: "short"
  }).format(date);
}

function renderMessages() {
  messageList.innerHTML = "";
  let previousDay = null;

  for (const message of messages) {
    const date = new Date(message.createdAt);
    const currentDay = dayKey(date);

    if (currentDay !== previousDay) {
      const divider = document.createElement("div");
      divider.className = "day-divider";
      const label = document.createElement("span");
      label.textContent = dayLabel(date);
      divider.appendChild(label);
      messageList.appendChild(divider);
      previousDay = currentDay;
    }

    const outgoing = message.sender === "mashiro";
    const row = document.createElement("article");
    row.className = `message-row ${outgoing ? "message-row--outgoing" : "message-row--incoming"}`;
    row.dataset.messageId = message.id;

    if (!outgoing) {
      const avatar = document.createElement("div");
      avatar.className = "avatar avatar--mini avatar--natsuki";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = "夏";
      row.appendChild(avatar);
    }

    const stack = document.createElement("div");
    stack.className = "message-stack";

    const bubble = document.createElement("div");
    bubble.className = `bubble ${outgoing ? "bubble--outgoing" : "bubble--incoming"}`;
    bubble.textContent = message.text;

    const meta = document.createElement("div");
    meta.className = "message-meta";

    if (outgoing && message.read) {
      const read = document.createElement("span");
      read.className = "read-label";
      read.textContent = "既読";
      meta.appendChild(read);
    }

    const time = document.createElement("time");
    time.dateTime = message.createdAt;
    time.textContent = formatTime(message.createdAt);
    meta.appendChild(time);

    stack.appendChild(bubble);
    stack.appendChild(meta);
    row.appendChild(stack);
    messageList.appendChild(row);
  }
}

function scrollToBottom(behavior = "smooth") {
  requestAnimationFrame(() => {
    messageList.scrollTo({ top: messageList.scrollHeight, behavior });
  });
}

function setTyping(visible) {
  typingRow.classList.toggle("is-visible", visible);
  typingRow.setAttribute("aria-hidden", visible ? "false" : "true");
  statusText.textContent = visible ? "入力中…" : "オンライン";
  if (visible) scrollToBottom();
}

function autosizeInput() {
  messageInput.style.height = "auto";
  messageInput.style.height = `${Math.min(messageInput.scrollHeight, 120)}px`;
  sendButton.disabled = messageInput.value.trim().length === 0 || isReplying;
}

function addMessage(sender, text, read = false) {
  const message = {
    id: makeId(),
    sender,
    text,
    createdAt: new Date().toISOString(),
    read
  };
  messages.push(message);
  saveMessages();
  renderMessages();
  scrollToBottom();
  return message;
}

function markOutgoingAsRead() {
  let changed = false;
  for (const message of messages) {
    if (message.sender === "mashiro" && !message.read) {
      message.read = true;
      changed = true;
    }
  }
  if (changed) {
    saveMessages();
    renderMessages();
    scrollToBottom("auto");
  }
}

function chooseMockReply(text) {
  const t = text.trim();

  if (/疲れ|つかれ|しんど|だる/.test(t)) {
    return randomOf(["おつかれ。今日大変だった？", "そっか。おつかれ、ましろ", "今日なんかあった？"]);
  }
  if (/帰った|帰る|家/.test(t)) {
    return randomOf(["そっか。オレももうちょいで帰る", "もう家？", "気をつけて帰れよー"]);
  }
  if (/暑|あつ/.test(t)) {
    return randomOf(["今日やばかったな", "わかる。外出た瞬間むりってなった", "明日も暑いらしいぞ"]);
  }
  if (/昼|ごはん|飯|弁当|購買/.test(t)) {
    return randomOf(["明日も屋上行く？", "オレまだなんか食べたい", "購買、今日混んでたよな"]);
  }
  if (/おはよ|おはよう/.test(t)) {
    return randomOf(["おはよ", "おはよー。眠そう", "ちゃんと起きたじゃん"]);
  }
  if (/おやすみ|寝る/.test(t)) {
    return randomOf(["ん、おやすみ", "また明日な", "ちゃんと寝ろよー"]);
  }
  if (/ありがとう|ありがと/.test(t)) {
    return randomOf(["ん", "どーいたしまして", "それくらい別にいいって"]);
  }
  if (/ごめん|ごめ/.test(t)) {
    return randomOf(["いや、全然", "気にしてないって", "そんな謝んなくていいよ"]);
  }
  if (/暇|ひま/.test(t)) {
    return randomOf(["オレもちょっと暇", "じゃあなんか話す？", "珍しいな、ましろからそれ言うの"]);
  }
  if (/[？?]$/.test(t)) {
    return randomOf(["たぶんそう", "んー、どうだろ", "オレはそう思うけど"]);
  }

  return randomOf([
    "ん、わかる",
    "そうなんだ",
    "ましろ、それ今言う？笑",
    "へー。ちょっと意外",
    "そっか",
    "それで？",
    "なるほどなー"
  ]);
}

function randomOf(items) {
  return items[Math.floor(Math.random() * items.length)];
}

function scheduleMockReply(userText) {
  isReplying = true;
  autosizeInput();

  const readDelay = 450 + Math.random() * 500;
  const typingDelay = readDelay + 500 + Math.random() * 700;
  const replyText = chooseMockReply(userText);
  const typingDuration = 900 + Math.min(replyText.length * 55, 2200) + Math.random() * 700;

  replyTimerIds.push(setTimeout(() => {
    markOutgoingAsRead();
  }, readDelay));

  replyTimerIds.push(setTimeout(() => {
    setTyping(true);
  }, typingDelay));

  replyTimerIds.push(setTimeout(() => {
    setTyping(false);
    addMessage("natsuki", replyText, true);
    isReplying = false;
    autosizeInput();
  }, typingDelay + typingDuration));
}

composer.addEventListener("submit", (event) => {
  event.preventDefault();
  if (isReplying) return;

  const text = messageInput.value.trim();
  if (!text) return;

  addMessage("mashiro", text, false);
  messageInput.value = "";
  autosizeInput();
  scheduleMockReply(text);
});

messageInput.addEventListener("input", autosizeInput);
messageInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    composer.requestSubmit();
  }
});

resetButton.addEventListener("click", () => {
  if (typeof resetDialog.showModal === "function") {
    resetDialog.showModal();
  } else if (window.confirm("トーク履歴を初期化しますか？")) {
    resetConversation();
  }
});

confirmReset.addEventListener("click", () => {
  resetConversation();
});

function resetConversation() {
  for (const id of replyTimerIds) clearTimeout(id);
  replyTimerIds = [];
  isReplying = false;
  setTyping(false);
  messages = seedMessages();
  saveMessages();
  renderMessages();
  autosizeInput();
  setTimeout(() => scrollToBottom("auto"), 0);
}

function registerServiceWorker() {
  if ("serviceWorker" in navigator) {
    let reloadingForUpdate = false;

    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloadingForUpdate) return;
      reloadingForUpdate = true;
      window.location.reload();
    });

    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js", { updateViaCache: "none" })
        .then((registration) => registration.update())
        .catch(() => {
          // HTTPS/localhost 以外では登録できないため、UIはそのまま利用する。
        });
    });
  }
}

setTyping(false);
renderMessages();
autosizeInput();
setTimeout(() => scrollToBottom("auto"), 0);
registerServiceWorker();

</script>
</body>
